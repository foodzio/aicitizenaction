# Weekly: link check of the whole tree (two-consecutive-failures rule; confirmed failures open
# one issue each, naming the record's owners), the freshness report, and steward check-ins.
# The freshness report goes to the run summary, and to GitHub Discussions when the owner has set
# the repository variable DISCUSSION_CATEGORY_ID (docs/github-setup.md §4).
name: Weekly
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore previous link-check state
        uses: actions/cache/restore@v4
        with:
          path: .linkcheck
          key: linkcheck-state-${{ github.run_id }}
          restore-keys: linkcheck-state-
      - run: mkdir -p .linkcheck
      - name: Check every URL
        run: node scripts/check-links.mjs --state .linkcheck/state.json --out .linkcheck/out.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Save link-check state
        uses: actions/cache/save@v4
        with:
          path: .linkcheck
          key: linkcheck-state-${{ github.run_id }}
      - name: Open issues for confirmed failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/file-link-issues.mjs .linkcheck/out.json
      - name: Freshness report
        run: node scripts/freshness.mjs --link-state .linkcheck/state.json --summary "$GITHUB_STEP_SUMMARY" > freshness.md
      - name: Post the report to Discussions
        if: vars.DISCUSSION_CATEGORY_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: ${{ vars.DISCUSSION_CATEGORY_ID }}
        run: |
          repo_id=$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){id}}' -f o="${GITHUB_REPOSITORY%/*}" -f n="${GITHUB_REPOSITORY#*/}" --jq .data.repository.id)
          gh api graphql -f query='mutation($r:ID!,$c:ID!,$t:String!,$b:String!){createDiscussion(input:{repositoryId:$r,categoryId:$c,title:$t,body:$b}){discussion{url}}}' \
            -f r="$repo_id" -f c="$CATEGORY" -f t="Freshness report $(date -u +%Y-%m-%d)" -f b="$(cat freshness.md)"
      - name: Steward check-ins
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/inactivity.mjs
