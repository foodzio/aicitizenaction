# Weekly: link check of the whole tree (two-consecutive-failures rule; confirmed failures open
# one issue each, naming the record's owners), the freshness report, and steward check-ins.
# The freshness report goes to the run summary, and to GitHub Discussions when the owner has set
# the repository variable DISCUSSION_CATEGORY_ID (docs/github-setup.md §4).
name: Weekly
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore previous link-check state
        uses: actions/cache/restore@v4
        with:
          path: .linkcheck
          key: linkcheck-state-${{ github.run_id }}
          restore-keys: linkcheck-state-
      - run: mkdir -p .linkcheck
      - name: Run full directory integrity audit
        id: directory_audit
        continue-on-error: true
        run: node scripts/directory-audit.mjs --full --link-state .linkcheck/state.json
      - name: Add directory audit to summary
        if: always() && hashFiles('tmp/directory-audit/report.md') != ''
        run: cat tmp/directory-audit/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save link-check state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .linkcheck
          key: linkcheck-state-${{ github.run_id }}
      - name: Open issues for confirmed failures
        if: always() && hashFiles('tmp/directory-audit/links.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/file-link-issues.mjs tmp/directory-audit/links.json
      - name: Reconcile stable directory finding issues
        if: always() && hashFiles('tmp/directory-audit/report.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/file-directory-issues.mjs tmp/directory-audit/report.json
      - name: Freshness report
        if: always()
        run: node scripts/freshness.mjs --link-state .linkcheck/state.json --summary "$GITHUB_STEP_SUMMARY" > freshness.md
      - name: Upload retained integrity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directory-audit-full-${{ github.run_id }}
          path: |
            tmp/directory-audit/
            .linkcheck/state.json
            freshness.md
          retention-days: 400
      - name: Post the report to Discussions
        if: always() && vars.DISCUSSION_CATEGORY_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: ${{ vars.DISCUSSION_CATEGORY_ID }}
        run: |
          repo_id=$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){id}}' -f o="${GITHUB_REPOSITORY%/*}" -f n="${GITHUB_REPOSITORY#*/}" --jq .data.repository.id)
          gh api graphql -f query='mutation($r:ID!,$c:ID!,$t:String!,$b:String!){createDiscussion(input:{repositoryId:$r,categoryId:$c,title:$t,body:$b}){discussion{url}}}' \
            -f r="$repo_id" -f c="$CATEGORY" -f t="Freshness report $(date -u +%Y-%m-%d)" -f b="$(cat freshness.md)"
      - name: Steward check-ins
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/inactivity.mjs
      - name: Enforce directory publication gate
        if: always() && steps.directory_audit.outcome == 'failure'
        run: exit 1
