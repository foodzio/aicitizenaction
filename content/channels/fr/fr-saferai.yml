strings:
  name: SaferAI
  remit: "Non-profit focused on AI risk management. Three arms: research (quantitative risk models — nine cyber risk models completed, expanding to loss of control and CBRN); ratings (independent grading of how well leading AI companies manage risk, across risk identification, severity assessment, safeguards and governance, published at ratings.safer-ai.org); and standards (leads AI risk management standards work in the EU and edits international red-teaming standards)."
  threat_model: Risk-management adequacy at frontier developers — explicitly covering cyber, loss of control and CBRN. Methodologically the most rigorous of the company-rating projects, borrowing from mature safety-critical industries.
  reality_check: Small, technically serious and European — which matters, because it has standing in the EU standardisation processes that most US safety organisations do not. Responsive to substantive technical input on risk methodology.
  gov_channel: Real in Europe — SaferAI staff serve as editors on international standards and participate in EU AI Act standardisation and the GPAI Code of Practice process.
  routes:
