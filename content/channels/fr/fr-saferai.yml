strings:
  name: SaferAI
  remit: "Non-profit focused on AI risk management. Three arms: research (quantitative risk models — nine cyber risk models completed, expanding to loss of control and CBRN); ratings (independent grading of how well leading AI companies manage risk, across risk identification, severity assessment, safeguards and governance, published at ratings.safer-ai.org); and standards (leads AI risk management standards work in the EU and edits international red-teaming standards)."
  threat_model: Risk-management adequacy at frontier developers — explicitly covering cyber, loss of control and CBRN. Methodologically the most rigorous of the company-rating projects, borrowing from mature safety-critical industries.
  reality_check: Small, technically serious and European — which matters, because it has standing in the EU standardisation processes that most US safety organisations do not. Responsive to substantive technical input on risk methodology.
  gov_channel: Real in Europe — SaferAI staff serve as editors on international standards and participate in EU AI Act standardisation and the GPAI Code of Practice process.
  routes:
    general-enquiries:
      label: General enquiries
      scope: Anyone
    company-risk-management-ratings:
      label: Company risk-management ratings portal
      scope: Public read; methodology published
      note: UNVERIFIED whether they accept public submissions of evidence about a company's practices — worth asking via contact@.
    homepage:
      label: Homepage
    action:
      label: Action page
  the_ask: AI companies should be held to real risk-management standards, and governance should be built on rigorous, auditable frameworks rather than voluntary promises.
  what_they_do: Research on risk management frameworks, public ratings of AI companies' safety practices (ratings.safer-ai.org), and standards work in EU and international governance processes.
  newcomer_action: Read and cite the company ratings when arguing with policymakers or employers; donate; apply for an open role.
  tips: unclear
  geography: France (Paris) and EU-level; registered French nonprofit, reg. no. 919 185 199 00016.
  scale: Small technical nonprofit; headcount not published.
  spending: Not disclosed.
  caution: A research and standards body, not a campaign — there is no membership or activist route. Its ratings are useful ammunition for other people's campaigns.
