strings:
  name: Mistral AI
  remit: No publicly named safety or alignment function. Trust Center covers data protection and security compliance; the Usage Policy is enforced through a content-reporting form.
  reality_check: No public accounts found of anyone reaching a Mistral safety function. No safety@ or disclosure@ address is published anywhere on mistral.ai or legal.mistral.ai — checked the contact page, terms, and usage policy directly. The report form's requirement of a content URL structurally prevents reporting a capability or alignment finding.
  notes: "For a European frontier developer this is a thin public surface: not found — general contact only, at https://mistral.ai/contact. If you have a model-safety finding, the HackerOne form is the only route with a human triage attached, but it is framed as security. No safe-harbour language and no whistleblower channel found."
  routes:
    content-usage-policy-report:
      label: Content / usage policy report form
      scope: "21 categories of content violation (hate speech, CSAM, violence, NCII, fraud, IP). Intro: 'Mistral AI is committed to maintaining a safe environment for all. This form allows you to report content you believe violates our terms or applicable laws.'"
      note: Content moderation, not model safety. Requires you to supply a URL or a shared private chat link to the offending content — so it cannot be used to report a general model flaw.
    hackerone-vulnerability-submission:
      label: HackerOne vulnerability submission
      scope: Security vulnerabilities. Published on the contact page, which notes 'General bugs shall be reported via our standard support channels'.
      note: No stated AI/model safety scope.
    press:
      label: Press
      scope: Media enquiries only.
      note: Listed here only because it is one of the few published addresses.
    homepage:
      label: Homepage
    framework:
      label: No published frontier safety framework or responsible scaling policy found
