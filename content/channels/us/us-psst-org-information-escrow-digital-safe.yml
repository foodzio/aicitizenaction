strings:
  name: Psst.org — information escrow / 'digital safe'
  remit: Concerns from tech and AI workers, at any level of completeness — explicitly including partial information, 'one line of code that is a red flag', or a general unease. Designed as a 'lower stakes way' to report without becoming a formal whistleblower.
  reality_check: The best-designed entry point for someone who is not sure they have enough to act on — which is the most common real situation. The escrow model directly addresses the collective action problem that keeps individuals silent. Free. Growing institutional credibility (appointed a full-time ED in March 2026, covered by Semafor as the main nonprofit connecting tech whistleblowers for AI oversight). No public record of enforcement outcomes, by design.
  accepts: Concerns from tech and AI workers, at any level of completeness — explicitly including partial information, 'one line of code that is a red flag', or a general unease. Designed as a 'lower stakes way' to report without becoming a formal whistleblower.
  does_not_accept: It is not a regulator and cannot take enforcement action. It will not publish on your behalf without your decision.
  how: "Deposit information into the secure escrow. The model is the key innovation: multiple people can contribute pieces of a puzzle, and Psst determines whether actionable evidence exists across depositors before anyone has to expose themselves individually. You then receive guidance on appropriate disclosure channels."
  format: Whatever you have — documents, notes, a description of a concern.
  timing: Rolling.
  after: Psst assesses, advises on next steps, and can connect you onward to counsel or to coordinated disclosure.
  operator: Psst.org, a nonprofit; Executive Director Jennifer Gibson; board includes Mark MacGann (Uber Files) and Ed Pierson (Boeing 737 MAX)
