strings:
  name: AI Whistleblower Protection Act (S.1792) — federal, not law
  remit: N/A — not enacted.
  reality_check: "Zero protection as of September 2026. Be precise about this in any playbook: a US AI worker has no AI-specific federal whistleblower statute. Their available routes are SB 53 (if California and catastrophic risk), SEC/Dodd-Frank (if securities fraud at a public company), state law, and contract/NDA analysis with counsel. The Right to Warn letter of June 2024 — signed by current and former OpenAI and Google DeepMind staff, asking for an anonymous process to raise risk concerns, an end to disparagement clauses and non-retaliation — produced voluntary company policy changes and Senate attention, but no enacted federal law."
  accepts: N/A — not enacted.
  does_not_accept: N/A
  how: N/A. Included because it is routinely and wrongly cited as existing protection. Introduced 15 May 2025; still in committee. It had sat in committee for roughly 495 days at the time of this research; of comparable Senate bills stuck in committee that long, about 1% ever advance.
