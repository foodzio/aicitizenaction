strings:
  name: The Midas Project
  remit: "Watchdog non-profit holding AI companies to their own stated commitments. Projects: Watchtower (tracks changes to and violations of corporate AI safety policies), the Seoul Tracker (whether 16 organisations met the Seoul frontier-safety commitments), The OpenAI Files (documented governance, leadership and culture concerns at OpenAI), and Model Republic (industry influence on policymakers)."
  threat_model: Corporate accountability and commitment-drift — the concern that voluntary safety commitments quietly erode. Agnostic between threat models; it tracks whatever companies promised, which spans misuse, catastrophic risk and governance.
  reality_check: "Tiny, and it absolutely reads its inbox — the single best target in this list for someone with concrete non-public evidence about an AI company's conduct. Note their own advice: if you are an employee considering disclosure, contact the AI Whistleblower Initiative first for independent legal guidance before approaching any journalist or watchdog."
  gov_channel: Indirect but potent — its findings get picked up by press and cited in policy debate; The OpenAI Files fed directly into scrutiny of OpenAI's restructuring.
  routes:
    submit-tip-best-designed:
      label: Submit a tip — the best-designed whistleblower-adjacent intake in this list
      scope: Anyone with specific, non-public, evidence-backed information; they particularly want evidence of gaps between public statements and internal practice
      note: Accepts texts, emails, documents, photos, reports. Signal preferred for sensitive material.
    signal-username:
      label: Signal (encrypted) — username
      scope: Sensitive tips; no name required
      note: Verified on the tips page. They warn no app protects a compromised device.
    general-enquiries:
      label: General enquiries (explicitly NOT recommended for confidential material)
      scope: Non-sensitive
    contact-form:
      label: Contact form
      scope: General
    homepage:
      label: Homepage
    action:
      label: Action page
  the_ask: AI companies should keep the safety and transparency commitments they have publicly made, and be held accountable when they quietly walk them back.
  what_they_do: "Corporate watchdog work: the Watchtower tracker of silent changes to AI company policies, investigations, scorecards, and the OpenAI Files. Runs modelrepublic.org and openaifiles.org."
  newcomer_action: Send a tip if you have inside knowledge of an AI company; otherwise sign up as a volunteer, join the Discord and help with research or amplifying campaigns.
  tips: yes — dedicated tip page at themidasproject.com/tips, aimed at industry insiders
  geography: United States (company-focused, global reach).
  scale: "Tiny: founded early 2024 by Tyler Johnston, 'a small core team' plus volunteers. 501(c)(3), EIN 99-2326977."
  spending: Not disclosed.
  caution: Adversarial toward specific named companies. If you work at an AI lab, sending a tip may breach your employment agreement — take legal advice first; the organisation is small and cannot indemnify you.
