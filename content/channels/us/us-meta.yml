strings:
  name: Meta
  remit: Internal governance function plus a Chief AI Officer and a Director of Alignment and Risk who receive non-compliance reports under the Advanced AI Scaling Framework; preparedness reports are published at model release.
  reality_check: Meta publishes more named routes than most, but responsiveness is the documented problem. Cybernews reported researchers complaining on Reddit that 'Meta wasn't even reacting to their reports about allegedly critical bugs', with some 'still waiting for a response months after submitting the report'; Meta received nearly 10,000 reports in 2024 and deemed only around 600 valid. The article notes one researcher who published a 'horrible experience' publicly got a reply within 10 hours and a generous bounty — i.e. public pressure works where the queue does not. AI Frontiers groups Meta with Google and xAI as excluding jailbreaks from vulnerability programs.
  notes: The llama_output_feedback form is the right door for a harmful-output finding; expect no acknowledgement. The Advanced AI Scaling Framework's whistleblower protocol is employees-only — reports route to 'the internal governance function, the Chief AI Officer, and the Director of Alignment and Risk' — with no external equivalent. No public safe-harbour language for AI safety research was found.
  routes:
    llama-policy-violation-reports:
      label: Llama policy violation reports
      scope: Reporting violations of the Llama Acceptable Use Policy (i.e. someone else misusing the model).
      note: Published verbatim in the Llama use policy. Aimed at misuse by third parties, not at model flaws.
    risky-content-model-output:
      label: Risky content / model output feedback
      scope: Reporting risky or harmful content produced by Llama models.
      note: The closest thing Meta has to a model-behaviour channel. Published in the Llama AUP.
    meta-security-whitehat:
      label: Meta security / Whitehat
      scope: Security bugs and vulnerabilities.
      note: Published in the Llama AUP as the route for 'security concerns'.
    meta-bug-bounty-genai:
      label: Meta Bug Bounty — GenAI payout guidelines
      scope: GenAI reports assessed by security impact; the page states it illustrates 'how we assess the security impact' of reports.
      note: Page is JS-rendered; could not read scope text directly. Security-impact framing implies pure model-safety/jailbreak reports do not qualify.
    model-issues-via-github:
      label: Model issues via GitHub
      scope: Technical model issues.
      note: Listed in the Llama AUP as the route for 'model issues'.
    homepage:
      label: Homepage
    framework:
      label: Advanced AI Scaling Framework, Version 2 (7 April 2026)
