strings:
  name: US federal rulemaking comments — Regulations.gov
  remit: Comments from anyone, including non-US persons, on proposed rules, requests for information and requests for comment. No affiliation required.
  reality_check: Genuinely high-leverage and widely underrated for an unaffiliated person, precisely because of the legal duty to respond to significant comments — no other consultation mechanism in this list carries an enforceable response obligation. A single well-evidenced technical comment on a low-volume AI docket can shape a final rule. A form letter does nothing.
  accepts: Comments from anyone, including non-US persons, on proposed rules, requests for information and requests for comment. No affiliation required.
  does_not_accept: "It is not a vote. Identical mass comments carry no extra weight: 'multiple identical comments are not likely to be more persuasive than if the comment had been sent only once,' and the number of comments for or against does not determine whether a rule proceeds."
  how: "Search the docket number on regulations.gov, click 'Comment Now!', complete the fields and attach or type your comment. Live AI-relevant examples at the time of this research: NIST-2026-0100 (Modernizing the National Vulnerability Database in the Age of AI, comments due 13 October 2026) and NIST-2025-0035 (Security Considerations for AI Agents, closed 9 March 2026 with 937 comments)."
  format: "No length limit, but substance over volume. What works: explain concretely how the policy would affect a specific situation, supply reasoning and evidence, or offer a perspective the agency has not previously considered. What fails: bare statements of support or opposition. Agencies invite 'concrete examples, best practices, case studies, and actionable recommendations.'"
  timing: Typically a 30–60 day window after a proposed rule is issued; the deadline is stated in the preamble of each notice. RFIs vary.
  after: Comments are posted publicly on the docket. Agencies must respond to significant, relevant comments when publishing a final rule, and may explain how comments changed the rule. Inadequate response to significant comments is a ground for legal challenge.
  operator: eRulemaking Program (US federal government); individual agencies own each docket
