strings:
  name: Allen Institute for AI (Ai2)
  remit: No separately named safety or alignment function. Responsible Use Guidelines govern OLMo, Molmo, Tulu and Ai2 tools; the organisation argues openness is itself the safety mechanism.
  reality_check: No public accounts found of people reporting model safety issues to Ai2. As a nonprofit research institute that publishes weights, training data and evaluations openly, most criticism and correction happens through papers, GitHub issues and Hugging Face rather than a disclosure channel — which is a genuinely different model of accountability, not an absence of one.
  notes: support@allenai.org is the published route and it explicitly covers unsafe generated content, so use it and say so. The guidelines have not been updated since June 2024, which is old relative to the model releases they cover. No safe-harbour language and no whistleblower channel found.
  routes:
    general-support-also-safety:
      label: General support — also the safety channel
      scope: "The Responsible Use Guidelines name this single address twice: for questions about the guidelines and violation reports, and for 'reporting bugs, security concerns, and inappropriate/unsafe content generated by Ai2 Tools'."
      note: One address for everything. Low ceremony, but at least explicitly covers unsafe model output.
    research-principles:
      label: Research principles
      scope: Statement of principles, not a contact channel.
    homepage:
      label: Homepage
    framework:
      label: Responsible use guidelines (last updated June 2024)
