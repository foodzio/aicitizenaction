strings:
  name: Amazon / AWS
  remit: Responsible AI function governing Nova frontier models and Bedrock Guardrails; the Frontier Model Safety Framework commits that Amazon 'will not deploy frontier AI models developed by Amazon that exceed specified risk thresholds without appropriate safeguards in place'.
  reality_check: No public accounts found of anyone successfully reaching an Amazon frontier-model safety function from outside. The Frontier Model Safety Framework publishes no contact channel, no external input process and no whistleblower route — verified by fetching the publication page. AWS's security channels are well-run and responsive for infrastructure, but there is no evidence they route AI safety concerns anywhere.
  notes: "This is a company with a published frontier safety framework and no published way to talk to the people who wrote it. For a model-behaviour issue with Nova or Bedrock, you are left with general AWS support. Record as: no meaningful public safety channel — general contact only."
  routes:
    aws-security-vulnerabilities:
      label: AWS security vulnerabilities
      scope: Security vulnerabilities in AWS services. AI model safety is not mentioned anywhere in the policy.
      note: Infra-only in practice.
    aws-abuse-trust-safety:
      label: AWS abuse / trust and safety
      scope: Suspected abuse of AWS resources (EC2, S3 etc.).
      note: Infrastructure abuse, not model behaviour.
    aws-vulnerability-disclosure-program:
      label: AWS Vulnerability Disclosure Program
      scope: Security only.
      note: Linked from the AWS vulnerability reporting page.
    aws-abuse-form:
      label: AWS abuse form
      scope: Reporting abusive use of AWS resources.
    homepage:
      label: Homepage
    framework:
      label: Amazon's Frontier Model Safety Framework (published 9 Feb 2025, updated 17 Sept 2026)
