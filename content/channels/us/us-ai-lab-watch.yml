strings:
  name: AI Lab Watch
  remit: "Scorecard grading Anthropic, Google DeepMind, OpenAI, Meta, xAI, Microsoft and DeepSeek across seven safety categories: risk assessment, scheming-risk prevention, safety research, misuse prevention, extreme security, risk information sharing, and planning for dangerous capabilities. Created and run solo by Zach Stein-Perlman."
  threat_model: Explicitly catastrophic-risk and loss-of-control framing — scheming, dangerous capabilities, weight security. The sharpest frontier-safety-only scorecard of the trackers.
  reality_check: DORMANT. The site states the author stopped maintaining it in September 2025, and no contact email is published. Do not route anything here. For a live equivalent use FLI's AI Safety Index, SaferAI's ratings, or the Midas Project's Seoul Tracker and Watchtower.
  gov_channel: None formal.
