strings:
  name: NVIDIA
  remit: NVIDIA PSIRT handles product security including AI-specific concerns; a Trustworthy AI function publishes model cards and the NeMo Guardrails tooling.
  reality_check: No public complaints found about NVIDIA PSIRT being unresponsive; PSIRT is an established, publicly active team (it posts as @nvidiapsirt). The AI-concern category on the VDP intake form is genuine and unusual. Note that from 1 October 2026 NVIDIA PSIRT will publish security bulletins only on GitHub (github.com/nvidia/product-security), so that is where to watch for outcomes.
  notes: The intake form's 'NVIDIA Artificial Intelligence (AI) Concern' option is the route to use — it is a real dropdown, not marketing. No explicit safe-harbour language was visible on the report-vulnerability page; check the PSIRT policies page before doing anything aggressive.
  routes:
    nvidia-psirt:
      label: NVIDIA PSIRT
      scope: Product security vulnerabilities and AI concerns.
      note: PGP key at https://www.nvidia.com/en-us/security/pgp-key/
    report-security-vulnerability-or:
      label: Report a Security Vulnerability or NVIDIA AI Concern
      scope: Explicitly includes 'AI vulnerability or hack, AI trust concern, malicious prompt engineering, data poisoning possibility'.
      note: One of the very few intake forms in this list that names AI trust concerns as a first-class category rather than excluding them.
    nvidia-public-bug-bounty:
      label: NVIDIA public bug bounty (Intigriti)
      scope: Paid security research.
    homepage:
      label: Homepage
    framework:
      label: NVIDIA Frontier AI Risk Assessment (17 February 2025)
