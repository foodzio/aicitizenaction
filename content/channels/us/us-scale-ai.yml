strings:
  name: Scale AI
  remit: Safety, Evaluations and Alignment Lab (SEAL) produces third-party model evaluations and red-teaming for other developers; internally a trust/security function runs disclosure.
  reality_check: Scale's public safety relevance is as an evaluator of others rather than a developer, so external safety reports about Scale itself are rare. Scale had a significant 2025 incident in which public Google Docs exposed confidential client project details and contractor data, surfaced by journalists rather than through disclosure. Since Meta's investment and the departure of leadership to Meta, SEAL's independence as a third-party evaluator has been publicly questioned — which matters if you are considering Scale as a neutral route for a finding about another lab.
  notes: vulnerabilities@scale.com is security-scoped. Scale is not a route for reporting concerns about frontier models generally, and its evaluator independence is contested post-Meta investment. No safe-harbour language found.
  routes:
    vulnerability-reports:
      label: Vulnerability reports
      scope: Responsible disclosure of security vulnerabilities. AI model safety is not mentioned.
      note: Published on scale.com/security. No formal bug bounty is described.
    trust-center:
      label: Trust Center
      scope: Compliance artifacts (SOC 2 Type II, ISO 27001, FedRAMP High, DoD IL4).
      note: Documentation, not an incident channel.
    homepage:
      label: Homepage
    framework:
      label: No frontier safety framework (not a frontier model developer); publishes evaluation methodology such as the AI Risk Matrix
