strings:
  name: Microsoft
  remit: Office of Responsible AI and a Chief Responsible AI Officer maintain the Responsible AI Standard and review revisions to the Frontier Governance Framework; MSRC handles security and an AI-specific severity bug bar.
  reality_check: "No large body of public complaints specific to Microsoft's AI safety intake, and the AI bug bar is unusually candid about what it will and will not investigate. The honest read: security-impacting AI bugs get a real, paid, well-run process through MSRC; pure model-behaviour findings get a 'Responsible AI' classification with no severity and no stated timeline, which is closer to a content-moderation queue than a safety review. Microsoft has publicly said it will pay out for high-impact bugs even outside formal bounty scope (The Register, Dec 2025)."
  notes: Use the AI bug bar page first to decide which door you are at — it is the single most useful triage document published by any company here. Safe harbour exists as 'Legal Safe Harbor' in the bounty terms at https://www.microsoft.com/en-us/msrc/bounty-guidelines#safeharbor. The Frontier Governance Framework's whistleblower route is internal only, with anonymous reporting and anti-retaliation for employees; there is no external equivalent.
  routes:
    msrc-researcher-portal:
      label: MSRC Researcher Portal
      scope: Security vulnerability submissions including AI systems, graded against the AI bug bar.
      note: Also reachable as aka.ms/secure-at per the Copilot bounty page.
    microsoft-copilot-ai-bounty:
      label: Microsoft Copilot AI Bounty
      scope: $250-$30,000. Security vulnerabilities in Copilot surfaces. Explicitly EXCLUDES 'AI prompt injection attacks that do not have a security impact on users other than the attacker', 'model hallucination where the model pretends to run arbitrary code', and 'attacks that aim to leak (part of) the system/meta prompt'. Content issues must be reported separately as 'AI derived harm'.
      note: One of the clearest published statements anywhere that jailbreak-style findings are not a bounty item.
    ai-ml-vulnerability-severity:
      label: AI/ML Vulnerability Severity Classification (AI bug bar)
      scope: "Splits AI issues into security vulnerabilities (CVSS-rated: inference manipulation, membership inference, model theft) and Responsible AI issues (hate speech, misinformation, sexual content, self-harm) classified only 'In Scope' or 'Out of Scope for investigation, without severity ratings'."
      note: Notably says Microsoft 'actively welcome[s] submissions related to safety and societal harm' — a rare explicit invitation. CSEAM must go to Report a Concern instead.
    report-concern:
      label: Report a Concern (Digital Safety)
      scope: Harmful content across Microsoft services, including AI-generated.
      note: The consumer-facing route MSRC redirects content reports to.
    enterprise-ai-services-abuse:
      label: Enterprise AI Services abuse report
      scope: Reporting abusive, illegal or infringing use of a Microsoft AI Service.
      note: Published in the Code of Conduct for Microsoft AI Services.
    homepage:
      label: Homepage
    framework:
      label: Frontier Governance Framework (February 2026; first version February 2025)
