strings:
  name: Perplexity
  remit: No publicly named safety or alignment function. A security team runs the VDP; support handles what Perplexity calls 'safety issues' at the account level.
  reality_check: "The Comet browser has been a repeated target of serious external security research — Hacktron's one-click UXSS and Brave's prompt-injection findings — and those were handled through the security program, which does function. But model safety is formally excluded from it, and the fallback is a general support inbox. No safe-harbour language is published on the VDP page: it asks researchers to 'avoid actions that could compromise the privacy of our users' but offers no legal protection in return."
  notes: If it is a security bug, Bugcrowd works. If it is a model-behaviour or hallucination harm, Perplexity has told you in writing it is out of scope, and support@ is your only option. Note the absence of safe harbour before doing any testing.
  routes:
    vulnerability-disclosure-program:
      label: Vulnerability Disclosure Program (Bugcrowd)
      scope: "'All public facing endpoints of Perplexity. All user-facing clients and API endpoints are in scope.' Explicitly OUT of scope: 'AI-related issues such as hallucinations and model safety are not in scope of the security program.'"
      note: One of the bluntest published exclusions of model safety anywhere.
    support-including-what-they:
      label: Support — including what they classify as safety issues
      scope: Account, functional and safety issues, per the VDP page.
      note: General support queue; not a safety function.
    privacy-data-concerns:
      label: Privacy and data concerns
      scope: Privacy and data.
    homepage:
      label: Homepage
    framework:
      label: No published safety framework; Vulnerability Disclosure Program is the governing document
