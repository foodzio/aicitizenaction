strings:
  name: "'In-House Evaluation Is Not Enough' — third-party AI flaw disclosure framework"
  remit: N/A — it is the proposal document that defines the emerging norm. Read it to understand the vocabulary that labs and coordinators are converging on.
  reality_check: "This is where the coordinated flaw disclosure push landed: as of September 2026 the standardised report and routing layer exist (FLARE-AI, live July 2026), but broad statutory or contractual safe harbour for AI model-behaviour research does not. Labs still grant safe harbour only inside their own programs, on their own terms."
  accepts: N/A — it is the proposal document that defines the emerging norm. Read it to understand the vocabulary that labs and coordinators are converging on.
  does_not_accept: N/A
  how: "Three proposals: (1) standardised flaw reports and published rules of engagement, so researchers know what they may test and how to report; (2) broadly-scoped disclosure programs with legal safe harbours modelled on bug bounties; (3) coordinated distribution infrastructure, because jailbreaks and flaws transfer across providers. Its practical successor is FLARE-AI, which implements the standardised report and the distribution layer."
  format: Academic position paper (arXiv 2503.16861, March 2025).
  timing: N/A
  after: N/A
  operator: Shayne Longpre, Kevin Klyman, Ruth E. Appel and 30+ co-authors (MIT, Stanford HAI/CRFM, Princeton and others); endorsed by HackerOne
