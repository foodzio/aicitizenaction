  name: OpenAI Outbound Coordinated Disclosure Policy
  remit: Nothing. This governs vulnerabilities OpenAI discovers in third-party software and reports outward.
  reality_check: Zero as a submission route; useful as reference material on disclosure norms.
  accepts: Nothing. This governs vulnerabilities OpenAI discovers in third-party software and reports outward.
  does_not_accept: Inbound reports from external researchers — the policy explicitly does not address these.
  how: N/A for submitters. Included here because it is frequently mistaken for an inbound channel. Its stated principles (ecosystem security, cooperative, discreet by default, high scale/low friction) and its refusal to commit to strict publication timelines are useful as a model of what labs consider reasonable disclosure conduct — and as a rhetorical lever if a lab holds you to a stricter standard than it holds itself.
  format: N/A
  timing: N/A. OpenAI reserves the right to publish where there is vendor permission, evidence of active exploitation, vendor unresponsiveness, or where disclosure is essential to protect rights, privacy, safety, security or property.
