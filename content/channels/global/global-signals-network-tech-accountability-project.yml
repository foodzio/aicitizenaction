strings:
  name: The Signals Network — Tech Accountability Project
  remit: Tech workers with public-interest concerns, including those considering going to media.
  reality_check: Distinctive for covering the non-legal costs of whistleblowing — housing, mental health, career — which are what actually break people, and which legal-only services do not touch. The media-coordination function makes it the right partner when the intended endpoint is publication rather than regulatory action. Funded by donations and grants; no fee stated.
  accepts: Tech workers with public-interest concerns, including those considering going to media.
  does_not_accept: Does not act as a regulator; works in coordination with other organisations rather than independently.
  how: "Secure contact at thesignalsnetwork.org/contact/. Support offered: legal counsel, psychological support, safe housing, press and career assistance, and connection to journalist networks for coordinated story development. Also publishes the Tech Worker Handbook as a self-serve resource."
  format: Confidential intake.
  timing: Rolling.
  after: Wraparound support package; potential coordinated media investigation.
  operator: The Signals Network (nonprofit); supported by Knight Foundation; partners with Amnesty International
