strings:
  name: "'To Err is AI' — evidence on what makes an LLM flaw report land"
  remit: N/A — empirical evidence on flaw reporting practice.
  reality_check: "This is the closest thing to hard evidence on what distinguishes a flaw report that gets acted on from one that gets closed. The operative instruction for a playbook: state the deployment context and the harm pathway, not just the prompt and the bad output."
  accepts: N/A — empirical evidence on flaw reporting practice.
  does_not_accept: N/A
  how: "Findings from an open-ended bug bounty in August 2024 in which 495 hackers produced evaluations against the OLMo open language model, with cash awards for demonstrated flaws. Practical lesson for a submitter: successful reports did not merely exhibit bad output — they connected the identified issue to a concrete deployment hazard and to a clear need for public disclosure clarifying the intent, capacities and hazards of the deployment. The paper also sets out best practices for safety reporting processes, their artifacts, and safety program staffing."
