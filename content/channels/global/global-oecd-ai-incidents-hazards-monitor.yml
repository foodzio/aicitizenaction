strings:
  name: OECD AI Incidents and Hazards Monitor (AIM)
  remit: Tracks AI incidents and hazards to build an evidence base for policy, currently by automated monitoring of 150,000+ news articles daily via Event Registry, with LLM-based classification against the OECD's common reporting framework for AI incidents.
  threat_model: Realised harms and near-misses across all severities — closest to an aviation-safety model. Empirical rather than theoretical; captures near-term harms far better than speculative catastrophic risk.
  reality_check: Do not route an incident here yet — there is nowhere to put it. Use the AI Incident Database (incidentdatabase.ai), which accepts public submissions today and which OECD AIM draws on conceptually. Check back when OECD opens submissions.
  gov_channel: Strong — designed explicitly to feed OECD and G7 policy work on incident reporting.
  routes:
    open-submission-process-announced:
      label: Open submission process — announced as under development, NOT yet live
      scope: Will follow the common reporting framework once launched
      note: As of this check the methodology page states the open submission process 'is currently being developed'. There is no public submission form or incident inbox today.
    incidents-dashboard:
      label: Incidents dashboard (read-only)
      scope: Browsing indexed incidents
    homepage:
      label: Homepage
