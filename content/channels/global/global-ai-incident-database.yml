strings:
  name: AI Incident Database (Responsible AI Collaborative)
  remit: Public, open-source, citable index of realised AI harms and near-harms, modelled on aviation and cybersecurity incident databases. Community-submitted incidents are editorially reviewed and indexed with reports, entities and classifications. Recent entries span AI medical transcription misuse, deepfake tooling, chatbots implicated in violence planning, and law-enforcement technology abuse.
  threat_model: Realised harms of any severity, empirically grounded. Strongest on near-term harms; increasingly captures misuse and agentic failures. Not a theoretical-risk organisation.
  reality_check: Small, volunteer-heavy, and genuinely reads its submissions — one of the few places in this entire list where an unaffiliated person's report reliably gets human attention and can end up in the permanent public record. If you have a specific realised harm, start here. Editorial review takes time and marginal submissions do get rejected.
  gov_channel: Indirect but real — AIID entries are cited by OECD AIM, academic literature, journalists and regulators. Getting an incident indexed here makes it citable everywhere else.
  routes:
    submit-incident-open-anyone:
      label: Submit an incident — open to anyone, no account required
      scope: Anyone, worldwide
      note: THE canonical public route for reporting a concrete AI harm. Submissions are editorially reviewed before publication.
    responsible-ai-collaborative-collaboration:
      label: Responsible AI Collaborative — collaboration enquiries
      scope: Partnership, research, editorial
    contact-page:
      label: Contact page
      scope: General
    github-issues-bugs:
      label: GitHub issues — bugs, taxonomy, code
      scope: Anyone
    homepage:
      label: Homepage
