      label: Submission page
      scope: Structured challenge entries that surface and measure biased or exclusionary outcomes in AI systems, and — unusually — that design technical mitigations, not just identify problems. Domains span generative AI, computer vision, environmental decision-making and digital accessibility.
      note: Register on Zindi and enter the live challenge. Prize tiers are structured for beginner, intermediate and advanced participants, which makes it one of the few routes deliberately open to non-experts. Partnership enquiries to info@humane-intelligence.org.
