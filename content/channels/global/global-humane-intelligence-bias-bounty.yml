strings:
  name: Humane Intelligence Bias Bounty
  remit: Structured challenge entries that surface and measure biased or exclusionary outcomes in AI systems, and — unusually — that design technical mitigations, not just identify problems. Domains span generative AI, computer vision, environmental decision-making and digital accessibility.
  reality_check: "Real but narrow. Its value to an unaffiliated person is credentialing and access: it is a legitimate, low-barrier way to build a public track record in AI evaluation, and Humane Intelligence has run challenges with government and lab partners (including DEF CON-scale exercises). It will not help with a concern that does not match an open challenge."
  accepts: Structured challenge entries that surface and measure biased or exclusionary outcomes in AI systems, and — unusually — that design technical mitigations, not just identify problems. Domains span generative AI, computer vision, environmental decision-making and digital accessibility.
  does_not_accept: Unsolicited, out-of-challenge reports. This is a time-boxed competition format, not an always-open intake. If no challenge is running on your topic, there is nothing to submit to.
  how: Register on Zindi and enter the live challenge. Prize tiers are structured for beginner, intermediate and advanced participants, which makes it one of the few routes deliberately open to non-experts. Partnership enquiries to info@humane-intelligence.org.
  format: Whatever the specific challenge specifies — typically code, analysis and a written finding submitted to the Zindi platform.
  timing: Windowed. The Bias Bounty Mapping Equity Challenge ran 28 August – 31 October 2026. Watch humane-intelligence.org for the next window.
  after: Entries are judged; winners announced publicly; findings feed transparency reports (e.g. the 2024 Generative AI Red Teaming Challenge transparency report).
  operator: Humane Intelligence (nonprofit, founded by Rumman Chowdhury), challenges hosted on Zindi
  routes:
