      label: Submission page
      scope: Nothing directly from the public. It ingests and classifies incidents from the AI Incident Database — 1,600+ incidents classified by risk domain, cause, harm type (10 categories including physical harm, financial loss and human rights), severity, entity and timing.
      note: Submit to the AI Incident Database; if accepted there, your incident flows into this tracker automatically and is re-classified against academic taxonomies.
