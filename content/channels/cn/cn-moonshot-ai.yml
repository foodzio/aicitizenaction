strings:
  name: Moonshot AI
  remit: No publicly named safety or alignment function. A security team exists and responds via the developer forum; Kimi models are released open-weight and via API.
  reality_check: "Rare documented case of a channel failing and a workaround succeeding. A security researcher posted on forum.moonshot.ai after emailing security@moonshot.ai and waiting 90 days with no response; a Moonshot staff member (yuikns) then replied on the forum within the thread, relaying the Security Team's confirmation of the address and of the absence of any formal VDP. The lesson is explicit: the email exists, went unanswered for three months, and a public post got a reply."
  notes: Email security@moonshot.ai, but plan to escalate to the public forum if you get nothing — that is the documented path to a human. No safe harbour, no bounty, no whistleblower channel. Nothing covers model safety as distinct from security.
  routes:
    security-reports:
      label: Security reports
      scope: "Confirmed by a Moonshot staff member relaying their Security Team on the official forum: 'If you discover any potential security issues, please report them to us at: security@moonshot.ai. We kindly ask that you follow responsible disclosure practices and give us reasonable time to investigate and address any finding…'"
      note: Moonshot confirmed in the same thread that it has NO public bug bounty and NO formal vulnerability disclosure policy.
    moonshot-kimi-developer-forum:
      label: Moonshot / Kimi developer forum
      scope: Public forum where staff do respond.
      note: Documented as the escalation route that actually works when email does not.
    homepage:
      label: Homepage
    framework:
      label: No published frontier safety framework found
