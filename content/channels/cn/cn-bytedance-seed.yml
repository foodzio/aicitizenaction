strings:
  name: ByteDance Seed
  remit: A Responsible AI research direction within Seed; TechNode reported in August 2026 that ByteDance formed a new AI Data and Safety department. No named external-facing safety office.
  reality_check: "ByteDance's AI safety responses in 2026 were driven by legal and commercial pressure rather than researcher reports: it pledged safeguards for Seedance 2.0 only after legal threats from Disney and Paramount over IP, and suspended a photo-to-voice feature over risk concerns. Both were reactive and externally forced. No evidence of a functioning researcher channel."
  notes: "Record as: no meaningful public safety channel for the Seed research arm. A concern about Seedance or Doubao output realistically has to go through the consumer product's in-app reporting, or through press and legal pressure — which is what has demonstrably moved them."
