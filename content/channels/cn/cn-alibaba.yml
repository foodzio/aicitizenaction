strings:
  name: Alibaba (Qwen)
  remit: No separately named frontier safety or alignment function published in English. Security is handled by the Alibaba Security Response Center (ASRC); model governance follows PRC regulatory requirements (CAC algorithm and generative AI filings).
  reality_check: No public accounts found of a foreign researcher successfully reporting a Qwen model-safety issue to Alibaba. Qwen weights are widely distributed on Hugging Face and most published safety findings about Qwen (red-teaming reports, jailbreak evaluations) are released as papers or blog posts rather than disclosed to Alibaba, which is itself the signal. CISA's September 2026 advisory on PRC AI developers adds a geopolitical overlay that makes direct engagement harder for some researchers.
  notes: "Treat as: no verified English-language model-safety channel. ASRC exists and is real but is an infrastructure security platform with registration friction. If you have a finding about open-weight Qwen models, publishing it and filing on the Hugging Face model repo is likely to have more effect than the SRC."
  routes:
    alibaba-security-response-center:
      label: Alibaba Security Response Center (ASRC)
      scope: Vulnerability reporting across Alibaba properties. Page is fully JS-rendered and returned only a 'please enable JS' message when fetched, so scope, AI coverage and registration requirements could not be confirmed.
      note: An ASRC Vulnerability Rewards Program exists (https://security.alibaba.com/announcement/announcement?id=151). Chinese SRC platforms typically require account registration and, often, a mainland phone number — a practical barrier for outside researchers.
    alibaba-cloud-trust-center:
      label: Alibaba Cloud trust center
      scope: Compliance documentation, not an incident channel.
    homepage:
      label: Homepage
    framework:
      label: No published frontier safety framework found in English
