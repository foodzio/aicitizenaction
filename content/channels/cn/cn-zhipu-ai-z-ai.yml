strings:
  name: Zhipu AI / Z.ai
  remit: No publicly named safety or alignment function in English. GLM models are released open-weight and via API; the company was placed on the US Entity List, complicating external engagement.
  reality_check: "A live example of the gap: in September 2026 Z.ai disabled features of its ZCode coding assistant after it was found uploading users' repositories — a serious incident surfaced publicly rather than through a disclosure channel. NIST's CAISI published an assessment of GLM-5.2 in July 2026. Zhipu is a signatory to the Frontier AI Safety Commitments made at the AI Seoul Summit, but has not published a corresponding framework or an external reporting route."
  notes: "Record as: no meaningful public safety channel. A citizen with a GLM safety concern has no published address. For open-weight GLM releases, the Hugging Face repo discussion tab is the only realistic contact surface."
