strings:
  name: Tencent
  remit: No publicly named frontier safety function. Tencent Security Response Center (TSRC) runs vulnerability intake for Tencent products including Hunyuan.
  reality_check: TSRC is one of the more accessible Chinese security response centres for foreign researchers — it maintains a full English site, a hall of fame and a payouts page, and does not appear to require a mainland identity to register. No public accounts found of AI model-safety reports specifically. Scope for AI is unstated, so a jailbreak report would likely be triaged as out of scope.
  notes: security@tencent.com and the English TSRC form are real and usable. Do not expect model-behaviour findings to be treated as in scope; frame anything you send in security terms if it genuinely has security impact.
  routes:
    tencent-security:
      label: Tencent security
      scope: Primary contact listed on the English TSRC about page.
      note: Whether AI model safety is in scope is not stated anywhere on the TSRC site.
    tsrc-vulnerability-report-form:
      label: TSRC vulnerability report form
      scope: Vulnerability submission. English interface available, with Facebook/Twitter/Google login options — so it is more accessible to outside researchers than most Chinese SRCs.
      note: Policy at https://en.security.tencent.com/index.php/policy and payouts at .../payouts.
    homepage:
      label: Homepage
    framework:
      label: No published frontier safety framework found in English
