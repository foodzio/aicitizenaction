strings:
  name: EU AI Act Service Desk
  remit: Questions about AI Act interpretation and compliance; routes users to the complaints tool and whistleblower tool.
  reality_check: Useful as the authoritative starting point for anyone trying to work out which EU route applies to their concern, and as the canonical index of open AI Act consultations. Not itself a lever.
  accepts: Questions about AI Act interpretation and compliance; routes users to the complaints tool and whistleblower tool.
  does_not_accept: It is a help desk and resource hub, not an enforcement intake in its own right.
  how: Browse the AI Act Explorer, Compliance Checker, guidelines and templates; contact the AI Office at CNECT-AIOFFICE@ec.europa.eu; or follow the links to the complaint and whistleblower tools. Available in English, Spanish, German, French, Italian and Polish.
  format: Web resources and email.
  timing: Rolling; hosts periodic public consultations on implementation topics.
  after: Response from the AI Office, or referral to the appropriate tool.
  operator: European Commission (AI Office / DG CNECT)
