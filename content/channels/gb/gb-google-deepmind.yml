strings:
  name: Google DeepMind
  remit: Responsibility and Safety Council (co-chaired by COO Lila Ibrahim and VP Responsibility Helen King) reviews research and deployments; a separate AGI Safety Council led by co-founder Shane Legg works alongside it on frontier risk.
  reality_check: "Documented black hole for model-safety issues. A researcher who submitted a Gemini guardrail-bypass to the AI VRP on 20 October 2025 published Google's verbatim reply classifying it 'Infeasible / Out of Scope': 'Generating violative content (such as hate speech, violent content, or illegal instructions)...within the user's own session (e.g., jailbreaks, safety bypasses, or alignment bypasses) is not a qualifying report for the AI VRP.' AI Frontiers' 2026 review groups Google DeepMind with Meta and xAI as labs that exclude jailbreaks from their vulnerability programs, leaving only untracked thumbs-down feedback. Neither the Frontier Safety Framework page nor the Responsibility and Safety page publishes any email, form or contact for external safety input — verified by fetching both."
  notes: "There is no published address to reach the Frontier Safety Framework team or either safety council. Google's own triage will tell you a jailbreak is not a security bug. If your finding has a genuine security impact (data exfiltration, cross-user harm) the AI VRP is the right door; if it is alignment or harmful-content behaviour, there is effectively no door. Treat this as: not found — general contact only."
  routes:
    google-ai-vulnerability-reward:
      label: Google AI Vulnerability Reward Program
      scope: Security vulnerabilities in AI products. Jailbreaks and in-session harmful content generation are EXPLICITLY OUT OF SCOPE.
      note: Page returns HTTP 200 but is fully JS-rendered and could not be read as text. Scope confirmed by a researcher who published Google's verbatim rejection (below).
    gemini-content-reporting:
      label: Gemini content reporting (legal troubleshooter)
      scope: Content removal under Google policies and applicable law.
      note: Cited from Gemini's policy guidelines page. A legal/removal route, not a safety-research route.
    product-thumbs-down-gemini:
      label: In-product thumbs-down on Gemini output
      scope: The only routine route for flagging a bad model response.
      note: "AI Frontiers: Google 'relies on in-product thumbs-down reporting with no acknowledgement of receipt, and no means to track that action will be taken.'"
    homepage:
      label: Homepage
    framework:
      label: Frontier Safety Framework, Version 3.1 (17 April 2026)
