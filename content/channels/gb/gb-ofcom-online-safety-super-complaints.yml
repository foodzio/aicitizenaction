      label: Submission page
      scope: Complaints from eligible entities about a feature or conduct of one or more regulated services presenting a material risk of significant harm, of significant adverse impact on freedom of expression, or other significant adverse impacts. For a single-service complaint you must additionally explain its particular importance or the scale of user impact.
      note: Written submission to Ofcom with organisational contact details, description of the feature or conduct, identification of the services/providers, and evidence of material risk. Supporting evidence must be current, objective and verifiable. An unaffiliated individual's realistic route is to supply evidence to an eligible organisation rather than to file directly.
