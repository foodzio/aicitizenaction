strings:
  name: Ofcom Online Safety super-complaints
  remit: Complaints from eligible entities about a feature or conduct of one or more regulated services presenting a material risk of significant harm, of significant adverse impact on freedom of expression, or other significant adverse impacts. For a single-service complaint you must additionally explain its particular importance or the scale of user impact.
  reality_check: "This is the UK's real lever on platform-level AI harms, with binding response timescales — a sharp contrast to individual complaints, which Ofcom will not investigate. The whole design assumes intermediation by civil society. For a playbook, the actionable instruction is: package your evidence to Ofcom's stated standard (current, objective, verifiable) and hand it to an eligible body."
  accepts: Complaints from eligible entities about a feature or conduct of one or more regulated services presenting a material risk of significant harm, of significant adverse impact on freedom of expression, or other significant adverse impacts. For a single-service complaint you must additionally explain its particular importance or the scale of user impact.
  does_not_accept: Individuals cannot bring super-complaints. The entity must represent the interests of users, the public or a specific group; be independent of regulated services; be a significant expert contributor to public online safety discussion; and have regard to Ofcom's guidance.
  how: Written submission to Ofcom with organisational contact details, description of the feature or conduct, identification of the services/providers, and evidence of material risk. Supporting evidence must be current, objective and verifiable. An unaffiliated individual's realistic route is to supply evidence to an eligible organisation rather than to file directly.
  format: Written submission per Ofcom's super-complaints guidance; evidence-led.
  timing: Rolling. Regime commenced 1 January 2026.
  after: Ofcom decides eligibility within 30 days of a completed submission, and responds to an admissible complaint usually within 90 days (extendable if further information is needed).
  operator: Ofcom, under the Online Safety Act 2023
  routes:
