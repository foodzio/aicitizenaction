strings:
  name: Ofcom — individual complaint about an online service
  remit: Complaints about phone, broadband and postal services; TV, radio and on-demand programmes; wireless interference; something you have seen on an online service, website or app; and premium rate services.
  reality_check: Explicitly symbolic at the individual level — Ofcom says so. It is a data point in a monitoring dataset. The mechanism with actual teeth is the super-complaint, which individuals cannot use.
  accepts: Complaints about phone, broadband and postal services; TV, radio and on-demand programmes; wireless interference; something you have seen on an online service, website or app; and premium rate services.
  does_not_accept: Ofcom cannot investigate individual cases or mandate removal of specific content. It will not resolve your dispute with a platform.
  how: Contact the service provider first, then report via Ofcom's online complaints portal at ofcom.org.uk/make-a-complaint.
  format: Online form.
  timing: Rolling.
  after: Reports feed Ofcom's monitoring and evidence base for Online Safety Act supervision and enforcement against systemic failures.
  operator: Ofcom
