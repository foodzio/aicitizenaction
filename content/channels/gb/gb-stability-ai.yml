strings:
  name: Stability AI
  remit: "'Stable Safety' — the publicly branded safety function covering open-weight image and audio models, built around six principles including Safety-First Open Source and Banning AI Misuse, plus an annual Integrity Transparency Report."
  reality_check: No public accounts found of response rates to safety@stability.ai. Stability's safety posture has been heavily criticised in the context of open-weight image models and CSAM (the LAION training-data findings), and its transparency reporting is the main published evidence of enforcement. The address is real; its throughput is unknown.
  notes: safety@stability.ai is the route. Note there is no frontier safety framework or scaling policy — the AUP and the six Stable Safety principles are the whole published governance surface. For open-weight models, reporting misuse to the developer has limited effect once weights are distributed; that is a structural limit, not a channel failure.
  routes:
    safety-misuse-reports:
      label: Safety and misuse reports
      scope: Reporting misuse of Stability models and safety concerns.
      note: Published on the Stable Safety page. A named, dedicated safety address.
    appeals-request-form:
      label: Appeals request form
      scope: Appealing a policy-violation determination believed to be in error.
      note: Linked from the safety page.
    trust-center:
      label: Trust Center
      scope: Security and compliance documentation.
    homepage:
      label: Homepage
    framework:
      label: Acceptable Use Policy (Stable Safety principles)
