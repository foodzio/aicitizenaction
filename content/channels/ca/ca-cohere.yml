strings:
  name: Cohere
  remit: Chief Scientist holds 'final authority to determine if our products are safe, secure, and ready to be made available to our customers', delegated by the CEO under the Secure AI Frontier Model Framework.
  reality_check: No public accounts found either way — no complaints of a black hole, and no published confirmations of response. Cohere is a smaller enterprise-focused developer with a correspondingly low volume of external safety research directed at it. The framework names external partners (NIST, Humane Intelligence) but describes no public intake process.
  notes: Use safety@cohere.com; it is explicitly scoped to model safety in the Usage Policy, which is more than most publish. The framework itself publishes no contact address, so the Usage Policy is the document to cite when you write.
  routes:
    safety-misuse-reports:
      label: Safety and misuse reports
      scope: "Usage Policy states: 'please notify us immediately at safety@cohere.com'. Covers policy violations, misuse or abuse of Cohere Services, model safety issues, and security research falling outside the disclosure procedure."
      note: A real, named, published safety address — rarer than it should be. This is the strongest single route on Cohere's surface.
    thumbs-down-output:
      label: Thumbs-down on output
      scope: In-product feedback on a bad model output, offered in the Usage Policy as an alternative to emailing.
    responsible-disclosure-policy-via:
      label: Responsible Disclosure Policy via Trust Center
      scope: Security vulnerability disclosure; the policy document is downloadable from the Trust Center.
      note: Document is gated behind the Trust Center; no plain-text email published on the public security page.
    homepage:
      label: Homepage
    framework:
      label: The Cohere Secure AI Frontier Model Framework, V1.0 (February 2025)
