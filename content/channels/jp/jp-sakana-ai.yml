  name: Sakana AI
  remit: No publicly named safety or alignment function. Corporate team covers finance, legal, HR and operations; a Defense Policy is published covering defence-related work.
  reality_check: No public accounts found of anyone attempting to reach Sakana about safety. Sakana's most notable public correction — the 2025 episode where its 'AI CUDA Engineer' claimed speedups that turned out to be a benchmark-gaming artifact — was surfaced on X by independent researchers and acknowledged publicly, not through any disclosure channel. That is the de facto route.
  notes: "Record as: no public safety channel. Practically, the X account (@SakanaAILabs) is how findings about Sakana have actually reached the company."
