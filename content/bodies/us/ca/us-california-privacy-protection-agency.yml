strings:
  name: California Privacy Protection Agency (CPPA)
  remit: The only dedicated US privacy regulator. Enforces the CCPA/CPRA, including regulations on automated decisionmaking technology (ADMT), risk assessments and cybersecurity audits — the ADMT rules reach AI used for significant decisions about Californians. Can investigate, hold administrative hearings, issue orders and impose administrative fines (up to $2,500 per violation, $7,500 for intentional violations or violations involving minors). Conducts formal rulemaking with public comment.
  powers_text: fine
  reality_check: "The complaint form genuinely initiates enforcement review and the CPPA has been willing to act. Its formal rulemaking is the better lever for policy input: California's Administrative Procedure Act requires the agency to publish and respond to every comment, and the ADMT regulations changed substantially across drafts in response to comments. Scope is data-protection and automated decisions about individuals — NOT frontier or catastrophic risk. Route those to the AG (SB 53) or Cal OES instead."
  notes: ADMT obligations phase in over 2026-2027; check current compliance dates before relying on a deadline.
  routes:
    cppa-complaint-form:
      label: CPPA complaint form
      scope: Any consumer may complain about a business's handling of personal information, including ADMT and AI-driven decisions.
      note: VERIFIED on https://www.cppa.ca.gov/about_us/contact.html.
    rulemaking-proposed-regulations-comment:
      label: Rulemaking — proposed regulations and comment periods
      scope: The ADMT, risk-assessment and cyber-audit regulations went through formal notice-and-comment here.
      note: VERIFIED as the page the CPPA's own contact page directs to for laws and regulations.
    named-staff-email:
      label: Named staff email
      scope: n/a
      note: "VERIFIED ABSENCE — CPPA publishes no email addresses and directs all contact to web forms. Phone 916-572-2900; fax 916-744-2560; post: 400 R Street Suite 350, Sacramento CA 95811."
