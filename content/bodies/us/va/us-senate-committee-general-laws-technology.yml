strings:
  name: Senate Committee on General Laws and Technology
  ai_jurisdiction: Senate committee of reference for AI, technology, data and general-laws bills. Meets in Senate Room B (Room 306), 30 minutes after adjournment on Wednesdays.
  business: "HB 2094 (2025, vetoed). 2026: SB 586 (Salim, health-carrier AI disclosure) continued to 2027; SB 796 (children's chatbot restrictions); SB 394 (Pekarsky, AI guidance for schools) advancing."
  status: VERIFIED — no comprehensive Virginia AI law; most 2026 AI bills carried over to the 2027 session.
  public_route: YES — no advance registration is required to speak in person at Senate committee meetings; the chair may invite audience members to testify. Remote public testimony for Senate STANDING committees is available through the Senate's committee-meetings page; Senate SUBCOMMITTEES do not offer remote testimony. Written statements may be filed with the committee clerk (Eric Bingham).
  agency_route: Virginia Attorney General consumer complaint — https://www.oag.state.va.us/consumer-protection/index.php/file-a-complaint ; Governor's AI task force under Executive Order 22 (18 Sep 2026).
  note: "Chair and roster verified from the official 2026 Senate Committee Chart (https://apps.senate.virginia.gov/Portal/Resources/Comcal.pdf). Members listed: Head, French, Locke, Jordan, Craig, Reeves, VanValkenburg, Williams Graves, Pillion, Roem, Marsden, Rouse, Carroll Foy, Pekarsky."
