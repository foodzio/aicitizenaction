strings:
  name: Senate Environment, Energy & Technology Committee (ENET)
  ai_jurisdiction: Senate committee of referral for AI and telecommunications bills, including HB 2225 on its Senate passage.
  business: HB 2225 / SB 5984 (AI companion chatbots) — signed 24 Mar 2026, C 168 L 26, effective 1 Jan 2027. E2SHB 1170 (deepfakes) received a Senate bill report Feb 2026.
  status: VERIFIED — HB 2225 enacted; HB 1170 stalled at Senate Ways & Means.
  public_route: YES — same CSI portal, Senate instance. Sign in PRO/CON/OTHER, upload written testimony, or register for remote video testimony. Positions are counted even if you never speak, which makes this the cheapest meaningful civic action available on a state AI bill.
  agency_route: Washington Attorney General Consumer Protection (https://www.atg.wa.gov/file-complaint); Washington State AI Task Force at https://www.atg.wa.gov/aitaskforce
  note: "Vice Chairs: Victoria Hunt and Vandana Slatter. Ranking Minority Member: Matt Boehnke (R). Composition 7 D / 4 R; members include Dhingra, Harris, Liias, Lovelett, MacEwen, Short, Wellman."
