  name: Joint Committee on General Law — House co-chair
  ai_jurisdiction: Same joint committee; House-side leadership for AI and consumer-protection bills.
  business: SB 5 / Public Act 26-15 (CART Act), signed 2 June 2026.
  status: VERIFIED — see Senate entry for effective dates.
