strings:
  name: Illinois Department of Human Rights (IDHR)
  remit: Enforces the Illinois Human Rights Act as amended by HB 3773 (effective 1 January 2026), which makes it a civil rights violation for an employer to use AI that discriminates on a protected characteristic, or to use zip code as a proxy for a protected class, and requires notice to employees and applicants when AI is used in employment decisions. IDHR investigates charges, makes substantial-evidence determinations, and cases proceed to the Illinois Human Rights Commission or to circuit court. Illinois also has BIPA (private right of action) and an AI Video Interview Act.
  powers_text: investigate
  reality_check: "A named, monitored intake email with statutory deadlines behind it — this is a functioning complaint route, not a suggestion box, and a charge triggers an investigation with a determination. But it is individual-remedy machinery: you must be a person who suffered discrimination. It has no application whatsoever to frontier or catastrophic risk. Note the 2-year deadline is unusually generous compared to the federal EEOC's 300 days."
  notes: Illinois BIPA remains the more potent AI-adjacent lever in that state because it carries a private right of action and statutory damages, litigated in court rather than through IDHR.
  routes:
    file-charge-discrimination-intake:
      label: File a charge of discrimination — intake email
      scope: Most employment and public-accommodation cases, including AI-in-hiring discrimination. Submit a Complainant Information Sheet (CIS) by email, post or fax.
      note: VERIFIED at https://dhr.illinois.gov/charge-process/filers.html. IDHR states email is the recommended method.
    fair-housing-charges:
      label: Fair housing charges
      scope: Housing discrimination, including algorithmic tenant screening.
      note: VERIFIED on the same page.
    intake-phone:
      label: Intake phone
      scope: Charge filing assistance.
      note: "VERIFIED. Deadlines: most cases within 2 years of the discriminatory act; housing within 1 year."
    online-filing-portal:
      label: Online filing portal
      scope: n/a
      note: VERIFIED ABSENCE — IDHR has no online charge-filing portal; filing is by form submitted via email, post or fax.
    homepage:
      label: Homepage
