strings:
  name: Colorado Attorney General — Automated Decision-Making Technology Act and Chatbot Safety Act rulemaking
  remit: "RESTRUCTURED: the original Colorado AI Act (SB 24-205) was repealed and reenacted by SB 26-189 in 2026 after its predecessor's enforcement was blocked in federal court; the replacement regime is the Automated Decision-Making Technology (ADMT) Act, with provisions taking effect 1 January 2027, alongside a separate Chatbot Safety Act (passed May 2026) requiring disclosure of AI interaction, protection of minors from harmful content and safety protocols. The Attorney General has exclusive enforcement authority and rulemaking power; no private right of action."
  powers_text: fine
  reality_check: "An OPEN, PUBLISHED, NAMED comment window closing 26 October 2026 with a public comment repository — this is among the highest-value live levers in the US right now, and materially easier to influence than a federal docket because the volume is far lower. Colorado's AG is writing the operative definitions for 'consequential decision', chatbot safety duties and minors' protections from scratch. Scope is algorithmic discrimination and chatbot harms, NOT catastrophic risk. The 2026 repeal-and-reenact is critical: SB 24-205 analyses are obsolete."
  notes: Colorado's reset was explicitly a pivot away from the EU model after federal pressure, including a White House callout.
  routes:
    open-rulemaking:
      label: "OPEN RULEMAKING: ADMT Act and Chatbot Safety Act proposed rules"
      scope: Formal public comment on the draft rules filed 11 August 2026. Deadline 26 October 2026 at 11:59pm MST (or the last day of the formal hearing if extended); comments received by 4 September 2026 were considered for the revised draft.
      note: VERIFIED — the form URL and both deadlines are published at https://coag.gov/ai/.
    public-comment-repository:
      label: Public comment repository
      scope: All submitted comments are posted publicly here.
      note: VERIFIED — cited on the Colorado AG's AI page.
    comment-email:
      label: Comment email
      scope: n/a
      note: VERIFIED ABSENCE — the AG's page states comments must be submitted via the form; no email address is given.
    homepage:
      label: Homepage
