strings:
  name: Texas Attorney General — Texas Responsible Artificial Intelligence Governance Act (TRAIGA)
  remit: Enforces TRAIGA, effective 1 January 2026. Prohibits AI developed or deployed to manipulate human behaviour to incite harm, social scoring by government, unlawful capture of biometric identifiers, AI intended to infringe constitutional rights, unlawful discrimination, and certain sexually explicit AI content; requires government agencies deploying consumer-facing AI to disclose it. The AG has exclusive enforcement, with a 60-day cure period, civil penalties and injunctive relief; there is no private right of action. TRAIGA also creates a regulatory sandbox and an AI Council.
  powers_text: fine
  reality_check: One of the very few US state routes where an ordinary member of the public can file an AI-specific complaint that lands in an enforcement queue. The Texas AG has stood up a dedicated AI complaint intake and published consumer-facing guidance — a stronger operational posture than most states. But TRAIGA turns on INTENT for most prohibitions, which is a high bar, and the 60-day cure period blunts enforcement. Scope is manipulation, discrimination, biometrics and government use — explicitly not frontier or catastrophic risk.
  notes: TRAIGA is the template the preemption-minded federal position points to as a preferred state model, so it is less exposed to the December 2025 Executive Order than California's or New York's regimes.
  routes:
    file-ai-complaint-online:
      label: File an AI complaint online (Texas AG consumer protection portal)
      scope: Anyone may file an AI-specific complaint under TRAIGA. The AG's dedicated 'Consumer AI Rights' page links to this portal under the heading 'File An AI Complaint Online'.
