strings:
  name: Subcommittee on Courts, Intellectual Property, Artificial Intelligence, and the Internet
  ai_jurisdiction: "The only subcommittee in Congress with 'Artificial Intelligence' in its formal name on the Judiciary side. Send here: AI training data and copyright (fair use, licensing, transparency of training corpora), digital replicas and the right of publicity, AI and patents/inventorship, Copyright Office and USPTO policy, Section 230 and platform liability, and courts' use of AI. If you are a creator, rightsholder or platform, this is the House door."
  business: "VERIFIED: July 2026 hearing at which witnesses urged action on a site-blocking mechanism and the NO FAKES Act (ipwatchdog, 2 Jul 2026). Hearing on protecting creators in the age of AI and the internet. The subcommittee continues the 'Artificial Intelligence and Intellectual Property' hearing series begun with 'Part I — Interoperability of AI and Copyright Law'. CSET and other research organizations have testified here on AI."
  public_route: Full-committee contact https://judiciary.house.gov/contact, 2138 Rayburn, 202-225-6906; minority via democrats-judiciary.house.gov.
  note: Exact name and leadership verified 2026-09-22 from the House Clerk's MemberData.xml (subcommittee code JU03).
