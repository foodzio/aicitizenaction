strings:
  name: Subcommittee on Science, Manufacturing, and Competitiveness
  ai_jurisdiction: "NIST, CAISI, NSF and the standards/measurement side of AI. Send here: AI evaluation science and benchmarks, AI standards development, the National AI Research Resource, AI workforce and education, AI in manufacturing, and US-vs-China AI competitiveness framing. If your concern is 'who measures whether a model is safe', this is the authorizing subcommittee (the money is in Appropriations CJS)."
  business: "VERIFIED: 3 Mar 2026 subcommittee hearing chaired by Sen. Budd evaluating innovative deployment of AI to support workforce, healthcare and industry (commerce.senate.gov/2026/3/senator-budd-chairs-subcommittee-hearing-to-evaluate-innovative-deployment-of-ai-to-support-workforce-healthcare-and-industry). Full-committee hearing 'Measuring What Matters: Science, Standards, and Strategic Competition' (21 Jul 2026) covers the same NIST/standards terrain."
  public_route: "Full-committee staff lines: majority 202-224-1251, minority 202-224-0411."
  note: Chair/ranking verified 2026-09-22 from senate.gov subcommittee roster.
