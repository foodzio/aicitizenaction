strings:
  name: Subcommittee on Commerce, Justice, Science, and Related Agencies
  ai_jurisdiction: THE subcommittee that funds NIST and, within it, the Center for AI Standards and Innovation (CAISI, the former US AI Safety Institute). Also funds NSF (including the National AI Research Resource), NASA, NOAA, DOJ and the FTC. If your concern is whether the US government has the capacity to evaluate frontier models at all, the number that decides it is written here.
  business: "VERIFIED: subcommittee markup of the FY2027 Commerce, Justice, Science and Related Agencies Appropriations Act held in 2026; public written testimony for FY2027 accepted through 22 May 2026. See CRS report R48929, 'Overview of FY2027 Appropriations for Commerce, Justice, Science, and Related Agencies (CJS)', for the NIST and NSF lines."
  public_route: Committee office S-128, The Capitol, 202-224-7257; subcommittee guidance is posted annually on the subcommittee page.
  note: Leadership verified 2026-09-22 from senate.gov SSAP subcommittee roster. This is the answer to the brief's question about 'the subcommittee funding NIST/CAISI' on the Senate side.
