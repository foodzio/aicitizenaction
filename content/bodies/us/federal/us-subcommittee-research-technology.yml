strings:
  name: Subcommittee on Research and Technology
  ai_jurisdiction: "NIST, CAISI, NSF and OSTP at subcommittee level — the most AI-specific authorizing subcommittee in the House. Send here: AI standards, model evaluation methodology, AI safety and security research, AI flaw and incident reporting, AI education and workforce, and oversight of the federal AI Action Plan."
  business: "VERIFIED: hearing 'Advancing America's AI Action Plan', 14 Jan 2026, witness OSTP Director Michael Kratsios. Obernolte is lead sponsor of H.R.2385 CREATE AI Act (reported 29-0 on 25 Jun 2026) and was co-chair of the House Bipartisan Task Force on Artificial Intelligence that issued the December 2024 final report. On 4 Jun 2026 Obernolte, with Rep. Lori Trahan and Rep. Erin Houchin, released the ~270-page bipartisan 'Great American AI Act' discussion draft — codifying CAISI at $100M/year through FY2029, frontier-developer critical-safety-incident reporting, AI testbeds at DOE/NIST/NSF, codification of NAIRR, and preemption of most state frontier-AI regulation."
  public_route: "Full committee: https://science.house.gov/contact, 202-225-6371. UNIQUELY: the Great American AI Act discussion draft solicits public feedback directly at GAAIA@mail.house.gov — a live, open, non-constituent-accessible channel into the most substantial bipartisan House AI bill. This is the best single email address in this whole list for a member of the public with a substantive AI policy view."
  note: Leadership verified 2026-09-22 from the House Clerk's MemberData.xml. Obernolte is, on the evidence of 2025-2026 activity, the single most consequential House Republican on AI.
