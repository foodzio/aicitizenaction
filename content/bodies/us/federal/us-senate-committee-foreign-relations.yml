strings:
  name: Senate Committee on Foreign Relations
  ai_jurisdiction: "AI diplomacy, not AI regulation. Send here: international AI governance bodies and treaties, State Department AI policy and the Bureau of Cyberspace and Digital Policy, AI provisions in bilateral technology agreements, AI and human rights abroad, foreign assistance involving AI, and confirmation of relevant ambassadors and State officials. Note that the statutory export-control authority sits in Banking, not here — Foreign Relations gets the diplomacy and the sanctions framing."
  business: UNVERIFIED for a named 2026 AI hearing. The committee's AI-relevant work in the 119th Congress has run through nominations, China technology-competition oversight, and its Subcommittee on East Asia, the Pacific, and International Cybersecurity Policy.
  public_route: "VERIFIED: https://www.foreign.senate.gov/about/contact. Committee: 423 Dirksen, Washington DC 20510, 202-224-4651."
