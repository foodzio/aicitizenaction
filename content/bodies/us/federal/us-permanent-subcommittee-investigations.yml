strings:
  name: Permanent Subcommittee on Investigations
  ai_jurisdiction: The Senate's standing investigative body, with subpoena power. Not an AI-jurisdiction subcommittee by name, but the correct destination for evidence-backed allegations about an AI company's conduct, federal AI contracting abuse, or AI-enabled fraud schemes. If you have documents rather than an opinion, this is the door.
  business: UNVERIFIED for AI-specific 2025-2026 investigations. Blumenthal, as ranking member here, is co-sponsor of S.2938 Artificial Intelligence Risk Evaluation Act and a co-author of the bipartisan AI framework work with Hawley.
  public_route: Via HSGAC contact page https://www.hsgac.senate.gov/contact and the subcommittee's majority/minority staff. PSI accepts information from the public and from whistleblowers regardless of state of residence.
  note: Leadership verified 2026-09-22 from senate.gov SSGA roster.
