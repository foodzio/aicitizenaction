strings:
  name: Subcommittee on Energy and Water Development and Related Agencies
  ai_jurisdiction: "Funds the Department of Energy and the national laboratories — increasingly the government's largest AI compute holder and a proposed venue for frontier-model risk evaluation. Send here: DOE AI program funding, lab compute, and the energy-side of AI buildout."
  business: UNVERIFIED for AI-specific FY27 actions. Relevant because S.2938 (Artificial Intelligence Risk Evaluation Act) would site an advanced-AI evaluation program at DOE, which would be funded here.
