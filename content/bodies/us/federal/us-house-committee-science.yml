strings:
  name: U.S. House Committee on Science, Space, and Technology
  remit: House committee of jurisdiction for NIST (and therefore CAISI), DOE Office of Science, NSF and federal AI R&D. Authorises NIST's AI programmes, conducts oversight hearings, and has produced the main House bills to put the US AI institute on a statutory footing. Can subpoena and compel testimony; cannot fine or adjudicate.
  powers_text: compel
  reality_check: The whistleblower portal is the genuinely distinctive route here and is taken seriously — committee investigative staff follow up on credible insider accounts about federal programmes. The general email form is a low-yield channel. For legislative influence, the leverage is with the named subcommittee staff on Research and Technology, and with members' personal offices; a constituent request for a meeting outperforms any committee-level correspondence.
  notes: Because it authorises NIST, this committee — not a safety agency — is where the legal status and funding of CAISI is actually decided.
  routes:
    committee-email-us-contact:
      label: Committee 'Email Us' contact form
      scope: General correspondence; the page also offers press inquiries, a mailing-list signup and a whistleblower portal.
      note: VERIFIED — the contact page was fetched and lists these options.
    whistleblower-reports-portal:
      label: Whistleblower reports portal
      scope: For insiders reporting wrongdoing within agencies or programmes in the committee's jurisdiction — including, potentially, federal AI programmes.
      note: VERIFIED as listed on the contact page; the portal's own deep link was not separately fetched.
    committee-office:
      label: Committee office
      scope: Phone and post.
      note: VERIFIED on the contact page.
    homepage:
      label: Homepage
    membership:
      label: Live membership list
    public-route:
      label: Public submission route
  ai_jurisdiction: "Non-defense federal R&D. Owns NIST (and therefore CAISI), NSF, OSTP, NASA, and the civilian side of DOE including the national labs. Send here: AI standards and measurement science, AI testing and evaluation methods, AI safety research funding, the National AI Research Resource, AI workforce and education, AI incident and flaw reporting, and federal AI R&D coordination. In the 119th Congress this committee has produced more reported AI legislation than any other House committee."
  business: "VERIFIED: full-committee markup of ten AI bills on 25 Jun 2026 — H.R.9341 AI-Ready Federal Data Guidelines Act; H.R.9363 AI Security and Innovation Act; H.R.2385 CREATE AI Act (Obernolte), reported 29-0; H.R.5351 NSF AI Education Act of 2025 (Fong), reported 33-0; H.R.5584 LIFT AI Act (34-1); H.R.6461 READ AI Models Act; H.R.8893 Protecting Consumers from Deceptive AI Act; H.R.9333 AI Flaw Reporting and Security Enhancement Act; H.R.9334 Workforce for AI Trust Act; H.R.9372 Data Infrastructure Energy Measurement and Standards Act (34-1). Nine were favorably reported. Also: Research and Technology Subcommittee hearing 'Advancing America's AI Action Plan' with OSTP Director Michael Kratsios, 14 Jan 2026, 2318 Rayburn."
  public_route: "VERIFIED: https://science.house.gov/contact, 202-225-6371. Minority: https://democrats-science.house.gov/."
  note: Chair/ranking verified 2026-09-22 from the House Clerk's MemberData.xml. If you care about AI evaluation capacity and standards, this committee plus Appropriations CJS is the pair that matters.
