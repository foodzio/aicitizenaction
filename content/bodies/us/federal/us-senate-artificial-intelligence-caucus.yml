strings:
  name: Senate Artificial Intelligence Caucus
  ai_jurisdiction: Bipartisan member-education and coordination body founded in 2019. No referral jurisdiction. Its value is that its two co-chairs sit on the committees that matter — Heinrich is ranking member of Energy and Natural Resources and sits on Intelligence; Rounds chairs Armed Services' Cybersecurity subcommittee and sits on Banking — so the caucus functions as a bridge between the energy, defense and financial AI conversations.
  business: "VERIFIED: the caucus's official page states it has championed 15 bills that became law, on national AI research coordination, government AI safety standards, deepfake threat assessment and military AI training. Heinrich, Schumer, Rounds and Young were the four authors of the Senate's bipartisan AI policy roadmap. Heinrich, Young, Rounds and Booker reintroduced legislation to expand access to AI research (the CREATE AI / NAIRR line of work) in the 119th Congress. Rounds and Heinrich introduced legislation on AI for pandemic preparedness and response."
  public_route: "VERIFIED: engage through Sen. Heinrich's office (https://www.heinrich.senate.gov/, 202-224-5521) or Sen. Rounds' office (https://www.rounds.senate.gov/, 202-224-5842). Rounds publishes his caucus memberships at https://www.rounds.senate.gov/issues/caucus-membership. Membership is senators only."
  note: Co-chairs verified 2026-09-22 on Sen. Heinrich's official Senate site. The 'chair'/'ranking' fields carry the two co-chairs. Founded 2019 by Heinrich and then-Sen. Rob Portman; Rounds replaced Portman.
