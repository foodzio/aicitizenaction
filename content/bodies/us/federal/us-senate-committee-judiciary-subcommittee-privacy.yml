strings:
  name: U.S. Senate Committee on the Judiciary — Subcommittee on Privacy, Technology, and the Law
  remit: Oversight of privacy, technology and civil-liberties aspects of AI. Held the 2023 'Oversight of A.I.' hearing series and the bipartisan framework work on AI regulation, and has since run hearings on AI-generated deepfakes and chatbot harms to minors. Can subpoena and compel testimony; legislates on liability, transparency and privacy. No adjudicative power over individuals' complaints.
  powers_text: compel
  reality_check: This subcommittee produced the most substantive US Senate AI oversight to date, but it has essentially no public front door — the /contact URL is dead. Access is entirely through member offices (the chair's and ranking member's personal staff) and through being invited as a witness. Practitioners get on witness lists by publishing work the staff already cite, then being introduced by a member's office; cold outreach to the committee does not work. Its framing is civil liberties, deepfakes and child safety rather than catastrophic risk.
  notes: Verify the subcommittee's current name and leadership for the sitting Congress before relying on prior-Congress references.
  routes:
