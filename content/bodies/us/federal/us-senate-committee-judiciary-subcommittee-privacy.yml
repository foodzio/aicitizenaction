strings:
  name: U.S. Senate Committee on the Judiciary — Subcommittee on Privacy, Technology, and the Law
  remit: Oversight of privacy, technology and civil-liberties aspects of AI. Held the 2023 'Oversight of A.I.' hearing series and the bipartisan framework work on AI regulation, and has since run hearings on AI-generated deepfakes and chatbot harms to minors. Can subpoena and compel testimony; legislates on liability, transparency and privacy. No adjudicative power over individuals' complaints.
  powers_text: compel
  reality_check: This subcommittee produced the most substantive US Senate AI oversight to date, but it has essentially no public front door — the /contact URL is dead. Access is entirely through member offices (the chair's and ranking member's personal staff) and through being invited as a witness. Practitioners get on witness lists by publishing work the staff already cite, then being introduced by a member's office; cold outreach to the committee does not work. Its framing is civil liberties, deepfakes and child safety rather than catastrophic risk.
  notes: Verify the subcommittee's current name and leadership for the sitting Congress before relying on prior-Congress references.
  routes:
    full-committee-hearings-activity:
      label: Full committee hearings and activity page
      scope: Hearing notices give the witness list and, where offered, the deadline for statements for the record.
      note: "UNVERIFIED as fetched. Note: https://www.judiciary.senate.gov/contact returned 404 — the committee does not maintain a contact page at the expected URL."
    subcommittee-listing:
      label: Subcommittee listing
      scope: Confirms current subcommittee name, chair and ranking member — check this before citing, as subcommittee names and gavels change each Congress.
      note: UNVERIFIED as fetched; appeared in search results on judiciary.senate.gov.
    subcommittee-email:
      label: Subcommittee email
      scope: n/a
      note: UNVERIFIED ABSENCE — no subcommittee-level public contact address was found, and the committee's own /contact path 404s.
    homepage:
      label: Homepage
    membership:
      label: Live membership list
    public-route:
      label: Public submission route
  ai_jurisdiction: "The named AI-oversight subcommittee of Senate Judiciary and the venue that produced the 2023-2024 'Oversight of AI' hearing series. Send here: AI and civil liberties, government and corporate surveillance, biometric and facial recognition, AI transparency and audit obligations framed as a legal duty, and whistleblower accounts from inside AI labs. Distinct from Commerce's consumer subcommittee: this one frames AI as a rights-and-rule-of-law problem rather than a marketplace problem."
  business: "VERIFIED: this subcommittee ran the 'Oversight of AI' hearing series including 'Oversight of AI: Rules for Artificial Intelligence' and 'Oversight of AI: Insiders' Perspectives' (whistleblower testimony from former frontier-lab staff). 2026 work centers on a federal privacy framework and AI data use. Note: the Sept 2025 'Examining the Harm of AI Chatbots' hearing was held by the Crime and Counterterrorism Subcommittee (Hawley), not this one — chatbot-harm work has partly migrated there."
  public_route: Through full-committee routes and the two members' own offices (Blackburn 202-224-3344; Klobuchar 202-224-3244).
  note: Chair/ranking verified 2026-09-22 from senate.gov SSJU subcommittee roster. Blackburn chairs both this subcommittee and Senate Commerce's consumer/tech subcommittee — a single office is the pivot for much Senate AI work.
