strings:
  name: Subcommittee on Intellectual Property
  ai_jurisdiction: AI training data and copyright, licensing of creative works for model training, patentability of AI-assisted inventions, digital replicas and voice/likeness rights. If you are an author, musician, performer, visual artist or publisher whose work was used in training data, this is your door in the Senate.
  business: "VERIFIED: S.1367 NO FAKES Act of 2026 (Coons, with Tillis, Blackburn and Klobuchar) is the central vehicle — referred to Senate Judiciary 9 Apr 2025 and since placed on the Senate Legislative Calendar (Calendar No. 446), making it one of the few AI bills past committee in the Senate."
  public_route: Full-committee routes plus the members' own offices (Tillis 202-224-6342; Schiff 202-224-3841).
