strings:
  name: House Committee on Armed Services
  ai_jurisdiction: "DoD and the annual NDAA — the most reliable moving vehicle for AI legislation in the House. Send here: autonomous weapons policy, AI in nuclear command and control, DoD AI acquisition and the Chief Digital and AI Office, DARPA, military AI test and evaluation, DoD compute and data centers, and defense AI workforce."
  business: "VERIFIED: the FY2026 NDAA carried extensive AI and cyber provisions (CRS In Focus IF13197), and House and Senate AI provisions went to conference. For FY2027, Rep. Bacon delivered an opening statement on the Cyber, Information Technologies and Innovation subcommittee print of the FY27 NDAA (armedservices.house.gov DocumentID 6617). A CITI subcommittee hearing on DoD science, technology and innovation posture was scheduled and then cancelled in April 2026."
  public_route: "VERIFIED: https://armedservices.house.gov/contact. Committee: 2216 Rayburn House Office Building, Washington DC 20515, 202-225-4151. Minority: https://democrats-armedservices.house.gov/."
