strings:
  name: Subcommittee on Cybersecurity, Information Technology, and Government Innovation
  ai_jurisdiction: "The House's dedicated federal-AI-use subcommittee. Send here: whether and how agencies deploy AI in decisions affecting the public, AI procurement standards, OMB memoranda on AI, federal cybersecurity, IT modernization, and emerging technology inside government. This is the House venue where the 'government is using an algorithm on me' complaint belongs."
  business: "VERIFIED: hearings 'Examining the Federal Government's Use of Artificial Intelligence' (with published wrap-up 'Federal Government Use of Artificial Intelligence Poses Promise, Peril'), 'The Future of Artificial Intelligence', a hearing on White House AI policy, a hearing on unlocking government efficiency through IT modernization, and a bipartisan AI roundtable. The subcommittee maintains a public archive at https://oversight.house.gov/category/cybersecurity-information-technology-and-government-innovation/."
  public_route: Full-committee contact https://oversight.house.gov/contact, 202-225-5074. The bipartisan roundtable format this subcommittee has used is unusually open to outside experts — watch for announcements.
  note: Leadership verified 2026-09-22 from the House Clerk's MemberData.xml (subcommittee code GO12).
