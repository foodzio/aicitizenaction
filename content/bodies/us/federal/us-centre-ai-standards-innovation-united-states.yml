strings:
  name: Centre for AI Standards and Innovation (CAISI) — United States, listed only to prevent acronym confusion
  remit: OUT OF SCOPE for this directory but included as a disambiguation warning. The former US AI Safety Institute was renamed the Center for AI Standards and Innovation in June 2025, sits within NIST/Department of Commerce, and convened the founding meeting of the international network in November 2024. Its acronym 'CAISI' collides exactly with the Canadian AI Safety Institute's, and the two are frequently conflated in secondary sources and existing directories.
  powers_text: research
  reality_check: Included solely so a directory builder does not merge the US and Canadian CAISI entries. Verify which CAISI any source means before citing it.
  notes: "Also note the UK's parallel rename: AI Safety Institute became AI Security Institute in February 2025, retaining the AISI acronym. Both renames signal a policy shift away from 'safety' framing, mirrored at network level in December 2025."
  routes:
