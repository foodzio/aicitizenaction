strings:
  name: House Committee on the Judiciary
  ai_jurisdiction: "Courts, DOJ, FBI, copyright and patent law, antitrust, immigration, and constitutional questions. Send here: AI and copyright, AI liability and Section 230, AI-driven antitrust concerns in compute and model markets, law-enforcement use of AI and facial recognition, government pressure on platforms and AI providers over speech, and AI-enabled crime."
  business: "VERIFIED: H.R.9125 Sectoral AI Governance Act of 2026 (Jacobs, D-CA) referred to this committee and to Oversight, 3 Jun 2026. Subcommittee hearing on protecting creators in the age of AI and the internet (Raskin opening statement published). July 2026 IP subcommittee hearing on site-blocking and the NO FAKES Act. Jordan has also run an aggressive oversight track on alleged government 'jawboning' of AI and platform companies over content."
  public_route: "VERIFIED: https://judiciary.house.gov/contact, including a dedicated whistleblower intake at https://judiciary.house.gov/contact/whistleblowers. Committee: 2138 Rayburn House Office Building, Washington DC 20515, 202-225-6906. Minority: https://democrats-judiciary.house.gov/."
