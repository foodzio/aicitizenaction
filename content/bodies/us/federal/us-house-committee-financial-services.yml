strings:
  name: House Committee on Financial Services
  ai_jurisdiction: "AI in banking, securities, insurance and payments, plus the House side of export-control and sanctions policy touching AI hardware. Send here: AI in credit underwriting and algorithmic discrimination in lending, AI in trading and market structure, AI-enabled financial fraud and deepfake-driven scams, AI and anti-money-laundering, and financial-stability questions from AI concentration."
  business: "VERIFIED: subcommittee hearing 'Unlocking the Next Generation of AI in the U.S. Financial System for Consumers, Businesses, and Competitiveness', 17 Jul 2026 (docket HHRG-119-BA21-20260717). H.R.3447 Chip Security Act, after House Foreign Affairs reported it 42-0 on 26 Mar 2026, was referred on reaching the Senate to Senate Banking — the House-side financial-services committees are part of that chain."
  public_route: "VERIFIED: https://financialservices.house.gov/contact, plus a dedicated whistleblower page at https://financialservices.house.gov/contact/whistleblower.htm. Committee: 2129 Rayburn House Office Building, Washington DC 20515, 202-225-7502. Minority: https://democrats-financialservices.house.gov/."
  note: Chair verified 2026-09-22 from the House Clerk's MemberData.xml. The FLI guide does not cover this committee; it should, because one of its subcommittees is formally named for AI.
