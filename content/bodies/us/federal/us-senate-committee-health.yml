strings:
  name: Senate Committee on Health, Education, Labor, and Pensions
  ai_jurisdiction: "AI where it touches work, health and school. Send here: AI and job displacement, worker surveillance and algorithmic management, AI in hiring and employment discrimination (with EEOC), FDA regulation of AI medical devices and clinical decision support, AI in drug development, AI in K-12 and higher education, and AI literacy. If your concern is 'my employer is using AI on me' or 'an AI tool is making medical decisions', this is the door."
  business: "VERIFIED: Cassidy released a committee white paper on artificial intelligence (https://www.help.senate.gov/help-committee-gop-final-ai-white-paper) covering AI in health care, education, labor and the FDA, and solicited stakeholder responses — an explicit, documented public-comment opportunity. Hearing 'The Impact of AI on the Workforce' (https://www.help.senate.gov/hearings/the-impact-of-ai-on-the-workforce). Sanders as ranking member has made AI-driven job displacement and a shorter work week a signature theme."
  public_route: "VERIFIED: there is no committee-wide /contact page. Published routes are the chair's and ranking member's own Senate offices — Cassidy at https://www.cassidy.senate.gov/contact and Sanders press at https://www.sanders.senate.gov/contact/press-inquiries/. Committee: 428 Dirksen, Washington DC 20510, 202-224-5375."
  note: Chair/ranking verified 2026-09-22 against senate.gov committee_memberships_SSHR.htm.
