strings:
  name: Congressional Artificial Intelligence Caucus
  remit: An informal caucus, NOT a committee. Exists to 'inform policymakers of the technological, economic, and social impacts of advances in AI' and to convene experts from academia, government and industry for member briefings. It has no jurisdiction, no staff of its own beyond member offices, no subpoena power and no ability to legislate as a body. Co-chairs announced vice-chairs and a core initiative in a recent Congress.
  powers_text: convene
  reality_check: "A caucus is a briefing venue, not a decision-making body. The realistic use is offering a briefing: caucus staff programme lunch briefings and are receptive to a credible outside expert with a clear, short, non-partisan presentation. That contact runs through the co-chairs' personal office staff, reached by the phone number above, not through any caucus address. Nothing you send to a caucus creates a record or obliges a response. The separate House Bipartisan Task Force on AI (2024) produced a substantial report but was time-limited — check whether it still exists before citing it."
  notes: "The multiple House-domain mirrors are a genuine trap: several are stale and name former co-chairs."
  routes:
    caucus-contact:
      label: Caucus contact (hosted on a co-chair's House site)
      scope: The caucus's about page publishes only this phone and address plus the X account https://x.com/AICaucus.
      note: "VERIFIED at https://artificialintelligencecaucus-beyer.house.gov/about. NOTE: the caucus site is mirrored across several members' House domains (…-beyer, …-eshoo, …-olson), which change as membership changes — always check which mirror is current."
    caucus-email:
      label: Caucus email
      scope: n/a
      note: VERIFIED ABSENCE — the about page identifies no co-chairs by name and publishes no email, referring only generically to 'Chair offices'.
    homepage:
      label: Homepage
    membership:
      label: Live membership list
    public-route:
      label: Public submission route
  ai_jurisdiction: "Not a jurisdictional body — no bills are referred here and it cannot hold official hearings or markups. Its function is member education and cross-committee coordination: briefings for members and staff, sign-on letters, and building bipartisan support before a bill reaches a committee of jurisdiction. Useful to a member of the public as a way to reach AI-attentive offices in bulk, and as a signal of who is engaged."
  business: "VERIFIED: 16 Sep 2026 bipartisan letter to House leadership urging immediate action on AI guardrails, oversight, security and transparency, signed by Don Beyer, Jay Obernolte, Lori Trahan, Ted Lieu, Scott Franklin, Sara Jacobs, Gabe Amo, Valerie Foushee, Brian Fitzpatrick and Veronica Escobar (beyer.house.gov DocumentID 9218). 17 Sep 2026: Beyer publicly warned Congress 'may not receive another warning shot' on AI."
  public_route: "VERIFIED: caucus office at 1226 Longworth House Office Building, Washington DC 20515, 202-225-4376; contact form at https://artificialintelligencecaucus-beyer.house.gov/contact-us. Caucus membership is for Members of Congress only; the public engages by contacting the co-chairs' offices or by asking their own representative to join."
  note: Co-chairs verified 2026-09-22 from the caucus's official House website. Beyer and McCaul are listed as co-chairs; the 'chair'/'ranking' fields above are used to carry the two co-chairs, not a majority/minority relationship. Note the caucus historically ran from Rep. Eshoo's site (artificialintelligencecaucus-eshoo.house.gov), which is now legacy.
