strings:
  name: Subcommittee on Digital Assets, Financial Technology, and Artificial Intelligence
  ai_jurisdiction: "The only House subcommittee outside Judiciary with 'Artificial Intelligence' in its name. Send here: AI in financial services products, AI agents transacting autonomously, algorithmic underwriting and fair lending, AI fraud detection and AI-enabled fraud, and the regulatory treatment of AI by the SEC, CFTC, OCC, Fed and CFPB."
  business: "VERIFIED: hearing 'Unlocking the Next Generation of AI in the U.S. Financial System for Consumers, Businesses, and Competitiveness', 17 Jul 2026 — committee memorandum published at docs.house.gov/meetings/BA/BA21/20260717/119461/HHRG-119-BA21-20260717-SD002.pdf. The subcommittee has also handled the CLARITY Act digital-asset market-structure work."
  public_route: Full-committee contact https://financialservices.house.gov/contact, 202-225-7502; whistleblower route at /contact/whistleblower.htm.
