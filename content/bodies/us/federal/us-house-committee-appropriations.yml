strings:
  name: House Committee on Appropriations
  ai_jurisdiction: Funds every AI-relevant agency and attaches policy riders that often matter more than authorizing law. Also, with its Senate counterpart, the only committee that formally solicits written testimony from the general public each year.
  business: "VERIFIED: FY2027 public written testimony window run across subcommittees in spring 2026, with per-subcommittee deadlines (CJS 8 May 2026; Interior 24 Apr 2026; Agriculture 1 May 2026). FY27 member-request guidance published at https://appropriations.house.gov/fy27-information/fy27-member-requests-guidance."
  public_route: "VERIFIED: https://appropriations.house.gov/contact and https://appropriations.house.gov/about/offices/contact. Committee: H-305 The Capitol, Washington DC 20515, 202-225-2771. Subcommittee rosters at https://appropriations.house.gov/about/membership/subcommittee-rosters."
