strings:
  name: Senate Committee on the Judiciary
  ai_jurisdiction: "Rights, remedies and law enforcement. Send here: whether AI companies can be sued (duty of care, product liability, Section 230), AI and copyright/right of publicity, AI-generated CSAM and deepfakes as crimes, DOJ and FBI use of AI, antitrust in AI and cloud/compute markets, AI and immigration adjudication, and constitutional/civil-liberties questions. This is the liability door; Commerce is the regulation door."
  business: "VERIFIED: S.2937 AI LEAD Act (Durbin/Hawley, introduced 29 Sep 2025) — first federal AI duty-of-care/product-liability bill, referred to this committee. S.1367 NO FAKES Act of 2026 (Coons) — digital replicas/voice and likeness — referred here and now on the Senate Legislative Calendar. Hearing 'Examining the Harm of AI Chatbots' (S.Hrg. 119-256, 16 Sep 2025, Crime and Counterterrorism Subcommittee). Hearing 'The Good, the Bad, and the Ugly: AI-Generated Deepfakes in 2025' (S.Hrg. 119-171). Prior series 'Oversight of AI' including 'Oversight of AI: Insiders' Perspectives'."
  public_route: "VERIFIED: no /contact page exists on judiciary.senate.gov. Routes are the chair's and ranking member's own Senate offices (Grassley: 202-224-3744; Durbin: 202-224-2152) and the committee's published rules at https://www.judiciary.senate.gov/about/committee/rules. Committee main line 202-224-5225 (Dirksen 224)."
  note: Chair/ranking verified 2026-09-22 against senate.gov committee_memberships_SSJU.htm.
