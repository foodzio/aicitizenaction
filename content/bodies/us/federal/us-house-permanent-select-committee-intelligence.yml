strings:
  name: House Permanent Select Committee on Intelligence
  ai_jurisdiction: "Intelligence Community AI adoption and AI as an intelligence subject. Send here: IC use of frontier models, open-source intelligence and AI, adversary AI capability assessments, AI-enabled influence operations, and counterintelligence risk to US AI developers. Mostly classified; the public-facing output is the annual Intelligence Authorization Act and occasional public warnings."
  business: "VERIFIED: FY2026 Intelligence Authorization Act passed the House 10 Dec 2025 (joint Crawford-Himes statement). The FY2027 Intelligence Authorization Act was reported out of committee 20 Jul 2026, featuring AI, audits and open-source intelligence provisions (Federal News Network, July 2026). 31 Aug 2026: the committee publicly warned of 'Black Swan' AI risks (CNBC)."
  public_route: "VERIFIED: no /contact page. Routes are the committee's about page https://intelligence.house.gov/about/ and the committee office, HVC-304, The Capitol, Washington DC 20515, 202-225-4121. Minority: https://democrats-intelligence.house.gov/. For classified or contractor-side concerns, use the Intelligence Community Whistleblower Protection Act channel through the Intelligence Community Inspector General, not an open letter."
  note: "CORRECTION TO THE FLI GUIDE: it lists Mike Turner (R-OH) as chair and 'Rick Crawford (R-AR)' as ranking member. Both are wrong. Verified 2026-09-22 from the House Clerk's MemberData.xml: Crawford is Chairman and Jim Himes (D-CT) is the ranking Democrat."
