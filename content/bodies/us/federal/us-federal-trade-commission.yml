strings:
  name: Federal Trade Commission (FTC)
  remit: "Enforces Section 5 of the FTC Act against unfair or deceptive acts and practices, plus COPPA, ROSCA and the Fair Credit Reporting Act. Applied to AI this means: deceptive claims about AI capability ('AI washing'), harms from AI products to children, deceptive chatbot design, and misuse of data for training. Can open investigations, issue compulsory process (civil investigative demands and 6(b) orders), sue in federal court, obtain injunctions and civil penalties, and impose consent decrees including algorithmic disgorgement (deletion of models built on unlawfully obtained data). It is the closest thing the US has to a general-purpose AI consumer regulator."
  powers_text: compel
  reality_check: ReportFraud is a real database, not a black hole — but a single consumer complaint rarely triggers action; patterns do. The high-leverage routes are (a) a detailed, documented complaint sent by post to the Bureau of Consumer Protection when the matter is confidential or involves a whistleblower, and (b) public comments on FTC workshops and rulemakings, which are docketed, published, and cited in Commission statements. The FTC's AI work is squarely CONSUMER-HARM oriented — deception, children's safety, data misuse — and it has no theory of action for catastrophic or frontier risk. Do not route an existential-risk argument here.
  notes: Enforcement priorities shift sharply with commission composition; check current leadership before assuming a given theory of harm is live.
  routes:
    reportfraud-ftc-gov-ftc:
      label: ReportFraud.ftc.gov — the FTC's public complaint intake
      scope: Anyone may report a business practice, including deceptive AI claims or harmful AI products. Reports feed the Consumer Sentinel database used by FTC and 2,800+ law-enforcement partners.
      note: VERIFIED on https://www.ftc.gov/about-ftc/contact.
    consumer-helpline:
      label: Consumer helpline
      scope: General consumer inquiries and complaints.
      note: VERIFIED on the FTC contact page.
    ftc-public-comment-rulemakings:
      label: FTC public comment on rulemakings, workshops and 6(b) studies
      scope: The FTC takes public comment on proposed rules and on workshop records; comments are published on the docket.
      note: UNVERIFIED as fetched. The FTC also runs its own comment pages linked from each rulemaking announcement.
    public-affairs-press:
      label: Public affairs / press
      scope: Journalists only.
      note: VERIFIED on the FTC contact page. Also webmaster@ftc.gov (site issues) and electronicfilings@ftc.gov (administrative litigation filings).
    mail-confidential-material:
      label: Mail for confidential material
      scope: The FTC explicitly warns that email is not secure and says to mark confidential information 'Confidential' and send it by post.
      note: VERIFIED — quoted from the FTC contact page.
    homepage:
      label: Homepage
    submission-page:
      label: Submission page
      scope: "Reports of fraud, scams and bad business practices — which covers AI-related deception: false capability claims, deceptive AI marketing, undisclosed AI use, AI-enabled impersonation. The FTC has brought AI-deception cases under its Section 5 unfair-or-deceptive-practices authority."
      note: "Online at reportfraud.ftc.gov. Note: at the time of this research the site was returning a government shutdown notice and was unable to offer the reporting service, directing users to consumer.ftc.gov instead — verify availability before relying on it. An alternative framing for AI-safety-adjacent harms is a complaint to a State Attorney General."
    homepage-5328c1d5:
      label: Homepage
  accepts: "Reports of fraud, scams and bad business practices — which covers AI-related deception: false capability claims, deceptive AI marketing, undisclosed AI use, AI-enabled impersonation. The FTC has brought AI-deception cases under its Section 5 unfair-or-deceptive-practices authority."
  does_not_accept: The FTC does not resolve individual complaints and will not obtain redress for you in the ordinary case. Reports feed the Consumer Sentinel Network, a law enforcement intelligence database shared with federal, state and international enforcers.
  how: "Online at reportfraud.ftc.gov. Note: at the time of this research the site was returning a government shutdown notice and was unable to offer the reporting service, directing users to consumer.ftc.gov instead — verify availability before relying on it. An alternative framing for AI-safety-adjacent harms is a complaint to a State Attorney General."
  format: "Structured web form: what happened, who, when, amounts, documents."
  timing: Rolling (subject to the availability issue above).
  after: Data enters Consumer Sentinel and is used to spot patterns and build cases. No individual case is opened and you get no case outcome.
  operator: Federal Trade Commission
