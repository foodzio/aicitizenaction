strings:
  name: National Institute of Standards and Technology (NIST) — Information Technology Laboratory and AI programmes
  remit: Non-regulatory standards agency. Publishes the AI Risk Management Framework (AI RMF 1.0) and its profiles (including Generative AI and critical-infrastructure profiles), measurement science, benchmarks and evaluation methods. Hosts CAISI and the NIST AI Consortium. In Dec 2025 NIST also launched centers for AI in manufacturing and critical infrastructure. Its outputs are voluntary but are widely incorporated by reference into procurement, insurance and state law.
  powers_text: research
  reality_check: "NIST's public-comment process is one of the genuinely effective US routes: comment periods on draft NIST AI publications are real, staff read and tabulate every submission, and substantive technical comments visibly change the text between draft and final. The trick is timing — you must catch the window, which is announced in the Federal Register and on the NIST AI page, not by writing in unsolicited. Technical specificity beats advocacy: NIST responds to measurement proposals, not to position statements."
  notes: Non-regulatory by statute. NIST cannot compel, fine or investigate anyone.
  routes:
    nist-itl-ai-contact:
      label: NIST ITL AI contact
      scope: General AI programme correspondence.
      note: VERIFIED at https://www.nist.gov/itl/ai/contact-us (published as 'itlmail [at] nist.gov').
    federal-register-notices-nist:
      label: Federal Register notices for NIST AI drafts and RFIs
      scope: All NIST comment opportunities are announced here with a docket number and a regulations.gov link.
      note: UNVERIFIED as fetched; URL follows the Federal Register's documented agency-page scheme.
    nist-ai-landing-page:
      label: NIST AI landing page (drafts open for comment listed here)
      scope: NIST posts draft publications with comment deadlines and a submission address on this hub.
      note: VERIFIED — page fetched; it lists AI RMF, CAISI and NIST AI Consortium but publishes no AI-specific email.
    homepage:
      label: Homepage
