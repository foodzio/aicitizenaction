strings:
  name: NIST AI Risk Management Framework (AI RMF) and AI Resource Center
  remit: AI RMF 1.0 (Jan 2023) — a voluntary framework structured around Govern, Map, Measure, Manage — plus the Generative AI Profile (NIST AI 600-1), crosswalks to other frameworks, the AI RMF Roadmap, and the AI Resource Center (AIRC) with the Trustworthy & Responsible AI playbooks. The RMF is being revised under the White House AI Action Plan.
  threat_model: "Sociotechnical risk across the board: validity, safety, security/resilience, accountability/transparency, explainability, privacy, and bias. The GenAI Profile explicitly covers CBRN information access, confabulation, dangerous/violent content and harmful bias — so it does reach misuse risk, but not loss of control."
  reality_check: "Genuinely responsive by government standards: a real published inbox, real published comment dockets, and a track record of incorporating external crosswalks. A substantive, well-structured comment submitted during an open RFI is one of the highest-yield low-cost actions available anywhere in this list for a US-relevant concern. Note that NIST's AI safety posture shifted substantially with the 2025 AI Action Plan and the CAISI reorganisation — the framing is now innovation-and-security rather than safety."
  gov_channel: Direct — NIST is a US federal agency; the AI RMF is referenced in federal procurement, state legislation and international crosswalks.
  routes:
    ai-rmf-team-inbox:
      label: AI RMF team inbox — reads and logs external comments
      scope: Anyone; feedback on the framework, roadmap, crosswalks
      note: Published on NIST's own Engage page. NIST has historically published the comments it receives.
    formal-requests-information-public:
      label: Formal Requests for Information / public comment dockets
      scope: Anyone, during open windows; comments are published
      note: Prior RFI responses are archived at https://www.nist.gov/itl/ai-risk-management-framework/comments-received-rfi-artificial-intelligence-risk-management — evidence that submissions are genuinely published.
    mailing-list-nist-ai:
      label: Mailing list for NIST AI activity announcements (catches new comment windows)
      scope: Anyone
    ai-resource-center:
      label: AI Resource Center
      scope: Playbooks, crosswalks, glossary
    homepage:
      label: Homepage
