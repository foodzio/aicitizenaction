strings:
  name: Senate Select Committee on Intelligence
  ai_jurisdiction: "Intelligence Community use of AI and AI as an intelligence target. Send here: IC adoption of frontier models, AI in signals and open-source intelligence, foreign adversary AI capabilities assessments, AI-enabled foreign influence operations, and counterintelligence risk to US AI labs (including insider threat and foreign talent access). Proceedings are largely classified, so the public route is narrow and mostly one-way."
  business: "VERIFIED by referral: Cotton is lead sponsor of S.1705 Chip Security Act (referred to Banking). The committee's AI work is carried in the annual Intelligence Authorization Act. UNVERIFIED for open 2026 AI hearing titles — most sessions are closed."
  public_route: "VERIFIED: https://www.intelligence.senate.gov/about-the-committee/contact/. Committee: 211 Hart, Washington DC 20510, 202-224-1700. This committee also operates the statutory Intelligence Community whistleblower channel, which is the realistic route for someone with classified or contractor-side AI concerns."
  note: Chair verified 2026-09-22 against senate.gov committee_memberships_SLIN.htm; the minority leader of this committee holds the title Vice Chairman, not Ranking Member.
