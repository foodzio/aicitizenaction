strings:
  name: Senate Committee on Appropriations
  ai_jurisdiction: Money, and therefore the real leverage over AI agencies. Appropriations bills carry both funding levels and policy riders for NIST/CAISI, NSF, DOE labs, DHS/CISA, DoD AI programs and the FTC. Also the only committee in Congress that formally invites written testimony from the general public every year.
  business: "VERIFIED: the committee accepted public written testimony for FY2027, with the Commerce, Justice, Science subcommittee deadline of 22 May 2026. Subcommittee markup of the FY2027 Commerce, Justice, Science and Related Agencies Appropriations Act held in 2026."
  public_route: "VERIFIED: the /contact page is retired (returns HTTP 410). Working routes: committee office S-128, The Capitol, Washington DC 20510, 202-224-7257, and the FAQ page https://www.appropriations.senate.gov/about/faqs. Hearings are open to the public subject to space."
