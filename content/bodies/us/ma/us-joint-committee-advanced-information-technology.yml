strings:
  name: Joint Committee on Advanced Information Technology, the Internet and Cybersecurity — Senate chair
  ai_jurisdiction: The named AI/technology policy committee of the General Court; handles AI in healthcare decision-making, data privacy, cybersecurity and internet bills.
  business: S.2632, An Act relative to the use of artificial intelligence and other software tools in healthcare decision-making (from S.46, Sens. Moore and Eldridge) — reported favorably 16 Oct 2025, recommended for passage and sent to Senate Ways and Means 2 April 2026.
  status: VERIFIED — S.2632 sitting in Senate Ways and Means as of 22 Sep 2026. Massachusetts has no comprehensive AI statute; the 194th General Court's formal sessions ended 31 July 2026 and the frontier-AI provisions moved to the economic development vehicle instead (see Economic Development entry).
  public_route: "YES — Massachusetts accepts online written testimony from any member of the public for any noticed hearing. Create a free MyLegislature account, open the hearing's detail page, and use 'Submit Testimony'; testimony is attached to the hearing record and shared with committee members. Sign-up to speak is handled per hearing notice. Deadline convention: testimony is generally accepted up to and for a short window after the hearing, but committees ask for submission by the hearing start."
  agency_route: Massachusetts Attorney General — April 2024 AI advisory applying Chapter 93A consumer protection and anti-discrimination law to AI; complaints at https://www.mass.gov/how-to/file-a-consumer-complaint
  note: "Senate vice chair: Pavel M. Payano. Senate ranking minority: Peter J. Durant. Committee phone (617) 722-1485."
