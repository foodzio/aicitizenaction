strings:
  name: House Economic Matters Committee
  ai_jurisdiction: House committee of reference for AI consumer-protection, surveillance-pricing, business-regulation and technology-commerce bills. 19 members appointed by the Speaker.
  business: "2026 surveillance-pricing legislation restricting AI-driven individualized pricing; HB 1057 (crossfile of SB 720, AI Ready Schools, Chapter 634). Related: AI Governance Act of 2024 (SB 818)."
  status: VERIFIED — Maryland enacted targeted 2026 AI measures (education, state AI partnership, surveillance pricing) but no comprehensive private-sector AI risk statute.
  public_route: YES — same MyMGA Witness Signup system. Submission window 8:00 a.m.–6:00 p.m. two business days before the hearing. Economic Matters publishes its own witness guidelines PDF with panel rules and time limits.
  agency_route: "Maryland Attorney General Consumer Protection Division; Maryland DoIT. Program hub: https://ai.maryland.gov/ai-maryland/legislation"
  note: "Vice Chair: Lorig Charkoudian. Committee email aa_ecm@mga.maryland.gov, phone (410) 841-3519, House Office Building Room 231."
