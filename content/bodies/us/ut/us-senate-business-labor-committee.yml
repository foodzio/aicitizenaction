strings:
  name: Senate Business and Labor Committee
  ai_jurisdiction: Senate standing committee for AI consumer-protection and technology-commerce bills, including SB 226 and the 2026 AI package.
  business: "SB 226 (2025, narrowing the AI Policy Act); 2026: SB 256 (AI defamation and identity), SB 319 (insurance preauthorization human review), SB 150 (AI medical advice — Vickers' own bill), SB 73 (age verification), SB 69 (school devices)."
  status: VERIFIED — nine AI bills cleared the 2026 general session; Utah continues to narrow broad disclosure duties while expanding targeted harms coverage (deepfakes, CSAM, health, insurance).
  public_route: "PARTIAL — same Utah convention: virtual meeting attendance with an option to provide public comment at the chair's discretion, plus in-person comment at the chair's discretion. Contact committee secretary Zoe Adams or analyst Rohnin Randles in advance of the hearing."
  agency_route: Utah Division of Consumer Protection / Office of Artificial Intelligence Policy — https://dcp.utah.gov/complaints/
  note: "Members: Cullimore, Ipson, McCay, Musselman, Pitcher (D), Sandall, Weiler. Eight members total."
