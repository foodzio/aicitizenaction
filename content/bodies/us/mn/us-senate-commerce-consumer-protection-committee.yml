strings:
  name: Senate Commerce and Consumer Protection Committee
  ai_jurisdiction: Senate committee of reference for AI consumer-facing bills, chatbot restrictions and data privacy. Meets Tue/Thu 12:30–2:30 p.m., Room G-15 Capitol.
  business: 2026 bipartisan Senate package on consumer-facing AI, including a proposed ban on minors' access to companion chatbots; SF 1886; companion measures to HF 4452. Minnesota's enacted AI nudification ban is the subject of xAI v. Minnesota (D. Minn., filed July 2026; preliminary injunction denied).
  status: VERIFIED — bipartisan Senate AI package presented and moving through committee in 2026; nudification ban in effect pending litigation.
  public_route: "PARTIAL — arrange with committee staff in advance. Committee administrator: Bill Lunzer, 651-296-2090. Senate Information: 651-296-0504 or senate.information@senate.mn. No online portal; written testimony is delivered to the administrator for distribution to members."
  agency_route: Minnesota Attorney General — https://www.ag.state.mn.us/Office/Complaint.asp
  note: "Vice Chair: Judy Seeberger (DFL-41). Ranking Minority Member: Gary H. Dahms (R-15). Eleven members total."
