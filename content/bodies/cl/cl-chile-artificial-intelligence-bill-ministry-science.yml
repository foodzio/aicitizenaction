strings:
  name: Chile — Artificial Intelligence Bill (Boletín 16821-19) and Ministry of Science, Technology, Knowledge and Innovation
  remit: "STATUS AS OF SEPT 2026: STILL A BILL. Chile's comprehensive AI bill, sent by the executive in May 2024 and modelled on the EU AI Act's risk tiers (unacceptable / high / limited / no evident risk), was still in Senate committee proceedings as of February 2026. It would designate an existing or new supervisory authority with sanctioning powers. Chile also has an updated National AI Policy (2024) and leads the Latin American AI Index (ILIA) with Brazil and Uruguay. Until passage, the ministry is a policy body only."
  powers_text: advise
  reality_check: Chile is the most regulatorily advanced Spanish-speaking jurisdiction on AI but still has no law in force. Its previous AI policy consultations were genuinely open and Chile has a good record of participatory policymaking, but I verified no live channel and no URLs. Spanish only. No frontier-risk dimension beyond what it inherits from the EU AI Act template.
  notes: Listed with low confidence. Verify the bill's status directly before publishing — Latin American AI bills have slipped repeatedly.
  routes:
    chilean-senate-legislative-tracking:
      label: Chilean Senate legislative tracking
      scope: legislative record
      note: UNVERIFIED — I did not verify a Senate URL for this bill. Chilean congressional committees do receive written submissions and hear external experts, but the process is Spanish-language and by invitation.
