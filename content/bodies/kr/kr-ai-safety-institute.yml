strings:
  name: AI Safety Institute (Korea AISI)
  remit: "Launched Nov 2024. Hosted within ETRI (한국전자통신연구원, Electronics and Telecommunications Research Institute) under the Ministry of Science and ICT (과학기술정보통신부, MSIT). Three divisions: AI safety policy, AI safety evaluation, AI safety research. Supports MSIT in implementing the AI Framework Act but is itself a research institute — it does not issue orders or fines."
  powers_text: research
  reality_check: Poor. Korea AISI has an English site that advertises international collaboration but publishes no contact email, no form, and no submission route — verified by fetching both the English homepage and the dedicated Collaboration page. The only published contact is a street address in Pangyo. For a foreigner this is effectively unreachable except via a named researcher or through ETRI/MSIT.
  notes: I could not verify any 2025–26 rename. Some sources render the English name as 'Korea AI Safety Institute'; the site itself says simply 'AI Safety Institute (AISI)'.
  routes:
