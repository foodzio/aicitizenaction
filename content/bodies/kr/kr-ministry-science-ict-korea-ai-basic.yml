strings:
  name: Ministry of Science and ICT — Korea AI Basic Act information portal
  remit: Dedicated government information portal for the AI Framework Act (commonly 'AI Basic Act'), which took effect 22 January 2026. Provides the statutory text, enforcement decree materials and guidance for businesses subject to high-impact AI and generative AI obligations, including the domestic-representative requirement for foreign providers.
  powers_text: advise
  reality_check: Relevant to foreign companies because the Act reaches them extraterritorially, but the portal is Korean-language and oriented to compliance, not to public input. Foreign firms engage through Korean counsel and their mandated domestic representative.
  notes: Listed to give foreign parties a concrete starting point for the one non-Western AI statute that actually binds them.
