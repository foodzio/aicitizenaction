strings:
  name: National AI Committee
  ai_jurisdiction: Presidentially-chaired apex AI body referenced in the AI Framework Act. Article 34 empowers it to impose additional safety and reliability requirements on high-impact AI deployers beyond the Act's baseline — a genuinely substantive power, not merely advisory. Functions as the national AI control tower above MSIT.
  business: Operative under the AI Framework Act since 22 January 2026. Its Article 34 power to add requirements on high-impact AI is the provision to watch, because it lets Korea tighten obligations without amending the statute.
  public_route: "No direct public submission route. Indirect only: comment on MSIT drafts via 국민참여입법센터, or reach the committee's agenda through the National Assembly's 과방위."
  format_rules: None applicable.
  realistic: "Not usable directly. A presidentially-chaired committee with closed membership. Its importance to an outside observer is analytical rather than participatory: because Article 34 lets it add binding requirements administratively, watching its output matters more than trying to address it."
  language_note: Korean only.
  note: MARKED UNVERIFIED ON NAME AND MEMBERSHIP. The Act's creation of a presidentially-chaired national AI committee and its Article 34 power are VERIFIED from FPF and Cooley analyses of the Act, which use the English rendering 'National AI Committee'. Separately, Korean-language sources use 국가인공지능전략위원회 ('National AI Strategy Committee') for a body launched under the Lee administration. I could not establish within this research whether these are the same body, a renaming, or two distinct structures. Resolve this before citing — do not treat the Korean and English names above as confirmed equivalents, and do not name a vice-chair.
  seat_notes:
    chair: Chaired ex officio by the President of the Republic of Korea (currently Lee Jae-myung). The vice-chair and the private-sector membership were not verified and are not named here.
