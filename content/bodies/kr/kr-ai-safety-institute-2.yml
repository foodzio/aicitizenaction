strings:
  name: AI Safety Institute (Korea AISI)
  ai_jurisdiction: Statutory body established under the AI Framework Act to evaluate AI risk and develop safety standards. Korea's node in the International Network of AI Safety Institutes. Co-produced the bilingual Korea AI Basic Act resource with the Future of Life Institute.
  business: "Operates under MSIT with the Electronics and Telecommunications Research Institute (ETRI) as host/supporting organisation — note this dual line: it is statutorily grounded but institutionally embedded in a government research institute rather than standing alone. Work programme covers AI safety policy, evaluation methodology and international AISI collaboration."
  public_route: "No formal comment mechanism. Practical routes: research collaboration enquiries and general contact via aisi.re.kr; international engagement through the AI Safety Institute network; policy input indirectly via MSIT pre-announcement."
  format_rules: None; no formal participation process exists to have a threshold.
  realistic: Not a participation route in any formal sense, but it is the most approachable Korean AI institution for an outsider because it has a working English presence and an internationally-facing research remit. Researchers and technical contributors can realistically make contact. Ordinary citizens have no route here and should use the petition or the MSIT pre-announcement instead.
  language_note: Korean and English. Korea AISI maintains a genuine English site — a notable exception in this jurisdiction and the most accessible Korean AI body for a non-Korean speaker.
  note: Director and the MSIT/ETRI institutional relationship VERIFIED from the institute's own English site aisi.re.kr/eng/contents/23 and its site footer. The statutory basis under the AI Framework Act is VERIFIED indirectly via Cooley's analysis, which refers to an 'AI Safety Research Institute' established by the law; the exact article number is UNVERIFIED.
