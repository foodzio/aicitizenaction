strings:
  name: Department for the Coordination of Algorithmic Oversight (DCA), Autoriteit Persoonsgegevens
  remit: Unit inside the Dutch DPA (AP) set up in 2023 to coordinate algorithmic and AI oversight across Dutch regulators, identify and publish high-level algorithmic and AI risks (it issues a recurring AI & Algorithmic Risks Report Netherlands), and prepare AI Act supervision. Under the Dutch AI Act designation settled in 2026, the AP and the RDI (Rijksinspectie Digitale Infrastructuur) take the key supervisory roles — AP for prohibited practices and fundamental-rights-relevant systems, RDI as overall market-surveillance coordinator. AP itself has full GDPR fining power; the DCA as a unit is coordinating/analytical.
  powers_text: investigate
  reality_check: Strong. A named, published mailbox that explicitly invites feedback from 'organisations and other parties', on a fully English-language regulator site, at a body with real GDPR enforcement muscle. The DCA also publishes recurring risk reports that cite external input. This is one of the few entries where a foreigner writing in English has a plausible chance of being read.
  notes: Netherlands is NOT a member of the international network. The RDI (Rijksinspectie Digitale Infrastructuur) is the co-designated authority; I did not verify RDI contact details and have not listed a URL for it.
  routes:
    dca-mailbox:
      label: DCA mailbox
      scope: algorithmic oversight coordination
      note: VERIFIED — published on the AP's English DCA page, which renders it with an anti-spam insertion ('dca@remove-this-text.autoriteitpersoonsgegevens.nl'). The operative address is as given. Page states the DCA 'welcomes feedback from organisations and other parties'.
    ap-algorithms-ai-oversight:
