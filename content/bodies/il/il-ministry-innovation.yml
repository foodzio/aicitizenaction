strings:
  name: Ministry of Innovation, Science and Technology — Israel AI policy
  remit: "Israel published its 'Policy on Artificial Intelligence Regulation and Ethics' (Dec 2023), jointly with the Ministry of Justice, adopting a deliberately sectoral, soft-law, pro-innovation approach: no AI act, no central AI regulator, guidance to existing sectoral regulators, and a proposed inter-ministerial AI policy coordination centre. The Privacy Protection Authority handles data-related AI issues. As of Sept 2026 I found no evidence that Israel has established an AI safety institute or binding AI legislation."
  powers_text: advise
  reality_check: Weak for outsiders. Israel's approach is explicitly to avoid creating a central AI body, which means there is no address to write to. The policy document was itself produced after a public call for comments (2022), so consultation does happen episodically, but there is no standing channel. gov.il is partially English-language. No frontier-risk institutional stance.
  notes: Israel signed the Bletchley Declaration. Not a network member. I could not verify any 2025–26 institutional change; treat the 2023 policy as the current baseline.
