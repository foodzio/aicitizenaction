strings:
  name: All-Party Parliamentary Group on Artificial Intelligence (APPG AI)
  ai_jurisdiction: "Cross-party, cross-House informal group. Its registered purpose: 'The APPG explores the social, economic and societal impact and implications of artificial intelligence.' It has no formal powers but it convenes ministers, officials and MPs, runs evidence sessions and publishes reports — and unlike a select committee it is genuinely open to unsolicited outside contact."
  business: Ongoing evidence/roundtable programme run by the Big Innovation Centre secretariat. APPG registers are republished roughly every 5–6 weeks; the 29 June 2026 register is the most recent verified entry.
  public_route: Email the secretariat directly — appg@biginnovationcentre.com (Prof. Birgitte Andersen, tel 07944 783648) — or write to the Chair at allison.gardner.mp@parliament.uk / House of Commons, London SW1A 0AA. APPGs accept unsolicited papers, invite outside speakers and have no evidence-window constraint, which makes this the most underused door in Westminster.
  format_rules: No formal word limit, deadline or publication rule — it is not a parliamentary proceeding. Material is published at the secretariat's discretion. Note that anything you send is not protected by parliamentary privilege.
  key_people: "Co-Chair: Lord Clement-Jones (Liberal Democrat) — the most active AI legislator in the Lords. Vice-Chairs: Dawn Butler MP (Labour); Lord Ranger of Northwood (Conservative). Public enquiry point: Professor Birgitte Andersen, Big Innovation Centre (the APPG's secretariat)."
  note: VERIFIED 2026-09-22 from the official Register of All-Party Parliamentary Groups as at 29 June 2026. Dr Gardner also sits on the Commons Science and Technology Committee, which makes her the highest-leverage single UK backbench contact on AI.
