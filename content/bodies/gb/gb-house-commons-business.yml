strings:
  name: House of Commons Business, Innovation, Science and Trade Committee (committee id 365; formerly the Business and Trade Committee)
  ai_jurisdiction: Departmental select committee for the new Department for Business, Innovation, Science and Trade (DBIST), which absorbed much of the abolished DSIT. It ran the inquiry 'Artificial Intelligence, business and the future of the workforce' — the most substantial Commons AI inquiry of this Parliament. AI's effect on employment, skills, business adoption and industrial strategy sits here.
  business: "'Artificial Intelligence, business and the future of the workforce' (work id 9674) — written evidence CLOSED at 11:59pm on 3 April 2026; the committee is in the report/oral-evidence phase."
  public_route: Written evidence when a call is open; otherwise write to the Chair or the committee clerk, and watch for the next call for evidence.
  format_rules: "Standard Commons rules: usually max 3,000 words, numbered paragraphs, single editable file under 25MB, published permanently."
  key_people: "Members: Dan Aldridge, Antonia Bance, Chris Bloore, John Cooper (Con), Sarah Edwards, Alison Griffiths (Con), Leigh Ingham, Justin Madders, Charlie Maynard (LD), Joshua Reynolds (LD)."
  note: VERIFIED 2026-09-22. The committee page URL still says 'business-and-trade-committee' but the membership page heading reads 'Business, Innovation, Science and Trade Committee' — renamed after the July 2026 machinery-of-government changes. The AI/workforce inquiry is no longer accepting evidence.
