strings:
  name: Competition and Markets Authority (CMA)
  remit: Competition and consumer protection regulator. Relevant to AI through foundation-model market studies, merger review of AI partnerships and acqui-hires, and the digital markets competition regime (Strategic Market Status designations under the DMCC Act, which allow the CMA to impose conduct requirements and pro-competition interventions on designated firms). Can compel information, conduct market investigations, block or unwind mergers, impose conduct requirements, and fine up to 10% of global turnover — and under the DMCC regime the CMA can now enforce consumer law directly with fines rather than going to court.
  powers_text: fine
  reality_check: "The CMA's foundation-model market study was unusually open: it published a call for evidence, set up a dedicated study mailbox, met respondents, and quoted submissions in its update reports. That per-study mailbox — not general.enquiries@cma.gov.uk — is where input lands. The general enquiries address is a correspondence unit. The CMA's AI framing is market power and consumer harm, with an explicit concern about concentration in compute and model supply; it has occasionally touched on safety as a competition concern (whether incumbents can be disciplined) but does not regulate model risk. FOI to the CMA is underused and productive."
  notes: The DMCC regime materially expanded CMA powers; SMS designations are the mechanism to watch for AI-market intervention.
  routes:
    report-competition-or-market:
      label: Report a competition or market problem
      scope: Anyone can report suspected anti-competitive conduct, including in AI markets (compute access, model distribution, exclusive partnerships).
      note: VERIFIED — linked from the CMA's GOV.UK organisation page.
    general-enquiries:
      label: General enquiries
      scope: General correspondence.
      note: "VERIFIED on https://www.gov.uk/government/organisations/competition-and-markets-authority. Phone 020 3738 6000. Address: The Cabot, 25 Cabot Square, London E14 4QZ."
    freedom-information-requests:
      label: Freedom of Information requests
      scope: FOI — a genuinely useful route for extracting CMA analysis of AI markets.
      note: VERIFIED on the same page.
    cma-consultations-market-study:
      label: CMA consultations and market study calls for evidence
      scope: The CMA's foundation-model work proceeded via published calls for evidence with named response deadlines and email addresses per study.
      note: VERIFIED as the hub; individual study pages carry their own dedicated response mailbox.
    homepage:
      label: Homepage
