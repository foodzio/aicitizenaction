strings:
  name: New Zealand House of Representatives — select committee submission system (the public route)
  ai_jurisdiction: The mechanism for reaching any New Zealand select committee, including on any future AI bill.
  business: "Items open for submissions as at 22 Sep 2026: Building Amendment Bill (Transport and Infrastructure); Local Government (Rates Capping) Amendment Bill (Finance and Expenditure); three References to Tiriti o Waitangi/Treaty of Waitangi amendment bills (Justice); Taxation (Annual Rates for 2026-27, FBT Simplification, Foreign Investment Funds, and Remedial Measures) Bill (Finance and Expenditure). None is AI-related."
  public_route: "Check the 'open for submissions' list, then submit through the form on that item's page. Official description: 'A submission is your chance to present your opinions, observations, and recommendations on a matter before a select committee. Submissions are written, but you may also ask to talk to the committee in person' — and committees may hear submitters 'face to face, by phone, or by video conference'. Anyone can submit. General enquiries: Select.Committees@parliament.govt.nz."
  format_rules: No word limit stated. English or Māori. 'Once you've made your submission, it can be released by the committee at any time, which means making it available to the public via the Parliament website. It can take a few months for submissions to be made available online.' A team of advisers reads and analyses all submissions and reports the results to the committee in a departmental report; both that report and the committee's report to the House are published.
  note: VERIFIED 2026-09-22 by direct fetch of parliament.nz 'How to make a submission' and the select committees home page (open-for-submissions list read live).
