strings:
  name: Education and Workforce Committee (54th Parliament)
  ai_jurisdiction: "Remit: 'education, training, employment, immigration, industrial relations, health and safety, and accident compensation.' This is where AI's labour-market effects land in New Zealand — automation and job displacement, AI in workplaces and workplace surveillance, and AI in education and training. It has produced MPs' reporting on AI and business returns."
  business: "Bills, estimates and annual reviews referred by the House, plus briefings. Secretariat: ew@parliament.govt.nz."
  public_route: Submission when a call is open, or a petition referred to this committee.
  format_rules: "Same New Zealand rules: no word limit, English or Māori, published by the committee, oral submissions available including remotely."
