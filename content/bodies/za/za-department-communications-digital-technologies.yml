strings:
  name: Department of Communications and Digital Technologies (DCDT)
  remit: Owns South Africa's AI policy process. Published the Draft South Africa National Artificial Intelligence (AI) Policy in Government Gazette No. 54477 on 10 April 2026 for a 60-day public comment period closing 10 June 2026 at 16:00. Policy-making body; enforcement of AI-adjacent harms sits with the Information Regulator (POPIA, which has fining power) and sectoral regulators. South Africa chaired the G20 in 2025 and used it to push African AI capacity issues.
  powers_text: advise
  reality_check: "The best-documented open comment process in this entire directory: a gazetted notice, a named official, a working email, a postal address, a 60-day window, all in English, with no stated nationality restriction. That is genuinely usable by a foreigner. The catch is timing — the window closed in June 2026, and the email may be dormant. South African gazette notices do not normally restrict submissions by nationality."
  notes: "I checked specifically: the draft policy contains NO mention of frontier AI, existential risk, or catastrophic risk. The framing is developmental — capacity, skills, inclusion, infrastructure. This is typical of African AI policy and worth stating plainly in any global directory."
  routes:
    ai-policy-comment-submissions:
      label: AI policy comment submissions
      scope: draft National AI Policy comments
      note: VERIFIED — read directly from the Government Gazette PDF. Submissions required the subject line 'Draft South Africa National Artificial Intelligence (AI) Policy'. The window closed 10 June 2026, so this address may no longer be monitored.
    draft-national-ai-policy:
      label: Draft National AI Policy, Gazette No. 54477
      scope: draft policy
      note: VERIFIED fetched.
    dcdt-national-ai-policy:
