  name: Government of Ireland — Minister of State with the AI brief, Department of Enterprise, Tourism and Employment
  ai_jurisdiction: The Irish ministerial holder engaging the Oireachtas AI committee. Ireland's AI policy sits in the Department of Enterprise, Tourism and Employment, which is also the department that leads on EU AI Act implementation and the designation of national competent authorities.
  business: Appearing before the Joint Committee on Artificial Intelligence on 23 September 2026 at 16:30.
  public_route: Raise the matter in writing with the Joint Committee on Artificial Intelligence ahead of a ministerial session — committees regularly put constituent-raised points to ministers directly — or contact the Minister through a TD.
  format_rules: No formal rules for ministerial correspondence; not published.
