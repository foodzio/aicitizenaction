strings:
  name: AI Office of Ireland (proposed)
  remit: STATUS UNCERTAIN AS OF SEPT 2026 — this body does not yet exist. The Regulation of Artificial Intelligence Bill 2026 was published 17 June 2026 by the Department of Enterprise, Tourism and Employment and would establish 'Oifig IS na hÉireann (AI Office of Ireland)' as an independent statutory body acting as Ireland's central coordinating authority for AI Act implementation. As of this research date the Bill was awaiting passage through the Oireachtas. Ireland had already designated a distributed set of eight/nine existing sectoral regulators as national competent authorities in 2025.
  powers_text: advise
  reality_check: Do not list the AI Office of Ireland as an operating body — it is a creature of a Bill that had not passed when I checked. Ireland matters disproportionately because most major US AI firms have their EU establishment there, so Irish authorities will in practice supervise them. Until the Office exists, the route is the Department and the existing sectoral regulators. No AI-specific public contact route is published.
  notes: Ireland is NOT a member of the international network. Irish Oireachtas committees do accept written submissions on Bills from any party, including foreigners, during pre-legislative scrutiny — that is the realistic input window.
