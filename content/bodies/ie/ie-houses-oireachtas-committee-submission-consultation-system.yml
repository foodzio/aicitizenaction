strings:
  name: Houses of the Oireachtas — committee submission and consultation system (the public route)
  ai_jurisdiction: The mechanism for reaching any Oireachtas committee, including the Joint Committee on Artificial Intelligence and the AI-adjacent committees (Enterprise, Tourism and Employment; Further and Higher Education, Research, Innovation and Science; Arts, Media, Communications, Culture and Sport; Justice, Home Affairs and Migration; Finance, Public Expenditure, Public Service Reform and Digitalisation, and Taoiseach).
  business: Current calls for submissions are indexed on the Oireachtas public consultations page.
  public_route: "Official wording: 'Committees give people the opportunity to input directly into the work of the Oireachtas, usually by sending a written submission. A Committee may hold a public consultation on a specific matter and issue a call to the public to send submissions relating to it... ANYONE WHO WISHES TO RAISE A MATTER WITH A COMMITTEE MAY WRITE OR SEND A SUBMISSION TO THE COMMITTEE AT ANY TIME.' That last sentence is the important one: unlike the UK, Canada, Australia and New Zealand, Ireland does not require an open call for evidence before you can write in. Separately: petition the Oireachtas through the Committee on Public Petitions; and there is a formal remedy, 'Utterances having an adverse effect', if a statement made about you in a committee meeting was not addressed."
  format_rules: Follow the Oireachtas guidance note 'Making Witness Submissions and Oral Presentations to Oireachtas Committees'. Submissions accepted by a committee are typically published on the committee's Documents page. Witnesses invited to appear are normally asked to supply a written submission in advance.
  note: VERIFIED 2026-09-22 by direct fetch of oireachtas.ie/en/committees/making-a-submission/; all quoted text is from that page.
