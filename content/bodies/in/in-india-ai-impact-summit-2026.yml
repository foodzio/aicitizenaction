strings:
  name: India AI Impact Summit 2026
  ai_jurisdiction: Host of the fourth in the series of global AI summits (after Bletchley, Seoul, Paris). Held 19-20 February 2026 at Bharat Mandapam, New Delhi. Organised by MeitY/IndiaAI under a 'Sutras and Chakras' framework. Set the agenda for Global South AI positioning; the India AI Governance Guidelines were foregrounded there.
  business: Concluded 20 February 2026. Current business is implementation and follow-through of summit outcomes. The Summit ran a formal pre-summit stakeholder consultation in June 2025 with dedicated category sessions for international organisations, industry, startups, academia AND civil society, plus a Global South Showcase and a research symposium. UN ODET ran side events.
  public_route: The stakeholder consultation form at impact.indiaai.gov.in/stakeholder-consultation (now closed — the sessions it served ran in June 2025). Civil society was a named, separately-slotted category, so engagement was formally possible. Physical attendance required accreditation/registration. Side events were the more open route.
  format_rules: No signature threshold. Accreditation and invitation controlled participation in the main programme.
  realistic: "Civil society engagement was real but curated. The stakeholder consultation genuinely had a civil-society slot, which is better than the Paris or Bletchley precedent. However, the window was in June 2025 — eight months before the event — so anyone who discovered the Summit in 2026 had already missed the substantive input point. The realistic lesson for future summits: the consultation opens roughly 6-9 months before, on the summit's own domain, not on the ministry's. Watch impact.indiaai.gov.in, not meity.gov.in."
  language_note: English.
  note: Summit dates, venue and the existence of a civil-society consultation track VERIFIED from impact.indiaai.gov.in. The consultation sessions are dated June 2025 on that page; the page does not state whether the form remains open, and it appears to be historical.
  seat_notes:
    chair: Minister responsible (MeitY); hosted by Prime Minister Narendra Modi
  routes:
    membership:
      label: Live membership list
    public-route:
      label: Public submission route
    summit-site-events:
      label: Summit site — events, Global South Showcase, research symposium
      scope: Side events, showcases and symposium tracks were open to applications in the run-up
      note: The 2026 cycle is closed; civil society participated mainly through side events and the research symposium rather than the main plenary.
    un-odet-side-events:
      label: UN ODET side-events page for the summit
      scope: UN-hosted side events
    homepage:
      label: Homepage
  remit: Successor to the Paris AI Action Summit (Feb 2025), held in New Delhi 19–20 February 2026 — the first global AI summit hosted in the Global South. Structured around three Sutras (People, Planet, Progress) and seven Chakras (Human Capital, Social Empowerment, Safe AI, Resilience & Innovation, Science, Democratising AI Resources, Economic Growth). Adopted the New Delhi Declaration plus investment commitments; the government reported very large public attendance (~600,000 across associated events). The International AI Safety Report 2026 was published ahead of it.
  threat_model: Development-and-diffusion first. 'Safe AI' is one of seven chakras — a demotion relative to Bletchley (2023), continuing the trajectory set at Paris. Emphasis on access, inclusion and economic impact over catastrophic risk.
  reality_check: "The summit itself is now past. Civil society access in this series has been consistently side-event access, not negotiating-room access, and the safety agenda has thinned at each iteration. UNVERIFIED: no confirmed host or date for the next summit in the series was found at the time of checking — watch for an announcement."
  gov_channel: Head-of-state level; declarations are politically binding signals, not law.
