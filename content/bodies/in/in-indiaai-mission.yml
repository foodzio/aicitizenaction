strings:
  name: IndiaAI Mission (IndiaAI Independent Business Division)
  ai_jurisdiction: Executing agency for India's national AI programme (approx. INR 10,372 crore). Seven pillars including Compute Capacity, Foundation Models, Datasets (AIKosh), Application Development, Future Skills, Startup Financing, and Safe & Trusted AI. Runs the compute tenders, GPU allocation, model-development grants, and the Safe & Trusted AI research portfolio.
  business: "Structured as an Independent Business Division (IBD) of Digital India Corporation, a Section 8 company under MeitY — not a statutory body, which matters: its decisions are corporate/administrative, not subject to parliamentary rule-making scrutiny. As of July 2026, 13 projects approved under the Safe & Trusted AI pillar addressing deepfakes and bias. Nationwide AI skilling programme (target 1 million youth) launched January 2026."
  public_route: "No formal comment mechanism. Practical routes: (a) respond to its Expressions of Interest and calls for proposals published at indiaai.gov.in — these are open to academia, startups and non-profits and are the only route with a defined process; (b) general contact form/email on indiaai.gov.in; (c) reach it indirectly through a MeitY consultation."
  format_rules: Calls for proposals impose eligibility thresholds — typically Indian-registered legal entity, sometimes minimum turnover or institutional affiliation. Individuals generally cannot apply.
  realistic: Not usable as a policy-influence route by an ordinary person. This is a delivery body, not a deliberative one. It consults industry and academia through invited roundtables. An individual's realistic option is to apply to a funding call if eligible, or to raise IndiaAI issues through the MeitY consultation route or the Standing Committee instead.
  language_note: English.
  note: CEO appointment VERIFIED via ANI, 5 June 2026. The DIC/IBD corporate structure is VERIFIED from MeitY recruitment advertisements issued under 'India AI Division, Digital India Corporation'. I did not find a published board or governing-council membership list — treat the internal governance above the CEO/COO level as UNVERIFIED.
  seat_notes:
    chair: "Chief Executive Officer, IndiaAI Mission (IAS 1998, Maharashtra cadre; concurrently CEO, UIDAI). Chief Operating Officer: Sudeep Shrivastava, Joint Secretary, MeitY."
