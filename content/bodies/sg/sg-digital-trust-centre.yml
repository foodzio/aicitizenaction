strings:
  name: Digital Trust Centre (DTC), Nanyang Technological University
  remit: Singapore's national R&D centre for trust technologies, hosted at NTU and funded by IMDA and the National Research Foundation. Designated in May 2024 as the technical execution arm of the Singapore AI Safety Institute. Conducts AI testing and evaluation research, including multilingual/multicultural and agentic AI testing, and runs innovation grant calls. University research centre — no regulatory power.
  powers_text: research
  reality_check: "As a university centre, DTC is reachable the way academic groups are: named researchers with institutional email, publications, conference presence. That is a real route for technical collaboration and far more tractable than the AISI's own contactless website. It is not a route for policy input or complaints."
  notes: Listed separately from the Singapore AISI because the split-host model means the AISI brand and the actual research staff sit in different institutions.
