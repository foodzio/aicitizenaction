strings:
  name: Infocomm Media Development Authority (IMDA)
  remit: Statutory board and the policy owner for the Singapore AI Safety Institute, responsible for baseline AI policy and international AI-safety engagement. Produced the Model AI Governance Framework for Generative AI (2024), AI Verify (an open-source AI governance testing toolkit) and the AI Verify Foundation. IMDA holds genuine statutory regulatory powers over telecoms, media and data (as PDPA administrator, with fining power), though its AI governance instruments are voluntary frameworks rather than binding AI rules.
  powers_text: fine
  reality_check: "IMDA is the realistic Singapore channel. It has historically run genuinely open public consultations on AI governance (the GenAI framework consultation drew international submissions from major AI labs and foreign industry bodies, and responses were published), everything is in English, and Singapore actively courts international input as part of its convening strategy. This is one of the few entries where 'accepts foreign input: yes' is evidenced rather than assumed."
  notes: AI Verify is open-source and accepts external contributions, which is another genuine foreign-participation route. Singapore's AI safety framing centres on practical assurance and testing rather than catastrophic risk.
