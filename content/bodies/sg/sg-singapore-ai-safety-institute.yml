strings:
  name: Singapore AI Safety Institute (Singapore AISI)
  remit: "Designated May 2024. Split model: IMDA (Infocomm Media Development Authority, a statutory board) is the policy owner and handles international engagement; the Digital Trust Centre (DTC), hosted at Nanyang Technological University, executes the technical work. Focus areas: multilingual and multicultural testing, agentic AI testing, societal-impact studies, international partnerships. Research/standards body — the institute itself has no enforcement power, though IMDA as a statutory board has regulatory powers in adjacent media/telecom domains."
  powers_text: research
  reality_check: Fully English-language and internationally oriented in tone, but I verified by fetching that the AISI's own site publishes no contact route at all. Realistic access is via IMDA's general corporate channels or via NTU DTC researchers. Singapore does run genuine open consultations on AI governance through IMDA (e.g. Model AI Governance Framework for GenAI), and those have historically accepted international industry submissions — but that is IMDA, not the AISI.
  notes: "The Wikipedia framing 'renamed from Digital Trust Centre' is imprecise: DTC still exists as the technical host; the AISI designation was layered on top."
