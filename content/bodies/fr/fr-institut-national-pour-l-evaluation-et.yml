strings:
  name: Institut national pour l'évaluation et la sécurité de l'intelligence artificielle (INESIA)
  remit: "Announced 31 Jan 2025 ahead of the Paris AI Action Summit. NOT a new legal entity — it is a coordination structure federating four existing bodies: ANSSI (cyber agency), Inria (public research), LNE (national metrology/testing laboratory) and PEReN (digital-platform regulation expertise centre). Coordinated under SGDSN (Secretariat-General for Defence and National Security), which also handles French participation in the international network. Its published 2026–2027 roadmap is explicit that it 'is not empowered to regulate' and instead supports the authorities implementing the EU AI Act. Research, evaluation and foresight only."
  powers_text: research
  reality_check: Worst-in-class for public access among network members. INESIA has no website of its own that I could find, no email, no consultation process, and its own roadmap document publishes zero contact information. Access is only via the four constituent bodies (ANSSI, Inria, LNE, PEReN), each of which has separate French-language channels. A foreigner has no route in.
  notes: Strongest explicit catastrophic-risk language of any body in this list. The roadmap commits INESIA to evaluate how high-impact models 'could generate negative real effects on public health, safety, security, fundamental rights or society itself, propagated at scale', naming information manipulation, offensive cyber, CBRN (NRBC) proliferation and autonomous-agent behaviours. France is the only EU member state in the international network.
  routes:
