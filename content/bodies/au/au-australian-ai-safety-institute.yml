strings:
  name: Australian AI Safety Institute (AAISI)
  remit: Announced 2025 and established November 2025 within the Department of Industry, Science and Resources (DISR), alongside the National AI Plan. Technical AI safety science, evaluation capability, international engagement. Australia abandoned its proposed mandatory guardrails legislation in favour of a non-regulatory, existing-regulator approach, so the institute is advisory/research — it cannot compel or fine.
  powers_text: research
  reality_check: Australia historically runs excellent, genuinely open consultations through DISR's consultation hub, and past AI consultations (2023 Safe and Responsible AI, 2024 mandatory guardrails) accepted and published submissions from foreign organisations including US labs. That is the realistic route in. The institute itself is new enough (Nov 2025) that I could not verify a direct contact channel — industry.gov.au blocked automated fetching throughout.
  notes: Australia is a full network member. The retreat from mandatory guardrails to a 'gap-filling' approach in 2025 means frontier-risk work here is research-only.
