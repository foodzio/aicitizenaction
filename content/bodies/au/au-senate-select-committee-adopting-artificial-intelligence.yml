strings:
  name: Senate Select Committee on Adopting Artificial Intelligence (AI) — CEASED
  ai_jurisdiction: Examined the opportunities and impacts of AI adoption in Australia, with particular attention to generative AI.
  business: CONCLUDED. The committee's extended reporting deadline was 26 November 2024 and its own page states that 'the tabling of the final report concludes the work of the select committee.' The Australian Government published a formal response to the report (industry.gov.au). Its archived submissions remain online and are a useful precedent library for anyone drafting a submission to the current Joint Select Committee.
  public_route: No longer accepting submissions. Its archived submissions are public and worth reading before writing to the new Joint Select Committee.
  format_rules: Not applicable — closed.
  note: "VERIFIED 2026-09-22 as CEASED. Answering the brief's question directly: it no longer exists; it reported and was dissolved, and the Joint Select Committee on Artificial Intelligence appointed 20 August 2026 is its functional successor. I could not verify the former chair's name from the official page and am not naming one."
