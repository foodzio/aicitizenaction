strings:
  name: Senate Standing Committees on Environment and Communications (References Committee) — inquiry into Artificial intelligence and data centres
  ai_jurisdiction: "AI infrastructure. Terms of reference referred on 13 May 2026: the effectiveness of existing regulatory frameworks in managing the growth of data centres in Australia, including in relation to existing and future deals between the Government and global AI companies; the potential impacts of AI and data centres on Australian communities, industries and the environment, water and energy; and any other related matters."
  business: Submissions closed 1 September 2026. REPORTING DATE 16 NOVEMBER 2026. Public hearings continuing.
  public_route: Submissions have closed; contact the secretariat about late submissions or appearing at a hearing. Committee Secretary, Senate Standing Committees on Environment and Communications, PO Box 6100, Parliament House, Canberra ACT 2600; phone +61 2 6277 3526; ec.sen@aph.gov.au.
  format_rules: Standard Senate committee rules — lodged online via My Parliament, or by email/post; published only once the committee authorises.
  note: Inquiry details VERIFIED 2026-09-22 by direct fetch of the inquiry page (dates, terms of reference and secretariat contact are quoted from it). The COMMITTEE CHAIR IS UNVERIFIED — the aph.gov.au Senate committee membership pages returned 404/504 to my fetcher and I will not guess a name.
