strings:
  name: House of Commons of Canada — committee brief submission system (the public route)
  ai_jurisdiction: The mechanism, not a body. Every Commons standing, special and legislative committee accepts briefs from the public on any study it is conducting.
  public_route: "Go to the committee's page, find the active study, and send a brief to the clerk by email or the online form. No invitation is needed. This is genuinely underused: most Canadian committee studies receive a small number of briefs, so a well-made one is disproportionately likely to be quoted in the report. You may also ask to appear as a witness — the request is made to the clerk in the same email."
  format_rules: Maximum 10 pages. Longer briefs require a summary of no more than 500 words, and the committee may translate and circulate only that summary. English or French; the clerk arranges translation, and members will not receive the brief until it exists in both languages — so submit well before the study's hearings end. Author identified on the cover, personal contact details in the email only. Briefs become public archives, may be published online, and authors are listed in the committee's report.
  note: VERIFIED 2026-09-22 against the official procedural guide at ourcommons.ca/procedure/guides/brief-e.html.
