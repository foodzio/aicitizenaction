strings:
  name: Canadian Artificial Intelligence Safety Institute (CAISI)
  remit: Announced Nov 2024, sits within Innovation, Science and Economic Development Canada (ISED). Funds and directs AI safety research (investigator-led and government-directed streams, with CIFAR running a research programme and Amii/Mila/Vector involved); advises government on risks from advanced AI systems; produces guidance for developers and the public. Purely research/advisory — Canada has NO in-force AI statute after AIDA (Bill C-27) died on prorogation in January 2025, so CAISI cannot compel or fine anyone.
  powers_text: research
  reality_check: "Genuinely reachable: a published bilingual government mailbox on a federal domain. Canada's federal correspondence norms mean a foreigner writing in English or French will normally get at least an acknowledgement. But with no AI statute in force there is nothing to complain about in a legally operative sense — CAISI is a funder and adviser."
  notes: Its page references advanced-AI risks including systems that 'may be dangerous or hinder human oversight' and synthetic-content harms, but stops well short of explicit catastrophic/existential framing. Acronym clashes with the US Center for AI Standards and Innovation (also CAISI).
  routes:
