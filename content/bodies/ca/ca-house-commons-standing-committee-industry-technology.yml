strings:
  name: House of Commons Standing Committee on Industry and Technology (INDU)
  ai_jurisdiction: The lead Commons committee for AI. Industry, science, technology, telecommunications, competition and innovation policy. It was the committee that studied Bill C-27 (which contained the Artificial Intelligence and Data Act) clause by clause, and it is now running a dedicated AI study.
  business: "Four active studies as at 22 Sep 2026, including 'Opportunities, Risks, and Regulation of AI in Canada's Strategic Industries'. The others: Financial Fraud and Scams in Canada; Federal Government's Electric Vehicle Policies; U.S. Tariffs and the Canadian Metallurgical Sector."
  public_route: "Submit a brief. Canada's brief system is the most open of the five jurisdictions here: 'Any individual or organization may submit a brief to a committee of the House of Commons, even if they are not given the opportunity to appear.' You do not need an invitation and you do not need to be Canadian. Send it to the committee clerk by email or through the online form; contact details are on the committee page."
  format_rules: "EXACT RULES: a brief should not exceed 10 pages. If longer, you must include a summary of no more than 500 words, which the committee may translate and distribute INSTEAD of the full document — so the 500-word summary is the part that actually gets read. May be submitted in either official language; the clerk coordinates translation, so submit early. Identify the author/organisation clearly on the cover; put your personal contact details in the covering email, NOT on the cover page. Support claims with concise factual information; put specific, summarised recommendations at the end; cite all quoted material in footnotes or a bibliography; visuals in black and white and preferably bilingual. Briefs become part of the committee's public archives, may be posted on the committee website, and submitters are listed in committee reports."
  key_people: "Vice-Chairs: Raquel Dancho (Conservative, Kildonan—St. Paul) and Gabriel Ste-Marie (Bloc Québécois, Joliette—Manawan). Members: Parm Bains, Karim Bardeesy, Doly Begum, Adam Chambers (CPC), Harb Gill (CPC), Jason Groleau (CPC), Leslyn Lewis (CPC), Michael Ma, Bienvenu-Olivier Ntumba, Dominique O'Rourke."
  note: VERIFIED 2026-09-22 from the INDU committee page and the official 'Guide for submitting briefs to House of Commons Committees' at ourcommons.ca/procedure/guides/brief-e.html.
