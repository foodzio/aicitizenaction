strings:
  name: House of Commons Standing Committee on Access to Information, Privacy and Ethics (ETHI)
  ai_jurisdiction: Privacy, data protection and ethics oversight — the committee that handles algorithmic and automated decision-making from a rights and privacy angle, facial recognition, and government use of AI tools. The natural home for AI-and-privacy work now that AIDA is dead and the privacy half of Bill C-27 has been reintroduced separately.
  business: Statutory Review of the Lobbying Act; a study on the connection between the Minister of Finance and National Revenue and Alto; Main Estimates 2026-27. No AI-titled study was active as at this check.
  public_route: Same brief system as INDU — any individual or organisation may submit, unsolicited, at any time.
  format_rules: Max 10 pages, or a 500-word summary if longer; either official language; published on the committee website and listed in reports.
  key_people: "Vice-Chairs: Linda Lapointe (Liberal, Rivière-des-Mille-Îles) and Luc Thériault (Bloc Québécois, Montcalm)."
  note: VERIFIED 2026-09-22 from the ETHI committee page. Note the chair is an opposition (Conservative) MP — ETHI is one of the committees chaired by the Official Opposition under Canadian practice.
