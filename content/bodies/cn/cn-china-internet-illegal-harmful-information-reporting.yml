strings:
  name: China Internet Illegal and Harmful Information Reporting Centre (12377)
  remit: CAC's public reporting channel for illegal and harmful online information. Under the Labelling Measures for AI-Generated Synthetic Content and the Generative AI Interim Measures, unlabelled or non-compliant AI-generated content falls within its scope. Reports feed CAC enforcement, which can compel takedown and service suspension.
  powers_text: investigate
  reality_check: "Honest assessment: this is a domestic content-policing channel, not an AI safety channel. It is Chinese-language only, is oriented to reporting content the state considers illegal or harmful, and typically expects real-name or Chinese-phone-number registration. A foreigner raising a frontier-safety concern here would be using the wrong instrument entirely, and I could not even verify the site's current form. Include it in a directory only with a clear caveat."
  notes: I was unable to fetch this site during research — flagged as requiring manual verification.
  routes:
    12377-reporting-centre:
      label: 12377 reporting centre
      scope: content complaints about services operating in China
      note: UNVERIFIED — fetch was blocked (permission/provenance failure). This is the well-known official CAC reporting centre but I did NOT confirm its current scope, form fields, or whether AI-generated content is an explicit reporting category. Re-verify before publishing.
