strings:
  name: Beijing Institute of AI Safety and Governance (Beijing-AISI)
  remit: Research institute founded in the Beijing AI ecosystem, associated with Yi Zeng (Institute of Automation, Chinese Academy of Sciences), who is also a member of the UN High-Level Advisory Body on AI and a leading Chinese voice on AI risk. Works on AI safety evaluation and benchmarking (it hosts a 'foresight safety bench'), governance research, and international engagement. Research body with no regulatory power. A separate Beijing Key Laboratory of AI Safety and Super Alignment also exists at Beijing Normal University — do not conflate them.
  powers_text: research
  reality_check: "Academically open in the normal way — its people publish, attend international venues, and are contactable as individual researchers. Institutionally it publishes no contact channel I could verify. The realistic route for a foreigner is academic: cite or engage with their published work, or contact Yi Zeng directly through his CAS affiliation. Not a channel for public complaints."
  notes: The '.institute' vanity domain and the shared redirect from the CnAISDA network domain suggest a deliberate outward-facing internationalisation effort by this group.
