strings:
  name: National Information Security Standardization Technical Committee (TC260)
  remit: The standards body that writes China's operative AI safety rules in technical form. Secretariat at the China Electronics Standardization Institute (中国电子技术标准化研究院), under CAC/SAMR guidance. Produced the AI Safety Governance Framework (1.0 Sept 2024, 2.0 Sept 2025), the Ethical Security Guidelines for AI Applications (TC260-005), Practice Guides on labelling AI-generated synthetic content, and in 2026 a draft Practice Guide on general principles for AI application security (TC260-PG-2026NA, 征求意见稿 v1.0, Jan 2026) and a draft development-security guide for agent systems (智能体系统开发安全指南, Sept 2026). Its recommended national standards (GB/T) become de facto mandatory through CAC filing requirements.
  powers_text: advise
  reality_check: "This is the most honest answer to 'can outsiders reach China on AI safety': yes, narrowly, through TC260 draft-standard comment windows — and no, not usefully. The windows are real (typically 30–60 days), the notices name a feedback mailbox, and TC260 has in the past received and visibly incorporated industry comments. But the site is exclusively Chinese with no English page at all (verified), the comment list is JS-rendered and hard to monitor, the feedback template asks for work unit and Chinese contact details, and the entire orientation is toward domestic industry and research institutes. There is no evidence of foreign individual submissions being processed. Anyone building a directory should list TC260 as 'real but effectively domestic-only', and should not promise a working email address — the email changes per notice."
  notes: TC260, not CAC, is where China's AI safety substance is actually drafted. The Framework 2.0 is the single most useful document for understanding China's official risk taxonomy, including its treatment of loss-of-control risk.
  routes:
    draft-standards-open-public:
      label: Draft standards open for public comment (标准征求意见)
      scope: draft national standards
      note: VERIFIED — this comment-listing URL is published on the TC260 homepage, which I fetched. The list page itself is JavaScript-rendered so I could not read individual notices; each notice carries its own feedback email, contact person and deadline.
    standards-implementation-feedback-portal:
      label: Standards implementation feedback portal
      scope: feedback on standards already in force
      note: UNVERIFIED — surfaced in search as '网络安全国家标准实施应用信息反馈'; not fetched.
    secretariat-telephone-fax:
