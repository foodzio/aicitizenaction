strings:
  name: Concordia AI
  remit: "NOT a government body. A social enterprise 'dedicated to advancing global AI safety and governance', with offices in Beijing and Singapore. It is the de facto bridge organisation between the Chinese and international AI safety communities: it publishes the 'State of AI Safety in China' report series and the AI Safety in China newsletter, co-authored the Frontier AI Risk Management Framework with Shanghai AI Lab, and runs the Chinese Perspectives on AI Safety translation project. Included here because for most outsiders it is the only functioning entry point to Chinese AI safety governance."
  powers_text: research
  threat_model: Frontier AI risks including loss of control, CBRN and cyber misuse, framed through international coordination — with the specific thesis that US-China mutual understanding is a precondition for any effective global regime.
  reality_check: "The single most reliable route for a non-Chinese-speaker trying to understand or engage with Chinese AI governance. English-language, responsive, explicitly international in mission. The caveat is the obvious one: it is a private organisation with no authority, cannot transmit complaints to Chinese regulators, and its access depends on remaining uncontroversial with Chinese authorities. Use it for understanding, not for redress."
  notes: Category is marked 'government' only because the output schema requires that field; this organisation is explicitly non-governmental.
