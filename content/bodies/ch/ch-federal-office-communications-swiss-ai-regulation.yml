strings:
  name: Federal Office of Communications (OFCOM / BAKOM) — Swiss AI regulation lead
  remit: "Switzerland has NO AI safety institute and no comprehensive AI act. In February 2025 the Federal Council chose a sectoral, minimally-invasive approach: ratify the Council of Europe Framework Convention on AI (signed by Switzerland) and make only targeted sectoral legal amendments, with non-binding measures elsewhere. BAKOM/OFCOM leads the legislative drafting, with the Federal Chancellery (Bundeskanzlei) handling federal-administration AI use. Consultation drafts were expected through 2026. Advisory/legislative-preparation, not a regulator of AI."
  powers_text: advise
  reality_check: "Switzerland's Vernehmlassung (consultation) procedure is genuinely open: anyone, including foreign organisations, may submit, and all submissions are published in full. That is a real and unusual channel. But there was no verified live AI consultation at the time of checking, and Switzerland is NOT a network member and has no AI safety institute. Swiss federal sites are in German, French and Italian with partial English."
  notes: Switzerland signed the Council of Europe Framework Convention on AI. Ratification was in progress. No frontier-risk-specific institutional stance identified.
