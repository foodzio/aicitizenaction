strings:
  name: AI Act Advisory Forum
  remit: "CONSTITUTED. Established under Article 67 of the AI Act; 174 members selected from over 700 applications, representing civil society, academia, industry, SMEs and start-ups, serving two-year renewable terms; members were named in 2026. Five bodies hold permanent seats: the EU Agency for Fundamental Rights (FRA), ENISA, CEN, CENELEC and ETSI. It provides technical expertise and balanced stakeholder input to the Commission and the AI Board, works through plenary meetings and thematic subgroups, and prepares opinions and recommendations on request. Purely advisory."
  powers_text: advise
  reality_check: "The Advisory Forum is the AI Act's designated civil-society channel, and it is a MEMBERSHIP channel, not an open one — 174 seats, no public submission route, no contact address. If your organisation is not a member, the practical approach is to work through one that is: the membership list is public on the expert-groups register, and forum members in the civil-society bloc actively solicit input for subgroup positions. Watch for the next call for applications, which is the only moment the door opens. Its remit is the whole AI Act, weighted toward fundamental rights and implementation practicality rather than frontier risk — the Scientific Panel is the severe-risk body."
  notes: 174 seats from 700+ applicants means roughly a one-in-four success rate for applicants — better odds than most assume.
  routes:
