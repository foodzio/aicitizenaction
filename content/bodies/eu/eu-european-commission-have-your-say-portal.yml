strings:
  name: European Commission 'Have your say' portal
  remit: The Commission's single public feedback and consultation platform under the Better Regulation framework. Every Commission initiative — call for evidence, draft delegated or implementing act, public consultation, evaluation — is published here with a feedback window, and all feedback received is published alongside. The Commission must publish a synopsis report summarising and responding to feedback. This is the formal EU equivalent of the US regulations.gov docket.
  powers_text: advise
  reality_check: "THE MAIN FORMAL EU LEVER, and the AI Act's implementing machinery runs through it — codes of practice, guidelines on GPAI, risk-classification guidance and delegated acts all pass through a feedback window here. Feedback is published, attributed and answered in a synopsis report, which makes it far more consequential than a letter. The caveats practitioners repeat: windows are short (often four weeks) and poorly publicised, the Commission weights structured, evidence-bearing responses from identifiable organisations much more heavily than individual comments, and a response that does not engage the specific questions asked is summarised away in one line. Set up an alert on the portal for the AI Act rather than checking periodically — most people miss the window entirely."
  notes: Complements rather than replaces the AI Office's own targeted multi-stakeholder consultations, which have been the more substantive route for the GPAI Code of Practice.
  routes:
    have-your-say-give:
      label: Have your say — give feedback on EU initiatives
      scope: Open to anyone worldwide, though respondents are asked to identify themselves and their category (citizen, company, NGO, public authority). Feedback is published publicly with the respondent's name unless anonymity is requested.
      note: VERIFIED as live and as the Commission's own canonical URL. The landing page is a language gateway; individual initiative pages carry the actual feedback forms and deadlines. No AI-specific item was visible from the landing page.
    legacy-better-regulation-url:
      label: Legacy Better Regulation URL (redirects)
      scope: Older link still in wide circulation.
      note: VERIFIED as resolving to the Have your say portal.
    homepage:
      label: Homepage
    membership:
      label: Live membership list
    public-route:
      label: Public submission route
  ai_jurisdiction: The single entry point for public input to every EU legislative initiative before it is proposed, including all AI initiatives. Each initiative passes through a 'call for evidence' stage and often a full public consultation, both open to comment.
  business: AI-related initiatives that have used the portal include 'Artificial intelligence strategy for the cultural and creative sectors' (initiative 18592) and the Apply AI Strategy consultation. Open/closed status changes constantly — the portal's own search is the only reliable source.
  public_route: "Anyone in the world may register an EU Login account and submit feedback on any published initiative. This is the least gatekept formal channel in the entire EU system: no residency, nationality, or organisational requirement."
  format_rules: Feedback is limited to 4,000 characters plus an attachment (normally one document up to 1MB). Calls for evidence typically run 4 weeks; full public consultations 12 weeks. Feedback is PUBLISHED on the initiative's feedback page with your name, your organisation and your country; organisations must supply an EU Transparency Register number. Anonymity can be requested.
  note: PARTIALLY VERIFIED 2026-09-22. The portal URL and the existence of AI initiatives on it are verified from Commission pages. The 4,000-character limit and 4-week/12-week convention are standard Better Regulation practice but I could NOT re-verify them on 22 Sep 2026 because the portal page returned only metadata to my fetcher — treat those two figures as UNVERIFIED and check the portal before relying on them.
