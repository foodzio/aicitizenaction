strings:
  name: European Parliament — Committee on Legal Affairs (JURI)
  ai_jurisdiction: "AI and law: copyright and text-and-data-mining exceptions for model training, liability for AI-caused harm (the AI Liability Directive, which the Commission withdrew), legal personality questions, and the civil-law consequences of generative AI. JURI is the committee that decides whether AI training on copyrighted works is lawful in the EU."
  business: AI and copyright/TDM; follow-up to the withdrawn AI Liability Directive; own-initiative work on generative AI and authorship.
  public_route: Rapporteur/shadow correspondence; JURI secretariat at juri-secretariat@europarl.europa.eu; PETI petition; public hearings.
  format_rules: No formal limits. Not published by Parliament.
  key_people: "Vice-Chairs: Marion Walsmann (EPP, DE); Mario Mantovani (ECR, IT); Lara Wolters (S&D, NL); Emil Radev (EPP, BG)."
