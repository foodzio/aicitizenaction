strings:
  name: European Parliament Committee on Industry, Research and Energy (ITRE)
  remit: Opinion-giving committee on AI files, with lead responsibility for industrial policy, research (Horizon Europe), telecommunications and energy — including the compute and data-centre dimension of AI, the AI Continent Action Plan, AI gigafactories and EuroHPC. On the AI Act it gave an opinion rather than leading. Co-legislative power on files within its own competence.
  powers_text: advise
  reality_check: The least useful of the three committees for AI risk input and the most useful for AI infrastructure and compute policy. Same rapporteur-centric access model. If your concern is compute governance, chip supply or data-centre siting in the EU, ITRE is the committee; if it is model risk, it is not.
  notes: ITRE's AI work is growth- and sovereignty-framed; safety arguments land poorly here unless recast as strategic-autonomy or resilience arguments.
  routes:
    committee-pages-documents:
      label: Committee pages and documents
      scope: Agendas, opinions, draft reports and public hearings.
      note: UNVERIFIED as fetched — the ITRE pages were not individually retrieved; URL follows the confirmed europarl committee scheme used by the verified IMCO page.
    itre-secretariat-email:
      label: ITRE secretariat email
      scope: n/a
      note: UNVERIFIED ABSENCE — by analogy with IMCO and LIBE, whose pages were fetched and publish none. Verify directly.
    homepage:
      label: Homepage
    membership:
      label: Live membership list
    public-route:
      label: Public submission route
  ai_jurisdiction: "AI as industrial and research policy: compute and supercomputing capacity, the AI gigafactories and Cloud/AI infrastructure agenda, Horizon Europe and FP10 research funding for AI, semiconductors, energy demand of data centres, and EU technological sovereignty. ITRE is the opinion-giving or associated committee on most AI files that IMCO or LIBE lead, and lead on the infrastructure side."
  business: Cloud and AI Development Act (2026/0138(COD)) — ITRE is heavily engaged alongside IMCO; AI compute and gigafactory funding; energy consumption of AI data centres.
  public_route: Correspondence with rapporteurs and shadows; ITRE secretariat at itre-secretariat@europarl.europa.eu; public hearings; PETI petition.
  format_rules: No formal limits or portal. Position papers conventionally 2–4 pages. Not published by Parliament.
  key_people: "Vice-Chairs: Tsvetelina Penkova (S&D, BG); Elena Donazzan (ECR, IT); Giorgio Gori (S&D, IT); Yvan Verougstraete (Renew, BE)."
  note: VERIFIED 2026-09-22 from the official ITRE member list PDF at europarl.europa.eu/committees/en/itre/home/members/pdf. (The HTML members page is bot-blocked; the PDF export is the reliable official source.)
  seat_notes:
    chair: Chair
