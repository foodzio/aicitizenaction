strings:
  name: European Parliament Committee on the Internal Market and Consumer Protection (IMCO)
  remit: One of the two lead committees (jointly with LIBE) that steered the AI Act through Parliament, and lead committee on the Digital Omnibus on AI. Remit covers single market rules, product safety, consumer protection and digital markets. Can amend and vote on legislation, hold hearings, commission studies and question the Commission. Legislative power is real — Parliament is a co-legislator — but individual committees cannot investigate or fine.
  powers_text: advise
  reality_check: "European Parliament committees do not run UK-style open written-evidence calls, and they publish no secretariat email — so there is no analogue to a select-committee submission. What actually works is the rapporteur system: each legislative file has a named rapporteur and shadow rapporteurs from each political group, all identifiable from the Legislative Observatory, and their policy advisers actively take meetings and written input during the amendment phase. That window — between the draft report and the committee vote — is the real lever, and it is short. Registering in the EU Transparency Register is a practical prerequisite for meetings. Ask EP is for citizens' questions, not policy influence."
  notes: IMCO and LIBE shared the AI Act file; expect the same joint pattern on major AI files.
  routes:
    committee-homepage:
      label: Committee homepage, meeting documents and public hearings
      scope: Agendas, minutes, draft reports and amendment tables are published; public hearings are streamed and occasionally invite written contributions.
      note: VERIFIED — page fetched; it confirms AI regulation is among IMCO's active files but publishes NO committee email or secretariat address.
    imco-secretariat-email:
      label: IMCO secretariat email
      scope: n/a
      note: VERIFIED ABSENCE — the IMCO pages carry no secretariat contact. A contacts sub-page exists but is blocked to automated retrieval (robots.txt), so its contents could not be confirmed. Do NOT assume the commonly cited imco-secretariat@europarl.europa.eu pattern is correct without reading it off the page yourself.
    ask-ep-parliament-s:
      label: Ask EP — Parliament's citizens' enquiry service
      scope: The general public route into Parliament; the Citizens' Enquiries Unit answers questions and routes issues.
      note: UNVERIFIED as fetched — europarl.europa.eu/at-your-service pages are blocked by robots.txt. This form URL appeared in Parliament's own search results.
    legislative-observatory-track-file:
      label: Legislative Observatory (OEIL) — track a file and its amendments
      scope: Follow the Digital Omnibus on AI and AI Act files, rapporteurs and shadow rapporteurs.
      note: UNVERIFIED as fetched. The Legislative Train for the Digital Omnibus on AI is at https://www.europarl.europa.eu/legislative-train/package-digital-package/file-digital-omnibus-on-ai (seen in search results).
    homepage:
      label: Homepage
    membership:
      label: Live membership list
    public-route:
      label: Public submission route
  ai_jurisdiction: "Co-lead committee on the AI Act and its successors. IMCO owns the AI Act as a product-safety and internal-market instrument: placing AI systems on the market, conformity assessment, high-risk classification, obligations on providers and deployers, and consumer protection. It was joint-lead with LIBE on the Digital Omnibus on AI and is lead on the Cloud and AI Development Act."
  business: Cloud and AI Development Act, 2026/0138(COD), Commission proposal 3 June 2026, IMCO rapporteur appointed September 2026. Digital Omnibus on AI, 2025/0359(COD), concluded — plenary approved the trilogue deal on 16 June 2026 by 423/57/174. Ongoing scrutiny of AI Act implementation via the joint Working Group.
  public_route: "Three real routes: (1) email the rapporteur and every shadow rapporteur on the file directly — MEP addresses are public and they read constituent-independent mail; (2) file a petition through PETI, which is the only formal citizen channel into Parliament; (3) attend or watch committee meetings, which are webstreamed, and submit through a registered organisation's position paper. Committee secretariats also accept papers at imco-secretariat@europarl.europa.eu."
  format_rules: No formal word limit or portal for citizen input to a committee. Position papers to rapporteurs are conventionally 2–4 pages with concrete amendment text. Anyone paid to influence should be on the EU Transparency Register; MEPs are required to publish meetings with registered interest representatives. Nothing sent to an MEP is automatically published.
  key_people: "Vice-Chairs: Christian Doleschal (EPP, DE); Nikola Minchev (Renew, BG); Maria Grapini (S&D, RO); Kamila Gasiuk-Pihowicz (EPP, PL). The seats that actually matter on AI are not the Vice-Chairs but the file-holders: Brando Benifei (S&D, IT) — AI Act co-rapporteur in the previous term and IMCO co-chair of the AI Act Working Group; Arba Kokalari (EPP, SE) — IMCO rapporteur on the Digital Omnibus on AI; Reinier van Lanschot (Greens/EFA, NL) — IMCO rapporteur on the Cloud and AI Development Act; Alex Agius Saliba (S&D, MT)."
  note: VERIFIED 2026-09-22 from the official IMCO member list PDF at europarl.europa.eu/committees/en/imco/home/members/pdf.
  seat_notes:
    chair: Chair
