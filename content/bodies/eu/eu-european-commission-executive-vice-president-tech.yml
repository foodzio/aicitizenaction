strings:
  name: European Commission — Executive Vice-President for Tech Sovereignty, Security and Democracy
  ai_jurisdiction: "The Commissioner-level holder of the digital and AI portfolio: owns the AI Act's implementation through DG CNECT and the AI Office, the Digital Omnibus simplification agenda, the Cloud and AI Development Act, the Apply AI strategy, and AI gigafactory/compute policy. The Commission has the exclusive right of legislative initiative, so this is where AI files begin."
  business: AI Act implementation following the Digital Omnibus on AI (adopted 16 June 2026, delaying high-risk system standards and banning 'nudifier' applications); Cloud and AI Development Act proposed 3 June 2026.
  public_route: Respond to open consultations on the 'Have your say' portal; write to the Cabinet; or use the AI Act Service Desk for regulatory questions. Commission consultations are open to anyone worldwide, not only EU residents.
  format_rules: Consultation responses are normally published on the initiative's feedback page together with the respondent's name and country, and organisations must give their EU Transparency Register number. You can ask for anonymity. Feedback periods for a 'call for evidence' are typically 4 weeks; full public consultations run 12 weeks.
  key_people: Operational work sits with DG CNECT and the European AI Office within it.
  note: VERIFIED 2026-09-22 from the European Commission's College of Commissioners page.
