strings:
  name: European Artificial Intelligence Board
  remit: Advisory and co-ordination body created by the AI Act, operational since the Act took effect on 1 August 2024. Composed of one representative per Member State, chaired by a Member State, with the EDPS and EEA-EFTA states as observers; the AI Office is its secretariat. Ensures consistent application of the AI Act, co-ordinates national competent authorities, issues opinions and recommendations, and endorses key documents — it endorsed the adequacy assessments of the GPAI Code of Practice and of the Transparency of AI-Generated Content code, and guidance on harmonised standards for high-risk systems. It advises; it does not itself fine or investigate.
  powers_text: advise
  reality_check: "NO PUBLIC INPUT ROUTE. The AI Board is a Member-State intergovernmental body; the public cannot address it. The only realistic influence is indirect — through your own national competent authority, which sits on the Board, or through the AI Office as secretariat. The expert-groups register is nonetheless valuable: minutes reveal what the Board is about to endorse, months before it appears as guidance, which is exactly when a national authority can still be lobbied."
  notes: Distinct from both the Scientific Panel (independent experts) and the Advisory Forum (stakeholders). All three are separate AI Act bodies.
  routes:
