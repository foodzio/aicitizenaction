      label: Register of Commission Expert Groups — AI Board entry (agendas, participants, minutes)
      scope: Public transparency record only. Agendas, membership and minutes are published here.
      note: VERIFIED — published on https://digital-strategy.ec.europa.eu/en/policies/ai-board.
    direct-public-contact:
