strings:
  name: European Parliament Committee on Civil Liberties, Justice and Home Affairs (LIBE)
  remit: Joint lead committee with IMCO on the AI Act. Described by its chair as 'the leading body of the European Parliament for shaping and overseeing EU legislation and policies that ensure EU citizens enjoy an area of freedom, security, and justice'. Responsibilities include rule of law, fundamental rights, anti-discrimination, data protection and privacy, asylum and migration, organised crime and citizen security. On AI it drove the prohibited-practices list, biometric surveillance restrictions and fundamental-rights impact assessments. Legislative co-decision power; no investigative or enforcement power over private parties.
  powers_text: advise
  reality_check: "Same structural reality as IMCO: no public evidence call, no published secretariat address, influence via named rapporteurs and shadow rapporteurs during the amendment window. LIBE is however the most receptive committee to civil-society and academic input on AI, and its members' offices routinely cite NGO analyses in amendments — several AI Act prohibitions trace directly to civil-society drafting. The practical sequence is: identify the shadow rapporteur from the political group closest to your position, contact their adviser, supply drafted amendment text rather than a position paper. LIBE's frame is fundamental rights and surveillance, not catastrophic risk."
  notes: LIBE is also the committee for GDPR and law-enforcement AI, so biometric and predictive-policing concerns belong here rather than IMCO.
  routes:
    committee-pages:
      label: Committee pages, documents and public hearings
      scope: Agendas, draft reports, amendments and hearing streams.
      note: VERIFIED — page fetched. It references a 'Contacts' section but publishes NO email or postal address in the retrievable content.
    libe-secretariat-email:
      label: LIBE secretariat email
      scope: n/a
      note: VERIFIED ABSENCE in the retrievable content. Do not guess the address.
    committee-petitions-parliament-s:
      label: Committee on Petitions (PETI) — the Parliament's actual public channel
      scope: See the separate PETI entry; this is the route with a right of access, not LIBE.
      note: VERIFIED.
    homepage:
      label: Homepage
    membership:
      label: Live membership list
    public-route:
      label: Public submission route
  ai_jurisdiction: "Co-lead committee on the AI Act. LIBE owns the fundamental-rights half: prohibited practices (Article 5), biometric identification, emotion recognition, predictive policing, AI in migration and law enforcement, and the interaction with GDPR. Joint-lead with IMCO on the Digital Omnibus on AI and co-owner of the AI Act Working Group."
  business: AI Act implementation and enforcement scrutiny through the joint IMCO-LIBE Working Group; follow-through on the Digital Omnibus on AI (2025/0359(COD)) adopted 16 June 2026, which delayed high-risk standards and added a ban on non-consensual intimate ('nudifier') image generation.
  public_route: Direct correspondence with the rapporteur/shadows on a file; PETI petition; LIBE secretariat at libe-secretariat@europarl.europa.eu. LIBE also holds public hearings where civil-society organisations are routinely invited.
  format_rules: No formal limits. Civil-society submissions to LIBE are conventionally short position papers with specific article-by-article amendment language. Not published by the Parliament unless the committee chooses to.
  key_people: "Vice-Chairs: Marina Kaljurand (S&D, EE); Charlie Weimers (ECR, SE); Alessandro Zan (S&D, IT); Estrella Galán (The Left, ES). The decisive AI seat is Michael McNamara (Renew, Ireland) — LIBE co-chair of the AI Act Working Group AND LIBE rapporteur on the Digital Omnibus on AI."
  note: VERIFIED 2026-09-22 from the official LIBE member list PDF at europarl.europa.eu/committees/en/libe/home/members/pdf.
  seat_notes:
    chair: Chair
