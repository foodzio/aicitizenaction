strings:
  name: Artificial Intelligence Office, UAE / Office of the Minister of State for Artificial Intelligence, Digital Economy and Remote Work Applications
  remit: The world's first dedicated AI ministerial portfolio (Omar Sultan Al Olama, appointed 2017). Sets national AI strategy (UAE National Strategy for AI 2031), runs capability programmes and the AI Charter, and coordinates government AI adoption. Promotional and coordinating rather than regulatory — the UAE has no comprehensive AI statute, and AI-adjacent enforcement sits with sectoral regulators and the data-protection framework. A separate Abu Dhabi AI and Advanced Technology Council (AIATC) handles Abu Dhabi-level investment and strategy; do not conflate the two.
  powers_text: advise
  reality_check: The UAE presents an internationally-facing, English-language front and actively courts foreign AI talent and investment, so it is more approachable in tone than most. But there is no consultation process, no complaint route, and no frontier-risk mandate — the posture is adoption and investment. I could not fetch the site to confirm any contact address; anything published about UAE contact details should be manually re-verified.
  notes: No stated position on frontier or catastrophic risk. The UAE signed the Bletchley Declaration but is not a member of the international network.
