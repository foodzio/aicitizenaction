strings:
  name: Agencia Española de Supervisión de la Inteligencia Artificial (AESIA)
  remit: Created by Royal Decree 729/2023, headquartered in A Coruña — the first dedicated national AI supervisory agency in the EU. Designated as Spain's market-surveillance authority for most of the EU AI Act, attached to the Ministry for Digital Transformation and the Civil Service. Under the AI Act it can investigate, demand documentation and access to models, order withdrawal of non-compliant systems, and impose administrative fines. Spain's draft national AI law (anteproyecto, 2025) would set the domestic penalty schedule.
  powers_text: fine
  reality_check: "Among the best of any body here for an outsider: a published general mailbox on a .gob.es domain plus a real English-language site. And EU AI Act Article 85 gives any person — explicitly not limited to EU residents — the right to complain to a market-surveillance authority. The catch is that a formal complaint (as opposed to an informal email) typically goes through the sede electrónica, which requires Spanish electronic identity credentials. Informal email is the realistic foreign route."
  notes: Spain is NOT a member of the international network. AESIA's public materials emphasise ethical/safe use and AI Act compliance; I found no explicit frontier or catastrophic-risk positioning on the pages fetched.
  routes:
    aesia-general-inquiries:
      label: AESIA general inquiries
      scope: general
      note: VERIFIED — published on the AESIA site and fetched.
    aesia-human-resources:
      label: AESIA human resources
      scope: recruitment only
      note: VERIFIED fetched. Included for completeness; not a policy channel.
    aesia-website:
      label: AESIA website (multilingual)
      scope: general
      note: VERIFIED fetched — genuinely available in English plus all Spanish co-official languages. Unusually accessible.
    sede-electronica:
      label: Sede electrónica (e-government portal for formal filings)
      scope: formal administrative filings
      note: UNVERIFIED — a sede electrónica almost certainly exists but no URL was published on the pages I fetched. Formal Spanish administrative filings normally require Cl@ve or a digital certificate, which foreigners generally cannot obtain.
    homepage:
      label: Homepage
