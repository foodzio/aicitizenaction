strings:
  name: Ministry of Information, Communications and the Digital Economy (MICDE) — State Department for ICT and the Digital Economy
  remit: Owns the Kenya AI Strategy 2025–2030 and the draft Kenya Artificial Intelligence and Other Emerging Technologies Policy (July 2026). Kenya is the only African member of the international network, though as of Sept 2026 I found NO evidence that a Kenyan AI Safety Institute has actually been stood up — Kenya 'agreed to join' the network with an institute 'in development'. A separate Artificial Intelligence Bill 2026 is before Parliament, which if passed would create statutory powers; until then the ministry is a policy body.
  powers_text: advise
  reality_check: Kenya runs formal 'public participation' — a constitutional requirement under Article 118/201 for legislation and policy, which is genuinely more binding than a discretionary consultation elsewhere. That is a real opportunity. But public participation in Kenya is constitutionally framed around 'the people' and is oriented to Kenyan stakeholders; foreign submissions are not excluded in law but carry no weight. I could not fetch the ministry's site at all (TLS/robots failures), so I cannot confirm the live submission address — flag this as needing manual verification before any directory publishes it.
  notes: English is an official language of Kenya, so no translation barrier. Kenya's network membership is diplomatically significant (sole African seat) but appears institutionally thin.
