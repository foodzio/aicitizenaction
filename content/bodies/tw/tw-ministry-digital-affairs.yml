strings:
  name: Ministry of Digital Affairs (MODA)
  remit: Taiwan's AI Basic Act (人工智慧基本法) is IN FORCE as of 2026 — a framework statute setting principles (sustainability, human autonomy, privacy, security, transparency, fairness, accountability) and directing agencies rather than imposing direct obligations on developers. MODA is the lead implementing agency, tasked with building risk classification frameworks and evaluation tools; the National Science and Technology Council also has a role. The Act is principles-based with sectoral implementation, so MODA's AI powers are coordinating and standard-setting, not punitive; MODA does hold separate regulatory powers over telecoms and digital services.
  powers_text: advise
  reality_check: "Genuinely good on transparency: MODA maintains a full English-language policy site and Taiwan has an unusually strong civic-participation tradition (vTaiwan, join.gov.tw) with a real record of open deliberation on digital policy. That said, the draft-regulation comment platform is Chinese-language, and the published MODA contact email was obfuscated so I cannot supply it. Taiwan's diplomatic status also excludes it from the international network and most multilateral AI processes — a genuine gap."
  notes: Taiwan's AI Basic Act is distinctive for a democratic-governance framing rather than a risk-tier framing. No explicit frontier/catastrophic-risk mandate identified.
