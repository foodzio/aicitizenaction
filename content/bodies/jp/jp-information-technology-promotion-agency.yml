strings:
  name: Information-technology Promotion Agency, Japan (IPA) — Japan AISI secretariat
  remit: Incorporated administrative agency under METI that hosts the Japan AISI secretariat and operates the AISI working groups (including the business-verification WG). IPA itself handles IT security, standards and skills certification. It has no AI enforcement power; Japan's AI Promotion Act imposes no monetary penalties. Listed separately because IPA, not a ministry, is the entity whose mailbox actually answers for Japan AISI.
  powers_text: research
  reality_check: "Useful mainly as a structural clarification: Japan AISI has no independent legal personality, so correspondence goes to IPA. Japanese government mailboxes generally do respond to Japanese-language correspondence and are less reliable in English."
  notes: Established 14 February 2024 by Cabinet decision.
  routes:
    japan-aisi-mailbox-hosted:
      label: Japan AISI mailbox hosted at IPA
      scope: AI safety institute matters
      note: VERIFIED — the @ipa.go.jp domain confirms IPA hosts the secretariat.
