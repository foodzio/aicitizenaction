strings:
  name: Ministry of Communications and Digital Affairs (Komdigi)
  remit: STATUS IN FLUX AS OF SEPT 2026. Indonesia has no AI act. Komdigi (renamed from Kominfo in late 2024) issued a non-binding AI Ethics Circular (Circular Letter 9/2023) and as of 2026 had submitted two draft Presidential Regulations (Rancangan Peraturan Presiden / Perpres) on AI to the President, with the Deputy Minister publicly explaining that AI would be regulated by Perpres first as a foundation for later primary AI legislation. Komdigi does hold hard powers over electronic system operators under MR 5/2020 — registration requirements, content takedown orders, and the ability to block platforms — which it has used aggressively.
  powers_text: compel
  reality_check: Poor for outsiders. Indonesian AI rulemaking is happening through Presidential Regulations drafted inside the executive, a process with limited public consultation and none in English. Komdigi's real power over foreign platforms (blocking, registration) means foreign companies do engage — but through local counsel and registration compliance, not through any open channel. Bahasa Indonesia only.
  notes: Two draft Perpres on AI were pending as of 2026; I could not confirm whether either had been signed. Treat Indonesian AI regulation as unsettled.
