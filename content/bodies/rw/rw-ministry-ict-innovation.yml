strings:
  name: Ministry of ICT and Innovation (MINICT)
  remit: Owns Rwanda's National AI Policy, approved by Cabinet in April 2023 — one of the first in Africa, developed with The Future Society and GIZ. Policy/strategy body coordinating AI adoption, skills, data infrastructure and an AI ethics framework; implementation runs through the Rwanda Information Society Authority and the National Cyber Security Authority. Rwanda has hosted the Global AI Summit on Africa and is active in continental AI diplomacy. No AI-specific enforcement powers; data protection sits under Rwanda's 2021 DPP law with the NCSA.
  powers_text: advise
  reality_check: "Rwanda is English-language and unusually outward-facing — its AI policy was co-developed with international NGOs, which is direct evidence that foreign input is not merely tolerated but solicited at the institutional level. But that is partnership-based access, not a public channel: I verified no email, no comment process, no complaint route. The policy is developmental, with no frontier-risk content."
  notes: Not a network member. Rwanda's significance is as a convening hub for African AI governance rather than as a regulator.
