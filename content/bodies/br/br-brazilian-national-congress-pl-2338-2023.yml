strings:
  name: Brazilian National Congress — PL 2338/2023 (Marco Legal da Inteligência Artificial)
  remit: "STATUS AS OF SEPT 2026: NOT YET LAW. Approved by the Federal Senate in December 2024, then sent to the Chamber of Deputies where a Comissão Especial sobre Inteligência Artificial was constituted. The final vote slipped repeatedly — pushed to December 2025, then to 2026, amid political deadlock and sustained criticism of the text. The Senate-approved version is risk-tiered on an EU-AI-Act model, prohibits certain uses, creates obligations for 'high-risk' and general-purpose systems, and contemplates fines reaching BRL 50 million per infraction. Until enacted it confers no powers on anyone."
  powers_text: advise
  reality_check: Do not describe Brazil as having an AI law. It has a Senate-passed bill stuck in the Chamber with repeatedly missed deadlines. The legislative dockets are public and Brazilian committees do hear external witnesses, but this is a Portuguese-language domestic legislative process; foreign input arrives through industry associations, not individuals.
  notes: The bill's treatment of systemic risk from general-purpose models is the closest Latin America comes to frontier-risk regulation.
