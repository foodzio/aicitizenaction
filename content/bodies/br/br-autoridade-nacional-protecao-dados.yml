strings:
  name: Autoridade Nacional de Proteção de Dados (ANPD)
  remit: Brazil's data protection authority, an autonomous federal agency. Already regulates AI indirectly through LGPD Article 20 (right to review of automated decisions) and has issued preventive measures against AI training on personal data (notably the 2024 order suspending Meta's use of Brazilian personal data for AI training — real, exercised power). Under PL 2338/2023 as approved by the Senate in December 2024, ANPD would coordinate the proposed Sistema Nacional de Regulação e Governança de IA (SIA). Can investigate, issue preventive suspension orders, and fine (LGPD fines up to 2% of Brazilian turnover, capped at BRL 50 million per infraction).
  powers_text: fine
  reality_check: Mixed. ANPD genuinely runs open consultations and genuinely enforces. But the consultation infrastructure moved during 2025–26 (Participa+Brasil shut down, replaced by Brasil Participativo), so verify any URL before use. Formal complaint filing requires a gov.br account tied to a CPF (Brazilian taxpayer number), which effectively excludes non-residents. Everything is in Portuguese. Informal email to ANPD's ouvidoria is the realistic foreign route, but I could not verify that address.
  notes: Brazil is not a network member and has no AI safety institute.
  routes:
    anpd-consultation-ai-data:
      label: ANPD consultation on AI and data protection (Participa+Brasil archive)
      scope: closed consultation
      note: "VERIFIED fetched — and the result is important: this consultation is CLOSED ('Envio de opiniões não permitido') and the entire Participa+Brasil platform has been SHUT DOWN ('o Participa +Brasil foi ENCERRADO!'). Any directory still citing Participa+Brasil is broken."
    migration-contact-replacement-platform:
      label: Migration contact for the replacement platform (Brasil Participativo)
      scope: platform enquiries
      note: VERIFIED — published on the Participa+Brasil shutdown notice that I fetched. This is a platform-administration mailbox, not an ANPD policy channel.
    anpd-official-site:
      label: ANPD official site (complaints / peticionamento)
      scope: data protection complaints
      note: UNVERIFIED URL. ANPD complaints normally run through the federal Fala.BR / peticionamento eletrônico system, which typically requires a gov.br account — obtainable in practice only with a CPF.
    homepage:
      label: Homepage
