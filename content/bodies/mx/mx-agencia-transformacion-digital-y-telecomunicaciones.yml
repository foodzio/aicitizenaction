strings:
  name: Agencia de Transformación Digital y Telecomunicaciones (ATDT)
  remit: "STATUS AS OF SEPT 2026: NO GENERAL AI LAW. The ATDT, created under the Sheinbaum administration, is the federal digital-transformation and telecommunications agency and the likely institutional home for AI coordination. Multiple general AI bills (iniciativas de Ley General de IA) were in legislative process without passage; regulation has instead advanced sector by sector. Mexico's prior AI-relevant oversight body, INAI, was abolished in 2025 as part of the autonomous-bodies reform, with its functions absorbed into the executive — a significant reduction in independent oversight capacity."
  powers_text: advise
  reality_check: Weak and unsettled. Mexico has no AI law, no AI safety body, and recently dismantled the independent transparency/data authority that would have been the natural AI-oversight anchor. I could not fetch the agency site. Spanish only. Any directory entry should be explicitly provisional.
  notes: The abolition of INAI in 2025 is the key structural fact and should be noted rather than listing INAI as a live AI contact — a mistake in several existing directories.
