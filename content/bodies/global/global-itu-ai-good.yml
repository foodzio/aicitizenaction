strings:
  name: ITU — AI for Good
  remit: ITU's year-round AI platform, co-convened with Switzerland and 50+ UN agencies, organised around Solutions & Knowledge, Skills & Capacity, and Standards & Policy. Hosts the annual Global Summit in Geneva (which co-located with the inaugural Global Dialogue in July 2026), the Innovation Factory startup pitch programme, and the 'Neural Network' community platform (60k+ members).
  threat_model: Overwhelmingly opportunity-framed — SDG applications, capacity building, standards. Safety appears as trustworthiness/standards, not as catastrophic risk. It is the least risk-focused body in the multilateral set.
  reality_check: Genuinely open to join, genuinely low influence per unit of effort. Good for visibility and contacts; poor for escalating a safety concern.
  gov_channel: Moderate — ITU is a treaty body and runs AI standardisation study groups, but AI for Good itself is a convening platform, not a decision venue. Formal ITU standards work still requires member-state or sector-member status.
  routes:
    neural-network-community:
      label: Neural Network community (free to join)
      scope: Anyone
      note: Lowest-barrier entry point into the UN AI ecosystem.
    innovation-factory-startup-pitch:
      label: Innovation Factory startup pitch portal
      scope: Startups with AI-for-SDG solutions
    engage-partnership-enquiries:
