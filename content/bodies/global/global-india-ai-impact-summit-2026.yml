strings:
  name: India AI Impact Summit 2026 (AI summit series)
  remit: Successor to the Paris AI Action Summit (Feb 2025), held in New Delhi 19–20 February 2026 — the first global AI summit hosted in the Global South. Structured around three Sutras (People, Planet, Progress) and seven Chakras (Human Capital, Social Empowerment, Safe AI, Resilience & Innovation, Science, Democratising AI Resources, Economic Growth). Adopted the New Delhi Declaration plus investment commitments; the government reported very large public attendance (~600,000 across associated events). The International AI Safety Report 2026 was published ahead of it.
  threat_model: Development-and-diffusion first. 'Safe AI' is one of seven chakras — a demotion relative to Bletchley (2023), continuing the trajectory set at Paris. Emphasis on access, inclusion and economic impact over catastrophic risk.
  reality_check: "The summit itself is now past. Civil society access in this series has been consistently side-event access, not negotiating-room access, and the safety agenda has thinned at each iteration. UNVERIFIED: no confirmed host or date for the next summit in the series was found at the time of checking — watch for an announcement."
  gov_channel: Head-of-state level; declarations are politically binding signals, not law.
  routes:
    summit-site-events:
      label: Summit site — events, Global South Showcase, research symposium
      scope: Side events, showcases and symposium tracks were open to applications in the run-up
      note: The 2026 cycle is closed; civil society participated mainly through side events and the research symposium rather than the main plenary.
    un-odet-side-events:
      label: UN ODET side-events page for the summit
      scope: UN-hosted side events
    homepage:
      label: Homepage
