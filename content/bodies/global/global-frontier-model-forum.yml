strings:
  name: Frontier Model Forum
  remit: Industry-supported non-profit founded by Amazon, Anthropic, Google, Meta, Microsoft and OpenAI. Publishes technical reports and issue briefs on frontier capability assessments and safety frameworks, with workstreams on AI-Bio, AI-Cyber, AI-Nuclear, AI Security and Safety Frameworks. Runs information-sharing between member labs and with government.
  threat_model: "Severe misuse risk at the frontier — CBRN and offensive cyber uplift — plus security of model weights. Explicitly narrow: it is a misuse-and-security body, not an alignment or near-term-harms body."
  reality_check: Effectively closed. It is a members' club of the largest labs with a single generic inbox. Sending a concern here is close to sending it to the labs' shared comms function. Its technical publications are worth reading; it is not a route in.
  gov_channel: Strong and quiet — the FMF is a recognised industry interlocutor for the US and UK governments and for the AI Safety/Security Institute network.
  routes:
    general-enquiries:
      label: General enquiries
      scope: The only published address
    contact-page:
      label: Contact page
      scope: General
    membership-criteria:
      label: Membership criteria (for frontier developers only)
      scope: Organisations that develop and deploy frontier models and have a safety framework
      note: Individuals cannot join.
    homepage:
      label: Homepage
