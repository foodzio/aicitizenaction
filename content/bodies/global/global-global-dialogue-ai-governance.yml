strings:
  name: Global Dialogue on AI Governance (UN)
  remit: "Intergovernmental-plus-multistakeholder forum established alongside the Scientific Panel by the Aug 2025 UNGA resolution. Inaugural session held Geneva 6–7 July 2026 (alongside the ITU AI for Good Summit); Co-Chairs' Summary covered four clusters: AI opportunities/implications, bridging AI divides, safe and trustworthy systems, human rights. Joint Secretariat is ITU + ODET + UNESCO. Second session: New York, 3–4 May 2027."
  threat_model: "Broad and development-weighted: AI divides and Global South capacity are at least as prominent as safety. Safe/trustworthy AI is one of four clusters, not the organising frame."
  reality_check: "The single most genuinely open multilateral channel in this whole list. Written submissions are accepted from anyone, are published, and were visibly synthesised for the Geneva session. Low cost, low barrier, and it puts a concern on the permanent record. Weak point: dilution — hundreds of submissions, and no guarantee any one is read by a decision-maker."
  gov_channel: Direct — it is the intergovernmental venue itself, reporting into the UNGA.
  routes:
    written-inputs-ai-dialogue:
      label: Written inputs to the AI Dialogue (published submissions archive)
      scope: Any stakeholder — governments, civil society, academia, industry
      note: Submissions are published via an external portal at https://aiwritteninputs.vercel.app/. The 2026 window has closed; expect a fresh call ahead of the May 2027 New York session.
    insights-from-written-submissions:
      label: Insights from written submissions (synthesis of what was submitted)
      scope: Shows submissions were actually read and synthesised
      note: Useful evidence the channel is real, not decorative.
    attendee-registration:
      label: Attendee registration
      scope: Session participation
    speaker-registration:
      label: Speaker registration
      scope: Proposing yourself as a speaker
    digital-cooperation-fund-route:
      label: Digital Cooperation Fund — route to the Joint Secretariat
      scope: Organisational contact and travel-support enquiries
      note: Travel support for Geneva 2026 has closed.
    homepage:
      label: Homepage
