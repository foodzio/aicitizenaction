      label: General OHCHR contact
      scope: General correspondence
      note: No B-Tech-specific inbox is published.
    ohchr-business-human-rights:
      label: OHCHR Business and Human Rights Helpdesk
      scope: Business-and-human-rights queries — the most targeted route
      note: Better-aimed than the generic form for a corporate-conduct concern.
    b-tech-project-hub:
