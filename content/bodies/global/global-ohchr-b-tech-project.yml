strings:
  name: OHCHR B-Tech Project (UN Human Rights Office)
  remit: Launched 2019 to apply the UN Guiding Principles on Business and Human Rights to the tech sector. Its generative AI workstream has produced a foundational paper on responsible development/deployment of generative AI, a Taxonomy of Generative AI Human Rights Harms, and headline recommendations (2025). Engages states, companies, investors and civil society on human-rights due diligence.
  threat_model: "Near-term and structural human-rights harms: discrimination, privacy, freedom of expression, labour, and accountability gaps in corporate AI value chains. Not a loss-of-control body."
  reality_check: Small team, human-rights framing only. If your concern is a documented corporate harm to identifiable people, this is a serious channel. If it is frontier misalignment, it will not land.
  gov_channel: Real but indirect — feeds Human Rights Council sessions, Special Procedures, and the annual UN Forum on Business and Human Rights. Separately, HRC Special Rapporteurs run their own open calls for input, which is often the faster UN human-rights route.
  routes:
