strings:
  name: HUDERIA (Council of Europe risk and impact assessment methodology)
  remit: "Human Rights, Democracy and Rule of Law Impact Assessment for AI systems, developed with the Alan Turing Institute. Two parts: the HUDERIA Methodology, approved by the Committee of Ministers on 26 February 2025, and the HUDERIA Model: COBRA (supporting tools for systematic analysis), approved 25 February 2026. Non-binding guidance that parties may adapt. Supported by HUDERIA Academy tracks including Health and Local Authorities; piloted with businesses in Ukraine."
  threat_model: Human-rights, democratic and rule-of-law harms from deployed AI systems — a structured near-term/structural harms instrument.
  reality_check: A usable tool rather than a channel. The practical value for an outsider is to run a HUDERIA/COBRA assessment on a system you are worried about and submit the result to a regulator — it is a recognised format that European authorities will accept.
  gov_channel: Feeds implementation of the Framework Convention by ratifying states and is being piloted with national authorities.
