strings:
  name: UNESCO — Recommendation on the Ethics of AI / Global AI Ethics and Governance Observatory
  remit: "Adopted Nov 2021, the first global standard-setting instrument on AI ethics: four core values, ten principles, eleven policy action areas. Implementation tools include the Readiness Assessment Methodology (RAM) and Ethical Impact Assessment, a Global Forum on the Ethics of AI, and the Observatory, which maintains a public directory of civil society organisations working on AI ethics. Co-convenor of the UN Global Dialogue Joint Secretariat."
  threat_model: "Near-term harms and human-rights framing: discrimination, gender bias, privacy, environmental sustainability, labour, and the digital divide. Explicitly NOT a loss-of-control or frontier-misuse body — do not route a catastrophic-risk concern here expecting traction."
  reality_check: Bureaucratic and slow, and the bulk of its engagement runs through National Commissions and member-state ministries rather than direct public contact. The Observatory's CSO directory is the one place an outside organisation can actually get itself onto a UN-hosted map at low cost.
  gov_channel: Strong for human-rights and ethics framing; the Recommendation is implemented via national RAM exercises with ministries.
  routes:
    global-ai-ethics-governance:
      label: Global AI Ethics and Governance Observatory — civil society directory (organisations can be listed)
      scope: Organisational listing and resource contribution
      note: The Observatory hosts profiles of CSOs (e.g. AI Safety Asia) with their contact details.
    general-unesco-enquiry:
      label: General UNESCO enquiry
      scope: General correspondence
    periodic-thematic-consultations:
      label: Periodic thematic consultations (e.g. education in the age of AI)
      scope: Time-limited open consultations on specific themes
      note: Consultations open and close; check the page for a live window.
    homepage:
      label: Homepage
