strings:
  name: GPAI (Global Partnership on AI)
  remit: Originally an independent multistakeholder partnership (2020); since July 2024 operates as an 'Integrated Partnership on AI with the OECD, under the GPAI brand'. Retains an Expert Community and Centres of Expertise; Council meetings continue (including in New Delhi). Work covers responsible AI, data governance, future of work, and innovation.
  threat_model: Broad responsible-AI agenda; strong on data governance, labour and Global South inclusion. Not frontier-safety focused.
  reality_check: Its independent multistakeholder character has thinned considerably since the OECD merge. Treat it as an OECD programme for access purposes.
  gov_channel: Ministerial-level; GPAI Council statements are government-endorsed.
  routes:
    gpai-expert-community-membership:
      label: GPAI Expert Community — membership via nomination
      scope: Experts nominated through member governments and partner institutions
      note: Since OECD integration, expert nomination follows the OECD route; no open application was found.
    gpai-at-oecd-overview:
      label: GPAI at OECD — overview and contact route
      scope: General
    homepage:
      label: Homepage
