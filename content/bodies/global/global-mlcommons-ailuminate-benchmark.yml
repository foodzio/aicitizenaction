strings:
  name: MLCommons — AILuminate benchmark (AI Risk & Reliability working group)
  remit: AILuminate is a standardised AI risk assessment benchmark for chat and vision-language models across 12 hazard categories, built with industry, academia and civil society; at last check 59,624 test prompts, 477 test images and 109 models benchmarked, with expanding agentic, multimodal and jailbreak/security suites. Produces public grades per model.
  threat_model: "Product-level hazard and reliability: violent crime facilitation, CSAM, hate, self-harm, privacy, IP, defamation, specialised advice. Near-term deployment harms and misuse — NOT loss of control."
  reality_check: One of the more genuinely participatory technical bodies. If you can demonstrate a hazard category the benchmark misses, the working group is a place where that can actually change an artefact that companies are graded on. Requires technical credibility and sustained attendance.
  gov_channel: Moderate — AILuminate is cited in policy discussion of evaluation standards and MLCommons engages with NIST and the safety-institute network, but it has no formal mandate.
  routes:
    ai-risk-reliability-working:
      label: AI Risk & Reliability working group — open to participants
      scope: Researchers and practitioners; working-group participation is the substantive route
      note: MLCommons working groups run open calls and mailing lists; this is a genuine build-it-with-us channel.
    get-involved:
      label: Get involved
      scope: Anyone
    github-code:
      label: GitHub — code, taxonomy and prompt-set contributions/issues
      scope: Anyone
    mlcommons-discord:
      label: MLCommons Discord
      scope: Anyone
    public-benchmark-results:
      label: Public benchmark results
      scope: Read-only
    homepage:
      label: Homepage
