strings:
  name: International AI Safety Report (Bengio-chaired)
  remit: Mandated by the Bletchley summit; chaired by Yoshua Bengio. 2026 edition published 3 Feb 2026 (arXiv 2602.21012) ahead of the India AI Impact Summit, with an Executive Summary and an Extended Summary for Policymakers. Backed by an Expert Advisory Panel of the 30 Bletchley countries plus the EU, OECD and UN. Synthesises evidence on general-purpose AI capabilities, risks and technical mitigations; it does not make policy recommendations.
  threat_model: "Comprehensive by design: malicious use (cyber, bio, manipulation), malfunctions/reliability, systemic risks (labour, concentration, environment), and loss of control are all treated. Notably more balanced across near-term and catastrophic risk than its critics assume."
  reality_check: Prestigious but not open. There is one inbox and an invitation-only review round. A well-evidenced technical finding emailed to enquiries@ has a plausible path to an author; a general policy opinion does not. The higher-yield route is to get the underlying work cited in the literature the authors survey, since the Report is a synthesis of published evidence.
  gov_channel: Very strong — it is the designated evidence base for the AI summit series and is formally received by ~30 governments plus the EU, OECD and UN.
  routes:
    general-enquiries:
      label: General enquiries
      scope: The only published contact address
      note: Verified by direct fetch of the About page.
    secretariat-coordinated-review-process:
      label: Secretariat-coordinated review process
      scope: Draft review by civil society and industry
      note: The About page states the UK Secretariat 'coordinates a review process that gathers feedback from civil society groups and industry leaders'. There is NO published open call for evidence and no public submission form — participation is by invitation into the review round.
    homepage:
      label: Homepage
