strings:
  name: African Union Commission — Continental Artificial Intelligence Strategy
  remit: The Continental AI Strategy was adopted by African ministers in June 2024 and endorsed by the AU Executive Council in July 2024, alongside the African Digital Compact. It is an Africa-owned, development-first framework covering capacity, infrastructure, datasets, governance and regional cooperation, with an implementation horizon to 2030 and a call for member states to establish national AI strategies and regulatory frameworks. The AU Commission (Department of Infrastructure and Energy / the AU Development Agency AUDA-NEPAD) coordinates; there is no continental AI regulator and no enforcement power. Development was preceded by genuine multistakeholder consultative sessions (2024).
  powers_text: convene
  reality_check: "The AU ran real open multistakeholder consultations during the strategy's development in 2024, and UNESCO supported the process — so there is precedent for external participation. But there is no standing channel, no AI-specific contact address I could verify, and no implementation body with a public interface. The AU's operating reality is member-state diplomacy. For a global directory, the honest entry is: important for context, not contactable on AI matters."
  notes: No frontier or catastrophic-risk content — the strategy is explicitly framed around development, sovereignty, and avoiding extractive AI, and African governments have repeatedly argued that frontier-risk framing crowds out their priorities. That tension is itself a finding worth recording.
