strings:
  title: Colorado's rules for automated decisions and chatbots — public comment
  summary: Colorado's Attorney General is writing the rules that define a "consequential decision" made by an automated system, the safety duties of chatbots, and protections for minors. Anyone can comment until 26 October 2026 (11:59pm Mountain Time, or the last day of the formal hearing if it is extended). Comments are published in a public repository.
  how: Submit through the Attorney General's online form. The office states that comments must go through the form; no email address is given.
