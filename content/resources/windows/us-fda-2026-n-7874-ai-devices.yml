strings:
  title: How the FDA should evaluate AI in medical devices — public docket FDA-2026-N-7874
  summary: The US Food and Drug Administration is asking how it should assess AI-enabled medical devices, including a risk framework, premarket evaluation, monitoring after approval, and foundation models and AI agents. It explicitly invites comments from the public as well as manufacturers and clinicians. Comments are due 19 October 2026 and are published on the docket.
  how: Comment on the docket at regulations.gov. The FDA's general phone line and question form are for questions about regulatory status and will not carry a policy argument.
