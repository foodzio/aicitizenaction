strings:
  title: The proposed US AI whistleblower law is not a reporting channel
  summary: S.1792 was introduced legislation in the cited research, not enacted protection or a place to submit information.
  body: |
    The AI Whistleblower Protection Act, S.1792, was introduced in May 2025. An unenacted bill does not create a reporting destination or guarantee legal protection.

    Before disclosing sensitive workplace information, use an existing support or escrow service whose eligibility and confidentiality terms you have checked. Do not rely on a proposed law as though it were already in force.
