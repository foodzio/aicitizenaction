strings:
  title: A tracker is not always a reporting destination
  summary: The MIT AI Incident Tracker classifies incidents obtained from the AI Incident Database; submit to the underlying database rather than the tracker.
  body: |
    The MIT AI Incident Tracker is a research and classification interface. It does not directly accept reports from the public. Its records flow from the AI Incident Database and are then classified by risk domain, cause, harm type, severity and other attributes.

    If you want an incident considered for this ecosystem, submit it to the AI Incident Database through that database’s actual reporting route.
