strings:
  title: Writing an AI flaw report that can be acted on
  summary: Research on an open model bounty found that useful reports connect an observed output to a concrete deployment context and harm pathway.
  body: |
    “To Err is AI” studied reports produced during an open-ended 2024 bounty against the OLMo language model. It is evidence about reporting practice, not a place to submit a new report.

    The practical lesson is to describe more than the prompt and output. State where the system was deployed, what capability or failure you observed, how it could affect someone in that setting, and enough detail for another person to reproduce or evaluate it. Send the result through an actual incident or flaw-reporting channel.
