strings:
  name: Institute for AI International Governance (I-AIIG), Tsinghua University
  remit: Tsinghua's AI governance research institute. Conducts research on AI governance frameworks and international cooperation, hosts the International AI Cooperation and Governance Forum, runs talent programmes (including the AI for SDGs Global Youth competition), publishes annual reports and academic work, and coordinates with UN agencies and foreign governments. Tsinghua also hosts the Center for International Security and Strategy (CISS), which does AI-and-security track-II work, and co-launched a UNU Hub on ethical and responsible AI.
  threat_model: International governance and cooperation framing; increasingly engages frontier risk and AI safety in dialogue with Western counterparts. Chinese AI safety discourse has moved noticeably toward frontier-risk framing, with Chinese scientists (including Andrew Yao and Zhang Ya-Qin) signing international statements.
  reality_check: A published inbox, but approaching a Chinese state-adjacent academic institute cold from abroad rarely works. The realistic route is via Concordia AI, which has existing relationships across Chinese AI safety institutions, or via the international forums Tsinghua co-hosts.
  gov_channel: Strong within China — Tsinghua institutes advise Chinese ministries and participate in official international dialogues.
