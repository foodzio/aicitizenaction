strings:
  name: BEUC (European Consumer Organisation)
  the_ask: The EU AI Act must give consumers real, enforceable rights — accountability, transparency and control over AI — and must not be hollowed out by the digital omnibus deregulation.
  what_they_do: Umbrella body for 44 independent national consumer organisations in 31 countries; lobbies EU institutions, files joint letters (e.g. July 2026 on keeping medical devices in the AI Act's scope) and publicly warned in May 2026 that the adopted AI omnibus 'risks creating dangerous regulatory loopholes and weakening consumer protection'.
  newcomer_action: Join or contact your own national consumer organisation (the BEUC member in your country) — that is the only individual route; BEUC itself works with institutions, not individuals.
  tips: no — complaints go to national member organisations
  geography: European Union / Europe — 44 member organisations, 31 countries.
  scale: Mid-sized Brussels secretariat representing very large national members.
  spending: Member-funded and EU-grant funded; registered on the EU transparency register.
  caution: BEUC does not take individual cases. Its influence is real but institutional; your leverage is through your national member organisation's campaigns.
