strings:
  name: Americans for Responsible Innovation (ARI)
  the_ask: The US government should take a proactive approach to AI governance that protects the public, including preserving states' ability to regulate AI rather than pre-empting them.
  what_they_do: Policy research, reports and briefs; federal advocacy; and since September 2026 a nationwide push for state-level AI guardrails. Cofounded by former Rep. Brad Carson, who also leads the Public First super PAC network.
  newcomer_action: Join the email list for policy updates, read Policy Bytes, and donate via Support Us; contact staff if you can help on a state campaign.
  tips: unclear
  geography: United States — federal and, since 2026, state legislatures.
  scale: Established think-tank/advocacy hybrid with professional staff; headcount not published on its site.
  spending: Not disclosed on its own site. Reported by Forbes as funded by effective-altruism-linked donors and safety-focused investors, and connected to the pro-regulation super PAC effort — treat that attribution as UNVERIFIED against ARI's own pages.
  caution: No explicit volunteer or membership programme on its site — the realistic newcomer routes are the mailing list and money. Its leadership overlap with the Public First super PACs means supporting ARI is adjacent to electoral politics, which some people will not want.
