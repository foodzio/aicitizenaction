strings:
  name: Institute for AI Policy and Strategy (IAPS)
  remit: Nonpartisan think tank producing policy research at the intersection of AI, national security and geopolitics. Focus areas include cyber autonomy and offence-defence balance, timely response mechanisms for AI security and public-safety risks, compute access and governance, and US-China strategic competition. Runs an AI Policy Fellowship.
  threat_model: "National-security-framed catastrophic risk: AI-enabled cyber and CBRN threats, compute proliferation, and strategic instability. Not a near-term-harms or civil-rights organisation."
  reality_check: Small and focused; the fellowship is the reliable route in. A form-only general contact suggests limited appetite for unsolicited correspondence.
  gov_channel: Strong — DC-based, oriented to congressional and executive-branch audiences, with staff who move between IAPS and government.
