      label: General enquiries
      scope: Anyone
    careers:
      label: Careers
      scope: Researchers
    launch-announcement:
      label: Launch announcement (explains the Timaeus/Sequent lineage)
      scope: Reference
    legacy-timaeus-site:
      label: Legacy Timaeus site (redirects/announces the rebrand), Discord and GitHub
      scope: Legacy community
      note: timaeus.co now carries the banner 'Timaeus is now Resolution'. The old Timaeus Discord and github.com/timaeus-research remain the community entry points for SLT work.
    homepage:
      label: Homepage
