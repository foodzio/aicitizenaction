strings:
  name: Resolution (formerly Timaeus; launched as Sequent)
  remit: Non-profit alignment research organisation formed by merging researchers from Timaeus (which pioneered applying singular learning theory to alignment and developmental interpretability) with the UK AI Security Institute's Alignment Team. Launched under the name Sequent, then rebranded to Resolution. Portfolio spans scalable oversight, learning theory (SLT, deep learning theory), mechanistic understanding and heuristic arguments, agent foundations, and model personas — with heavy investment in automating alignment research. Targeting 40–80 FTE researchers within two years.
  threat_model: Misalignment and loss of control, approached through theory. The explicit bet is that theory unlocks automation of alignment research before capabilities outrun it.
  reality_check: "Brand-new and actively hiring, which makes it unusually open to technical newcomers right now. IMPORTANT for routing: do not address correspondence to 'Timaeus' — that name is retired. The SLT research community around it has historically been very welcoming to outside contributors via Discord and open seminars."
  gov_channel: Indirect via the UK AISI alumni network; no formal advisory seat.
  routes:
