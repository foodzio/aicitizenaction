strings:
  name: Electronic Frontier Foundation (EFF)
  remit: Civil liberties organisation using litigation, pressure campaigns, technical analysis and advocacy. On AI it focuses on who uses AI and how — opposing government surveillance expansion, algorithmic policing, corporate data practices, and moves that would entrench incumbent platforms; also defends fair use and the right to build and study models.
  threat_model: "Civil liberties and power: state surveillance, corporate data extraction, algorithmic discrimination, and market concentration. Explicitly rejects the 'AI is magic' framing and treats AI as a general-purpose tool. Not an alignment or catastrophic-risk organisation, and often in direct opposition to restriction-oriented AI safety policy."
  reality_check: Large, well-staffed, and genuinely does read legal intake — but very selective, and its AI positions frequently cut against the AI-safety community's. Route surveillance, speech or researcher-protection concerns here; do not route frontier-risk concerns.
  gov_channel: Strong — files amicus briefs, testifies, and litigates against federal and state agencies; comments in FTC, FCC and Copyright Office proceedings.
  routes:
    legal-assistance-request-eff:
      label: Legal assistance request — EFF takes on impact cases
      scope: People facing a digital-rights legal problem; EFF also maintains a referral list of cooperating attorneys
      note: A real intake with real outcomes if your matter fits its docket.
    general-contact:
      label: General contact
      scope: Anyone
    action-centre-campaigns-comment:
      label: Action centre — campaigns and comment drives
      scope: Anyone
    press-contact:
      label: Press contact
      scope: Media
    security-vulnerability-matters:
      label: Security/vulnerability matters
      scope: Researchers
      note: EFF has a long record of defending security researchers facing legal threats.
    homepage:
      label: Homepage
    action:
      label: Action page
  the_ask: Regulate how AI is used — surveillance, algorithmic decisions, age-gating, encryption and competition — rather than restricting the technology itself; keep AI tools available and competitive.
  what_they_do: "Litigation, legislative advocacy and technical analysis across eight AI topics: algorithmic decision-making, AI and fair use, AI and surveillance, deepfakes/NCII, age-gating, privacy, encryption and competition. Runs an action centre with alerts to Congress and state legislatures."
  newcomer_action: Take a live action at act.eff.org, and if you have a legal problem involving AI or surveillance, submit it through the legal assistance page.
  tips: yes — legal assistance intake at eff.org/pages/legal-assistance; EFF reviews referrals but takes few cases
  geography: United States primarily, with international policy work.
  scale: "Large: decades-old, with staff lawyers, technologists and activists."
  spending: Member-funded nonprofit; accepts donations and has a membership scheme.
  caution: EFF is explicitly sceptical of broad AI regulation and of some safety-motivated proposals, and defends fair use for AI training. If your ask is 'slow AI down', EFF is not your ally on that point even though it is a genuine civil liberties organisation. It cannot take most cases referred to it.
