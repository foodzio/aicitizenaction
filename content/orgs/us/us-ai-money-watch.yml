strings:
  name: AI Money Watch (a project of Demand Progress)
  the_ask: Make AI industry political spending visible, so voters can see who is paying for which candidate.
  what_they_do: A public tracker of AI-related political spending built from FEC independent expenditure filings, updated daily, browsable by candidate, race and funder, with a published methodology.
  newcomer_action: Look up your own district before you vote or donate, and send the funder page to your local journalist or representative.
  tips: unclear
  geography: United States.
  scale: A project of Demand Progress, a long-running grassroots democracy organisation; the tracker itself is small.
  spending: Demand Progress accepts donations via ActBlue.
  caution: Demand Progress's own homepage does not list AI as a focus area — AI Money Watch is a discrete project, so do not assume donating to Demand Progress funds AI work. The tracker's figures ($75.5M raised by Leading the Future, ~$70M cash on hand as of January 2026) come from FEC filings and will differ from press reports of total pledged commitments.
