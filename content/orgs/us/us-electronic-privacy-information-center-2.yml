strings:
  name: Electronic Privacy Information Center (EPIC)
  the_ask: AI systems used on people — in policing, hiring, housing, healthcare, insurance and government — must be transparent, tested and accountable, and discriminatory screening and scoring tools should not be used.
  what_they_do: Legal and policy advocacy across seven AI areas including AI in law enforcement, chatbot harms, commercial AI use, government AI use, risk assessments and screening/scoring. Files comments, complaints and amicus briefs; maintains a public digital library of AI documents.
  newcomer_action: Search its digital library for the agency or company you are dealing with, then contact Calli Schroeder (Senior Counsel, AI & Human Rights Director) via the contact page if you have a concrete case.
  tips: unclear — no published tip line; contact page is the only route
  geography: United States, federal and state.
  scale: Mid-sized, lawyer-heavy nonprofit.
  spending: Donation-funded.
  caution: No public intake form for complaints — do not assume a tip will be acted on. Its focus is harm to identifiable people from deployed systems, not frontier or catastrophic risk.
