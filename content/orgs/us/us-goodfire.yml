strings:
  name: Goodfire
  remit: For-profit interpretability research lab. Reverse-engineers causal mechanisms in neural networks; commercial product Silico for model understanding, debugging and training-time steering. Publishes interpretability research alongside the commercial offering.
  threat_model: Interpretability as the enabling technology for oversight; the implicit model is that undiagnosable systems cannot be safely deployed. Commercially oriented toward debugging and control rather than catastrophic-risk mitigation.
  reality_check: A company, not an advocacy body — note the domain moved from goodfire.ai to goodfire.com. No published email. The research-access programme and Discord are real routes for technical outsiders; there is no channel for raising a concern.
  gov_channel: None formal.
