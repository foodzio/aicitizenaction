strings:
  name: FAR.AI
  remit: "Runs three distinct arms: in-house research on a portfolio of agendas (robustness, deception detection, red-teaming, safeguard vulnerabilities); a field-building events programme (Alignment Workshops, the Seoul and Cambridge workshops, verification workshops, technical-governance convenings); and FAR.Labs, a Berkeley co-working space for AI safety researchers, plus a grantmaking programme for academics and independent researchers."
  threat_model: Broad frontier-risk portfolio — reward hacking, deception, jailbreaking through layered defences, and misuse. Deliberately agenda-agnostic; its comparative advantage is convening rather than a single thesis.
  reality_check: "Genuinely a connector organisation and a good place for a technically credible outsider to get into the room via workshops or FAR.Labs. Weakness for routing purposes: no published email, only a form."
  gov_channel: Indirect but useful — its workshops convene government, lab and academic participants, including around the safety-summit circuit.
