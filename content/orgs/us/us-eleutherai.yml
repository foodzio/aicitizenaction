strings:
  name: EleutherAI
  remit: Grassroots-origin open research lab. Trains and releases open-source LLMs (GPT-NeoX, Pythia), maintains the LM Evaluation Harness used across the field, and researches interpretability (interpreting across training time), eliciting latent knowledge, alignment, and non-text modalities. Runs almost entirely in public on Discord.
  threat_model: "Mixed and openness-centric: the core thesis is that open models and public interpretability tooling are necessary for anyone outside the large labs to audit AI. Touches alignment (ELK, interpretability) but is not an x-risk organisation; it is frequently in tension with the pause/restriction wing."
  reality_check: "The most genuinely open organisation in this entire list. An unaffiliated person with technical skill can join the Discord today and be contributing to alignment-relevant research within weeks. Caveat: it is a research community, not a complaints channel, and its open-release stance means it is not a natural home for a restrict-frontier-models concern."
  gov_channel: Modest — EleutherAI has filed comments in US policy processes (notably on open models) and its researchers are cited on open-weight policy, but it has no advisory seat.
  routes:
    general-enquiries:
      label: General enquiries
      scope: Anyone
    discord-actual-organisation-research:
      label: Discord — the actual organisation; research happens in public channels
      scope: Anyone, no credentials required
      note: By far the most open research community in AI. Newcomers routinely join projects and end up as paper co-authors.
    github:
      label: GitHub
      scope: Anyone
    homepage:
      label: Homepage
