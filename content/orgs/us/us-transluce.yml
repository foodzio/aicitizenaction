strings:
  name: Transluce
  remit: Non-profit research lab building, in its words, 'the public tech stack for scalable oversight of AI'. Outputs include Docent (a platform for understanding model behaviours at scale), public behaviour reports (e.g. evaluating model responses in mental-health crisis scenarios), and research on activation oracles and surfacing behaviours third parties should monitor.
  threat_model: Oversight capability gap — the concern that no one outside the labs has tooling to audit model behaviour. Spans near-term behavioural harms (crisis response, deception in deployment) and scalable-oversight/alignment concerns. Deliberately public-interest rather than x-risk framed.
  reality_check: Small, open-source-first, and explicitly building infrastructure for outsiders to audit models — one of the better-aligned targets if your concern is a specific observed model behaviour you can document. Responsive relative to its size.
  gov_channel: Indirect — its public behaviour reports have driven press coverage and company responses.
  routes:
    general-enquiries:
      label: General enquiries
      scope: Anyone
    behaviour-reports-public-catalogue:
      label: Behaviour reports — public catalogue of surfaced model behaviours
      scope: Public read; UNVERIFIED whether outside submissions are accepted
      note: Worth checking for a submission route — the framing is explicitly about what third parties should monitor.
    docent-platform-open-source:
      label: Docent platform and open-source tooling
      scope: Researchers
    github:
      label: GitHub
      scope: Anyone
    jobs:
      label: Jobs
      scope: Applicants
