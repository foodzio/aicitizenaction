strings:
  name: Center for AI Safety Action Fund (CAIS AF)
  remit: "501(c)(4) advocacy arm of CAIS. Nonpartisan lobbying and policymaker education. Stated policy focus areas: US leadership in AI chip manufacturing, compute security, preventing malicious use of AI, and global cooperation for safe and secure AI. Registered federal lobbyist; active in state legislation."
  threat_model: Catastrophic misuse and national-security risk, plus compute governance. More security-and-competitiveness framed than the research arm.
  reality_check: If you want a catastrophic-risk concern carried into US legislative offices, this is one of about three organisations that can actually do it (with Encode and FLI). Contributions are not tax-deductible, which is the price of the lobbying capability.
  gov_channel: Direct — registered federal lobbying disclosures (OpenSecrets, LegiStorm) and sustained state-legislature engagement. One of the few AI safety organisations that formally lobbies.
