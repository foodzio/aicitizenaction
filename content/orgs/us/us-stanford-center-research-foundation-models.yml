strings:
  name: Stanford Center for Research on Foundation Models (CRFM)
  remit: Interdisciplinary centre spanning 10+ Stanford departments. Coined the term 'foundation models'. Outputs include HELM (Holistic Evaluation of Language Models — a widely used open benchmark suite), the Foundation Model Transparency Index (FMTI, which grades developers on transparency), Ecosystem Graphs, and Levanter. Works across technical foundations, beneficial applications, societal impact (transparency, openness, copyright, privacy, systemic risk) and AI policy.
  threat_model: Systemic risk from homogenisation and opacity — the founding thesis is that a small number of foundation models become single points of failure across society. Transparency-centred. Covers near-term and structural risk; touches systemic risk but not loss of control.
  reality_check: No centre-level inbox at all. Everything runs through named researchers or through open-source contribution to HELM, which is the genuinely open channel.
  gov_channel: Real — CRFM has filed influential comments in US and EU processes (notably on the EU AI Act and on open foundation models) and its transparency work is cited by regulators.
  routes:
    helm-open-benchmark-models:
      label: HELM — open benchmark; models and scenarios can be contributed via GitHub
      scope: Researchers
      note: HELM is open source; contributing an evaluation scenario is a real route to influence how models are publicly measured.
    foundation-model-transparency-index:
      label: Foundation Model Transparency Index — developers respond to it, and the methodology is public
      scope: Researchers and developers
      note: "UNVERIFIED: no public submission form for FMTI input was found."
    people-directory-practical-contact:
      label: People directory — the practical contact route is an individual researcher
      scope: General
      note: No centre-level contact email is published.
    homepage:
      label: Homepage
