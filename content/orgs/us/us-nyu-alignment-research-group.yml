strings:
  name: NYU Alignment Research Group (ARG)
  remit: A set of NYU researchers doing empirical work with language models aimed at longer-term concerns about deploying highly capable AI. Associated with Sam Bowman's group and collaborating across NYU's ML2, CILVR, the Center for Data Science and the Department of Linguistics. Known for work on debate and scalable oversight, chain-of-thought faithfulness, and benchmarks that resist saturation.
  threat_model: Scalable oversight and honesty — how humans supervise models that exceed them, and whether stated model reasoning reflects actual computation. Alignment-focused, empirical rather than theoretical.
  reality_check: Effectively closed as an institution — it is a loose grouping of academics, not an entity with an inbox. Contact individual faculty via their NYU pages. Several ARG-affiliated researchers have since moved to frontier labs, so the group is less central than it was.
  gov_channel: None directly.
