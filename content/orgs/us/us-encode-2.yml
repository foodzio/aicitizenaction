strings:
  name: Encode (formerly Encode Justice; also Encode AI)
  the_ask: Pass enforceable AI laws — transparency, safety frameworks, incident reporting, third-party audits and whistleblower protection for frontier AI companies — while keeping AI's benefits.
  what_they_do: Legislative drafting and advocacy. Claims credit for California SB 53, the New York RAISE Act, Illinois SB 315, the federal TAKE IT DOWN Act, and the first US policy on AI in nuclear weapons launch. Builds coalitions and lobbies directly.
  newcomer_action: Email info@encodeai.org offering your skill (law, policy research, state-level organising), follow @EncodeAction, and donate.
  tips: unclear
  geography: United States, federal and state.
  scale: "Small: at least 11 staff listed on its team page; describes itself as 'a small advocacy team'."
  spending: Not disclosed.
  caution: encodejustice.org now redirects to encodeai.org — the youth-chapter branding of Encode Justice has largely been folded into a professional policy shop. Its current site advertises no chapters, no volunteer programme and no membership, so a newcomer's realistic route is donating or being hired, not joining. Its ask is regulation and transparency, explicitly 'pro-human pro-AI' — not a pause or ban.
