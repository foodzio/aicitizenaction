strings:
  name: INCOMPAS
  the_ask: Clear the way for AI infrastructure — faster siting and permitting for data centres, fibre, subsea cables and power — under 'responsible and innovative AI policy'.
  what_they_do: Trade association rebranded as 'The Competitive Communications and AI Infrastructure Association'; runs an Artificial Intelligence Competition Center and lobbies on infrastructure, siting and energy.
  newcomer_action: Nothing to join unless your company is a member. If you are fighting a local data centre, this is the association arguing the other side at state and federal level.
  tips: no
  geography: United States.
  scale: Mid-sized trade association with a published member list.
  spending: Not published.
  caution: "Its AI interest is infrastructure and competition, not model capability — on frontier safety questions it is mostly absent. The concrete conflict is local: data centre siting, water and electricity."
