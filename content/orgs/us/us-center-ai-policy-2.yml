strings:
  name: Center for AI Policy (CAIP)
  the_ask: US federal government should build the capacity to see and respond to frontier AI risk — monitoring, standards and emergency powers.
  what_they_do: "Largely ceased. Its own homepage states 'CAIP has run out of funding and has ceased most of our active operations.' Two residual services continue: a grassroots Policy Advocacy Network training AI safety leaders, and free expert feedback on pending legislation."
  newcomer_action: Little to join. If you are drafting AI legislation you can still request free review; if you are a funder, it invites contact about reviving the organisation.
  tips: no
  geography: United States, federal.
  scale: Effectively dormant. Last substantive publication dated 22 May 2025.
  spending: Ran out of funding — that is the organisation's own stated reason for closing.
  caution: "FLAG: mostly closed. Do not plan effort around it. Revival contact given on its site is jason@aipolicy.us. This is also a useful data point about the funding asymmetry in this field."
