strings:
  name: Public Citizen
  remit: Consumer advocacy organisation. AI work covers generative AI risks to consumers and democracy, model state AI legislation, campaigns against non-consensual deepfakes and political deepfakes, data-centre environmental and utility-cost impacts, AI companion products aimed at minors, and opposition to federal preemption of state AI laws. Maintains a tracker of state deepfake legislation.
  threat_model: Near-term consumer protection and democratic integrity — deepfakes in elections, corporate accountability, environmental externalities of compute. Populist/consumer framing, not technical risk.
  reality_check: Large, campaign-driven and genuinely populist in orientation — more willing than most DC organisations to take up an ordinary person's complaint if it illustrates a systemic pattern. Scope is consumer and democratic harm only.
  gov_channel: Strong — long-standing congressional and regulatory presence, petitions agencies (FEC on political deepfakes, FTC on AI harms) and drafts state model bills.
  routes:
    contact-page:
      label: Contact page
      scope: Anyone; Public Citizen has historically been receptive to consumer complaints that can seed campaigns
      note: No topic-specific email published on the AI page.
    take-action-petitions-comment:
      label: Take action — petitions and comment drives
      scope: Anyone
    homepage:
      label: Homepage
    action:
      label: Action page
  the_ask: "Treat generative AI as a present danger: block federal deregulation and pre-emption of state AI laws, stop non-consensual AI images, and halt unchecked data centre build-out."
  what_they_do: Consumer advocacy, litigation and petitions. Live campaigns include a petition against congressional AI deregulation, a petition on non-consensual AI images, and a letter urging a Texas data centre moratorium.
  newcomer_action: Sign the petition against congressional AI deregulation (act.citizen.org/page/83712/petition/1) — it takes two minutes — and join the updates list.
  tips: unclear — no dedicated AI whistleblower line found
  geography: United States, federal and state.
  scale: Large, long-established (founded 1971) with lobbying, litigation and research arms.
  spending: Member and donation funded.
  caution: Frames AI harm as consumer, labour and democratic harm happening now — it is generally dismissive of framing centred on future superintelligence. If you arrived via extinction-risk arguments, expect a different vocabulary.
