strings:
  name: Consumer Technology Association (CTA)
  the_ask: A national AI regulatory framework that is technology-neutral and risk-based and builds on existing law, rather than new rules that it says would hinder innovation and small businesses.
  what_they_do: Trade association for consumer technology (organiser of CES); files policy comments on AI and lobbies federally.
  newcomer_action: Nothing to join unless you are a company. Read its AI policy filings to see the industry's formal legal arguments in your own words.
  tips: no
  geography: United States, federal.
  scale: Very large, long-established trade association.
  spending: Not published on the pages checked.
  caution: CTA's own advocacy page does not explicitly state a position on federal pre-emption of state laws, though it has signed broader industry pre-emption coalition letters — treat any claim that CTA demands pre-emption as UNVERIFIED unless you find it in a specific filing.
