strings:
  name: Encode (formerly Encode Justice)
  remit: Youth-founded AI advocacy organisation (Sneha Revanur). Legislative advocacy and coalition-building. Claimed wins include California SB 53, the New York RAISE Act, Illinois SB 315, defeating federal preemption of state AI laws, and securing AI-and-nuclear-command provisions in defence legislation. Self-describes as 'pro-human, pro-AI'.
  threat_model: "Unusually broad and deliberately bridging: bioweapons and loss of human control alongside child safety, companion-chatbot harms and erosion of liberty. One of the very few organisations that credibly spans catastrophic risk and near-term harm rather than picking a side."
  reality_check: Small, young, hungry, and one of the most genuinely responsive organisations on this list — they actively want volunteers and will reply. If you are an individual wanting to convert a concern into legislative action in the US, this is among the best-value doors available.
  gov_channel: Direct and disproportionately effective for its size — active in state legislatures and Congress; Sneha Revanur sits on FLI's AI Safety Index expert panel.
  routes:
    general-enquiries:
      label: General enquiries
      scope: Anyone
    get-involved-form-homepage:
      label: Get involved form on the homepage — explicitly invites people to find out how to participate
      scope: Anyone, especially students and young people
      note: Encode's chapter/volunteer model is its distinguishing feature; UNVERIFIED whether a formal chapter-application page currently exists.
    homepage:
      label: Homepage
    action:
      label: Action page
  the_ask: Pass enforceable AI laws — transparency, safety frameworks, incident reporting, third-party audits and whistleblower protection for frontier AI companies — while keeping AI's benefits.
  what_they_do: Legislative drafting and advocacy. Claims credit for California SB 53, the New York RAISE Act, Illinois SB 315, the federal TAKE IT DOWN Act, and the first US policy on AI in nuclear weapons launch. Builds coalitions and lobbies directly.
  newcomer_action: Email info@encodeai.org offering your skill (law, policy research, state-level organising), follow @EncodeAction, and donate.
  tips: unclear
  geography: United States, federal and state.
  scale: "Small: at least 11 staff listed on its team page; describes itself as 'a small advocacy team'."
  spending: Not disclosed.
  caution: encodejustice.org now redirects to encodeai.org — the youth-chapter branding of Encode Justice has largely been folded into a professional policy shop. Its current site advertises no chapters, no volunteer programme and no membership, so a newcomer's realistic route is donating or being hired, not joining. Its ask is regulation and transparency, explicitly 'pro-human pro-AI' — not a pause or ban.
