strings:
  name: Encode (formerly Encode Justice)
  remit: Youth-founded AI advocacy organisation (Sneha Revanur). Legislative advocacy and coalition-building. Claimed wins include California SB 53, the New York RAISE Act, Illinois SB 315, defeating federal preemption of state AI laws, and securing AI-and-nuclear-command provisions in defence legislation. Self-describes as 'pro-human, pro-AI'.
  threat_model: "Unusually broad and deliberately bridging: bioweapons and loss of human control alongside child safety, companion-chatbot harms and erosion of liberty. One of the very few organisations that credibly spans catastrophic risk and near-term harm rather than picking a side."
  reality_check: Small, young, hungry, and one of the most genuinely responsive organisations on this list — they actively want volunteers and will reply. If you are an individual wanting to convert a concern into legislative action in the US, this is among the best-value doors available.
  gov_channel: Direct and disproportionately effective for its size — active in state legislatures and Congress; Sneha Revanur sits on FLI's AI Safety Index expert panel.
  routes:
