strings:
  name: American Federation of Teachers (AFT)
  the_ask: AI's impact on the workplace should be a mandatory subject of collective bargaining, with contract language preventing worker displacement and a union seat at the table during development, procurement and implementation.
  what_they_do: 2024 AI resolution; the 'Commonsense Guardrails for Using Advanced Technology in Schools' report; professional development and e-learning on AI; supports members bargaining AI clauses; calls for regulation on privacy, bias, misinformation and deepfakes and for respect for intellectual property.
  newcomer_action: If you are an AFT member, propose AI language for your next contract using the resolution and guardrails report as the basis, and raise it with your local's bargaining team this week.
  tips: no
  geography: United States.
  scale: Large national union (about 1.8 million members) covering teachers, higher education and healthcare staff.
  spending: Membership funded.
  caution: AFT's stance is 'responsible and principled development and use' — it is not anti-AI and has partnered with AI companies on teacher training, which some members object to. The bargaining route is the genuinely powerful one; the policy statements are not binding on employers by themselves.
