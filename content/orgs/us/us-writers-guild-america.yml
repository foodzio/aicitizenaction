strings:
  name: Writers Guild of America (WGA West/East)
  the_ask: AI cannot write or rewrite literary material, cannot be credited, and cannot be used to undermine writers' credit or compensation — terms won in the 2023 Minimum Basic Agreement after a 148-day strike.
  what_they_do: Negotiates and enforces the MBA's AI provisions; maintains Know Your Rights guidance on AI; provides legal services to members; runs a violation reporting route.
  newcomer_action: If you are a member and a studio used AI on your material, file through Report a Violation. If you are not, read the AI Know Your Rights page — it is the clearest published example of enforceable AI contract language anyone has won.
  tips: yes — Report a Violation, members only
  geography: United States (film, TV and new media).
  scale: Mid-sized union with outsized leverage in its industry.
  spending: Membership funded.
  caution: Protections apply only to work covered by the MBA — non-union writing, and most AI training on already-published scripts, is not covered. Enforcement depends on writers actually reporting.
