strings:
  name: Center for AI Safety (CAIS)
  remit: "Three pillars: technical and conceptual safety research; field-building (fellowships, the ML Safety course, and free access to its compute cluster for safety researchers); and safety standards/advocacy. Authored the one-sentence 2023 Statement on AI Risk signed by most leading AI scientists and lab CEOs. Paired with a separate 501(c)(4), the CAIS Action Fund."
  threat_model: Societal-scale and catastrophic risk — malicious use, AI race dynamics, organisational risks and rogue AI, per its own taxonomy. Covers both misuse and loss of control; broader than MIRI, narrower than PAI.
  reality_check: Well-resourced and reads its inbox. The compute cluster and the ML safety course are the most tangible things any organisation here offers an unaffiliated technical person. Policy input is better routed to the Action Fund.
  gov_channel: Strong via its Action Fund (see separate entry); CAIS itself was closely involved in California SB 1047 and subsequent state legislation.
