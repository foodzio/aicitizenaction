strings:
  name: Machine Intelligence Research Institute (MIRI)
  remit: "Originally the founding technical alignment research organisation; since 2024 pivoted almost entirely to communications and policy advocacy for an international halt on frontier AI development. Its site states: 'Our survival depends on some form of globally coordinated and collectively enforced moratorium on the development of ASI, as soon as we can, for as long as necessary.' Outputs are now books, essays and briefings rather than alignment papers."
  threat_model: Pure loss-of-control / misalignment extinction risk, and the strongest version of it — MIRI's public position is that technical alignment has failed to keep pace and that a moratorium is the only remaining lever. Zero emphasis on near-term harms.
  reality_check: "Reads its mail but is highly selective about engagement, and is not interested in concerns outside its narrow thesis. If your concern is anything other than existential risk from superintelligence, this is the wrong door. Note: the user's list includes 'Machine Intelligence Research' separately — that is MIRI's own name, not a distinct organisation."
  gov_channel: Moderate and growing — MIRI staff brief policymakers and its arguments circulate widely in Washington and Westminster, but it has no formal advisory seat.
  routes:
    general-enquiries:
      label: General enquiries
      scope: Anyone
    media:
      label: Media
      scope: Press
    donations:
      label: Donations
      scope: Donors
