strings:
  name: Center for Security and Emerging Technology (CSET), Georgetown University
  remit: Data-driven, nonpartisan policy research at the intersection of security and technology, covering AI, advanced computing and biotechnology. Research lines include Applications, Assessment, Bio-Risk, Competition, CyberAI, Data and Workforce. Staff give congressional testimony and consult with policymakers; maintains large datasets (e.g. on Chinese AI research and chip supply chains).
  threat_model: Great-power competition and national security, with sober empiricism about capability claims. Covers AI-enabled cyber and bio-risk; notably sceptical of both hype and doom framings. Not an x-risk organisation and not a civil-rights organisation.
  reality_check: A real published inbox but a large institution with a set research agenda; unsolicited concerns rarely change what it works on. Its public data tools are the highest-value thing an outsider can extract from it.
  gov_channel: Very strong — congressional testimony is routine and CSET alumni staff senior executive-branch AI roles.
