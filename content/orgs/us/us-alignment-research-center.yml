strings:
  name: Alignment Research Center (ARC)
  remit: Small theory-focused non-profit. Current agenda is a theoretical foundation for mechanistic explanations of neural network behaviour — heuristic arguments, low-probability estimation, and algorithms that analyse weights directly rather than by sampling, aimed at predicting out-of-distribution behaviour and detecting anomalies. Its evaluations arm spun out to become METR.
  threat_model: Worst-case intent alignment and deceptive alignment — specifically the problem of catching behaviours that never appear during training or testing. The most theoretical agenda in the field.
  reality_check: Effectively closed and by far the most inward-facing organisation on this list — no email, no contact form, tiny team, deeply technical agenda. The only way in is a serious mathematical contribution to its stated open problems. Do not route a concern here.
  gov_channel: None. ARC does no policy work.
  routes:
    hiring:
      label: Hiring
      scope: Researchers
      note: No contact email is published anywhere on the site.
    blog-theory-write-ups:
      label: Blog / theory write-ups — engagement happens in public research discussion
      scope: Researchers
      note: ARC has historically run prize competitions for progress on its open problems; UNVERIFIED whether one is currently live.
