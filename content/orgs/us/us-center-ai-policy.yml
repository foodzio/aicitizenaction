strings:
  name: Center for AI Policy (CAIP)
  remit: Was a nonpartisan advocacy group working with Congress from June 2023 to May 2025 on catastrophic AI risk — drafting model legislation, endorsing bills, hosting events and connecting policymakers with AI experts.
  threat_model: Catastrophic risk from advanced AI, with an emphasis on giving government visibility, expertise and response authority.
  reality_check: LARGELY SHUT DOWN. Its own site states it 'has run out of funding and has ceased most of our active operations'. Two narrow services persist — the legislative review service and the grassroots advocacy training network — both reachable at the named personal addresses above. Do not treat CAIP as a live advocacy channel; it is now effectively two people offering two specific services.
  gov_channel: Formerly strong congressional engagement; now residual.
  routes:
    jason-green-lowe:
      label: Jason Green-Lowe, Executive Director — legislative review service and revival/funding enquiries
      scope: Confidential expert feedback on pending or draft AI legislation — still offered
      note: One of two functions that survived the shutdown. Genuinely useful if you are drafting or reviewing a bill.
    ivan-grassroots-policy-advocacy:
      label: Ivan — Grassroots Policy Advocacy Network
      scope: Training for young AI safety policy advocates — still operating
    contact-page:
      label: Contact page
      scope: General
      note: Note aipolicy.us now redirects to centeraipolicy.org.
    homepage:
      label: Homepage
    action:
      label: Action page
  the_ask: US federal government should build the capacity to see and respond to frontier AI risk — monitoring, standards and emergency powers.
  what_they_do: "Largely ceased. Its own homepage states 'CAIP has run out of funding and has ceased most of our active operations.' Two residual services continue: a grassroots Policy Advocacy Network training AI safety leaders, and free expert feedback on pending legislation."
  newcomer_action: Little to join. If you are drafting AI legislation you can still request free review; if you are a funder, it invites contact about reviving the organisation.
  tips: no
  geography: United States, federal.
  scale: Effectively dormant. Last substantive publication dated 22 May 2025.
  spending: Ran out of funding — that is the organisation's own stated reason for closing.
  caution: "FLAG: mostly closed. Do not plan effort around it. Revival contact given on its site is jason@aipolicy.us. This is also a useful data point about the funding asymmetry in this field."
