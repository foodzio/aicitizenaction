strings:
  name: Electronic Privacy Information Center (EPIC)
  remit: Public-interest research centre focused on privacy and algorithmic accountability. AI work spans law enforcement AI, chatbot harms, commercial AI in healthcare/education/hiring/housing, government AI use, risk assessments, and screening-and-scoring systems. Files FTC complaints, FOIA litigation, regulatory comments and amicus briefs, and drafts state AI legislation.
  threat_model: Near-term privacy, due-process and discrimination harms from deployed automated systems. Regulatory-complaint oriented. Not a catastrophic-risk organisation.
  reality_check: Genuinely responsive, and a named senior counsel for AI is published — unusual and valuable. If you have documentation of a company's unfair or deceptive AI practice affecting US consumers, EPIC is one of the few organisations that can convert it into a regulatory filing.
  gov_channel: Strong — EPIC's FTC complaints have repeatedly triggered investigations, and it is a regular witness and commenter in federal and state proceedings.
  routes:
    general-enquiries:
      label: General enquiries
      scope: Anyone
    press:
      label: Press
      scope: Media
    calli-schroeder:
      label: Calli Schroeder, Senior Counsel and AI/Human Rights lead
      scope: Direct subject-matter contact — the highest-yield route for an AI concern
      note: Named directly on EPIC's AI issue page.
    contact-page:
      label: "Contact page (phone: 202.483.1140; 1519 New Hampshire Ave NW, Washington DC 20036)"
      scope: General
      note: EPIC has no dedicated public complaint portal; it originates FTC complaints itself from evidence it gathers.
    homepage:
      label: Homepage
