strings:
  name: Stanford Institute for Human-Centered AI (HAI)
  remit: University institute spanning research, policy and education. Publishes the AI Index (the most-cited annual measurement of AI progress, with the Global Vibrancy Tool), policy briefs, and runs policymaker education including Congressional Boot Camps for members and staff. Houses CRFM (see separate entry) and a large fellowship and seed-grant programme.
  threat_model: "Human-centred and broad: augmentation over replacement, healthcare, equity, governance capacity. The AI Index is deliberately descriptive rather than risk-framed. Not an alignment institute."
  reality_check: Large, prestigious, form-only. Unsolicited outside input is very unlikely to get traction; the productive route is to reach an individual faculty affiliate directly through their Stanford page.
  gov_channel: Strong — the Congressional Boot Camp is a rare structured channel into US legislative staff, and HAI scholars testify regularly.
  routes:
    contact-form:
      label: Contact form
      scope: General enquiries
      note: No public email addresses are listed; only a form.
    get-involved:
      label: Get involved
      scope: Affiliates, fellows, partners
    ai-index-accepts-data:
      label: AI Index — accepts data and methodology input between editions
      scope: Researchers with relevant datasets
      note: "UNVERIFIED: a formal open call for AI Index contributions was not confirmed; contact via the form."
