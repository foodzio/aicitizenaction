strings:
  name: AI Now Institute
  the_ask: Challenge the current trajectory of AI by confronting industry concentration and power — antitrust scrutiny, limits on data centre expansion, and worker protection — rather than accepting scale as inevitable.
  what_they_do: Independent research and policy analysis; maps the AI market and the industry's sources of power; publishes data centre policy toolkits and labour research (including AI in nursing); testifies to Congress (Monopoly Busters Caucus, Senate Banking Committee); investigates AI security incidents.
  newcomer_action: Use its data centre policy toolkit if there is a proposed facility near you; cite its market-power research in submissions; apply for a role.
  tips: no public tip line found
  geography: United States, with international influence.
  scale: Small research institute, co-led by Amba Kak and Sarah Myers West; high influence per head.
  spending: Grant-funded.
  caution: A research institute, not a campaign — there is no petition, no membership and no volunteering. Its critique targets AI companies' power and is often explicitly at odds with the existential-risk framing used by groups like MIRI and ControlAI.
