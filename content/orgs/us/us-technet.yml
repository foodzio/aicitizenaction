strings:
  name: TechNet
  the_ask: Congress should pass a narrow, risk-based federal AI framework that pre-empts state AI laws, without private rights of action or mandatory independent audits.
  what_they_do: Trade association lobbying for major AI developers and deployers; state and federal advocacy; runs the AI for America campaign (ai4america.com). Its own policy page states that 'federal preemption of state laws and regulations is needed to prevent a patchwork'.
  newcomer_action: Nothing to join unless you are a company. Read its stated positions before a state hearing — it is usually the most organised voice in the room opposing state AI bills.
  tips: no
  geography: United States — federal and all major state capitals.
  scale: Large, professionally staffed trade association with state directors.
  spending: Not published on its own site.
  caution: "Stated fairly: TechNet is not anti-safety in its own framing — it supports the voluntary NIST AI Risk Management Framework and sector-specific laws. What it actively opposes is state-level binding rules, private lawsuits and mandatory audits. Its member list is at technet.org/our-story/members/."
