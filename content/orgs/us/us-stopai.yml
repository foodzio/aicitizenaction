strings:
  name: StopAI
  remit: "Grassroots direct-action movement. Calls for a permanent global ban on frontier AI development and proposes citizen oversight bodies empowered to regulate or dismantle threatening technologies. Operates on three fronts: public awareness, influencing decision-makers and legislation, and non-violent direct action — including blockades and civil disobedience at AI company offices, with members having been arrested."
  threat_model: Extinction and human-dignity framing, combined — AI and Big Tech as threats to 'human dignity, freedom, democracy, and nature'. The most maximalist position in this list.
  reality_check: Tiny and entirely open — anyone can turn up. Will certainly read your email. Has zero institutional access and association with it may actively reduce your credibility with policy bodies. Route here only if direct action is what you want.
  gov_channel: None. It is explicitly an outside-game actor.
