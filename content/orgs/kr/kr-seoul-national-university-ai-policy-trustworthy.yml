strings:
  name: Seoul National University — AI policy and trustworthy AI centres
  remit: "Two relevant SNU bodies: the Center for Trustworthy AI (CTAI) at ctai.snu.ac.kr, and the SNU AI Policy Initiative (SAPI) at sapi.co.kr, which convenes the annual Seoul AI Policy Conference (SAIPCON, 2026 edition held). Korea is a significant venue — it hosted the 2024 Seoul AI Summit that produced the Frontier AI Safety Commitments, and operates its own AI Safety Institute."
  threat_model: Trustworthy AI and AI policy/regulation, with Korea's own AI Framework Act as a focal point. Governance-framed rather than technical-alignment framed.
  reality_check: Poorly documented in English and I could not verify contact addresses. The conference route is the reliable one. Korea matters because of the Seoul Commitments lineage, but SNU is not a high-yield destination for an outside concern.
  gov_channel: Real in Korea — SAPI convenes government, industry and academia, and Korea's AI Framework Act implementation is an active policy process.
