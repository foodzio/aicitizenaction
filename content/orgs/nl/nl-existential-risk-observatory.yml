  name: Existential Risk Observatory
  the_ask: Raise public awareness of existential risks — above all unaligned AI — because public understanding is the precondition for policy that reduces them.
  what_they_do: Media work, op-eds, public debate and campaign work across AI, engineered pandemics, extreme climate scenarios and nuclear war; research and policy specialists on staff.
