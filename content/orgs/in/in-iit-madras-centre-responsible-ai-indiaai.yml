strings:
  name: IIT Madras Centre for Responsible AI (CeRAI) and the IndiaAI Safe & Trusted AI pillar
  remit: CeRAI is a virtual interdisciplinary research centre within IIT Madras's Wadhwani School of Data Science and AI, doing fundamental and applied responsible-AI research, developing accountability/explainability guidelines, and positioning itself as a national standards-contributing body. Co-hosted the Global Conclave on Safe & Trusted AI with the IndiaAI Mission ahead of the India AI Impact Summit 2026, launching eight initiatives and reports. The IndiaAI Mission's Safe & Trusted AI pillar has approved 13+ projects on deepfakes, bias and related harms.
  threat_model: Near-term and deployment harms in the Indian context — deepfakes, bias, consumer protection, explainability, and AI in public service delivery. Development-and-trust framing, not catastrophic risk.
  reality_check: Small, reachable, and currently well-positioned because India is at the centre of the summit series. Genuinely responsive by academic standards. Scope is India-relevant applied harms; frontier-risk concerns will get less traction.
  gov_channel: Direct — CeRAI works with the IndiaAI Mission under MeitY, and India now hosts the AI summit series, giving Indian institutions unusual current weight.
