strings:
  name: LawZero
  remit: Non-profit founded by Yoshua Bengio in June 2025 to develop safe-by-design AI. Core technical bet is 'Scientist AI' — a non-agentic, uncertainty-quantifying system designed to understand and predict rather than to act, usable as a guardrail that monitors and vetoes unsafe actions by agentic systems.
  threat_model: Loss of control from agentic AI with goals and self-preservation drives. Bengio's explicit thesis is that agency itself is the hazard and that non-agentic systems are the safe substrate.
  reality_check: New and building. Two real published inboxes, which is more than most technical labs offer. Be aware that Bengio is spread across three major roles — reaching LawZero is not the same as reaching him, and volume to him is extremely high.
  gov_channel: Very strong by proxy — Bengio chairs both the International AI Safety Report and co-chairs the UN Scientific Panel. LawZero itself has no formal advisory seat, but its founder is the single most connected individual in global AI safety governance.
