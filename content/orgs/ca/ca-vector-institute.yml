strings:
  name: Vector Institute
  remit: Canada's Toronto-based AI institute — 1,488+ affiliated researchers and faculty, 30+ industry partnerships, 450+ papers. Focus is research excellence and accelerating AI adoption across Canadian industry and health systems, with a stated 'responsible AI leadership' strand and work on trustworthy AI frameworks and evaluation.
  threat_model: "Trustworthy-AI and adoption framing: reliability, privacy, fairness and deployment safety in regulated sectors, especially health. Not a catastrophic-risk institute."
  reality_check: Published inbox, but an adoption-and-industry institute at heart. Its AI safety footprint is much smaller than its size suggests. Low yield for a safety concern.
  gov_channel: Real in Canada — Vector is a federally and provincially funded pillar of the Pan-Canadian AI Strategy and advises on Canadian AI policy.
