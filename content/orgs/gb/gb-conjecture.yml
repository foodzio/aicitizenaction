strings:
  name: Conjecture
  remit: For-profit AI company founded from the alignment community. Public agenda is Cognitive Emulation — building AI systems that follow bounded, auditable, human-like reasoning processes rather than opaque end-to-end learned policies. In practice the public site now emphasises task-specific training, modular AI components and workflow automation products.
  threat_model: Loss of control via unbounded, uninterpretable general systems; the CoEm bet is that architecture-level boundedness is safer than post-hoc alignment. Its leadership has also been prominent in public advocacy against frontier scaling.
  reality_check: Has become markedly more product-focused and less publicly research-transparent than in 2022–23. A commercial entity with a contact form. Low responsiveness to unsolicited outside input.
  gov_channel: Indirect — its co-founder has been an active public voice in UK and EU AI policy debate, but the company holds no formal advisory role.
