strings:
  name: Centre for the Study of Existential Risk (CSER), University of Cambridge
  remit: Interdisciplinary research centre on risks that threaten human extinction or civilisational collapse — AI, biological risk, climate and ecological risk, and systemic/cascading risk. Now part of Cambridge's Institute for Technology and Humanity (ITH) alongside LCFI and the Centre for Human-Inspired AI. Runs education programmes, visitor and affiliate schemes.
  threat_model: Global catastrophic and existential risk across multiple hazard classes; on AI, both loss of control and AI as a risk-amplifier for other hazards. Also strong on the governance of extreme risk generally.
  reality_check: A published, monitored inbox and an explicit invitation to contact centre teams about visiting and affiliation — notably more open than most academic centres. Academic pace; it will not act as a rapid-response channel.
  gov_channel: Real in the UK — CSER researchers have given parliamentary evidence and advised on UK risk registers and international processes.
  routes:
    cser-general-enquiries:
      label: CSER general enquiries
      scope: Anyone
      note: Verified via the ITH contact page, which explicitly invites direct contact with centre teams about education, visitor and affiliate programmes.
    institute-technology-humanity:
      label: Institute for Technology and Humanity (parent institute)
      scope: General
    visitor-affiliate-programmes:
      label: Visitor and affiliate programmes
      scope: Researchers
      note: A real route for external academics to affiliate.
    homepage:
      label: Homepage
