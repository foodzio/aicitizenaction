strings:
  name: Oxford Martin AI Governance Initiative (AIGI)
  remit: "Research initiative within the Oxford Martin School, co-directed by Robert Trager and Maike Osborne. Three research areas: frontier AI governance, international AI governance (including a China AI Governance programme and the Oxford AI Diplomacy Lab), and technical AI governance (including a Hardware AI Governance Lab working on compute verification and on-chip governance mechanisms). Files responses to government consultations."
  threat_model: Frontier risk and international coordination failure — racing dynamics, verification and enforcement problems, and compute governance as the practical lever. Loss-of-control-aware but institutionally rather than technically framed.
  reality_check: Contact runs through a shared Oxford Martin School inbox rather than a dedicated one, which dilutes it. Better to approach a named researcher. Technically credible and genuinely influential on compute governance.
  gov_channel: Strong — files formal responses to US and UK government RFIs (e.g. to the US AI Action Plan RFI), and Trager sits on the FLI AI Safety Index panel and advises international processes.
  routes:
