strings:
  name: ControlAI
  remit: "Campaigning organisation working for a prohibition on the development of superintelligent AI. Three functions: public education (newsletter with 148,000+ readers), grassroots advocacy (tooling that helps tens of thousands contact their elected representatives), and direct policymaker briefing — claims 400+ lawmakers briefed since November 2024, with 160+ cross-party UK MPs and Peers and 35+ Canadian lawmakers having endorsed its statement."
  threat_model: Extinction risk from superintelligence, narrowly. Its stated position is that superintelligence could arrive before 2030 with no known containment method. No engagement with near-term harms.
  reality_check: Small, fast-moving, and it answers its email. Best-in-class if your goal is to get a loss-of-control concern in front of a legislator. It will not engage with bias, privacy or labour concerns.
  gov_channel: Direct and unusually effective for its size — its core product is legislator briefings, and it has secured named cross-party endorsements in three parliaments.
  routes:
    take-action-contact-your:
      label: Take action — contact your representative
      scope: Anyone, especially UK, US, Canada and Germany
      note: The most operationally effective grassroots tool in this space — it has demonstrably produced lawmaker endorsements.
    general-enquiries:
      label: General enquiries, briefing requests and funding enquiries
      scope: Anyone; note the email domain is controlai.com while the website is controlai.org
      note: Verified on controlai.org. They explicitly invite briefing requests — a legislator's office or an individual can ask for one.
    newsletter:
      label: Newsletter
      scope: Anyone
    homepage:
      label: Homepage
