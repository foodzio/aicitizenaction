strings:
  name: PauseAI UK
  the_ask: The UK should act to avert risks from superhuman AI, including binding frontier AI legislation.
  what_they_do: Community-led organising through six local chapters (London, Glasgow, Oxford, Leicester, Manchester, West of England); meetups, book launches, public events; submissions to parliamentary inquiries including the Future of the Workforce inquiry; publishes playbooks for starting new local groups.
  newcomer_action: Fill in the onboarding form, join the WhatsApp community, and turn up to the next event on its Luma calendar — or use the playbook to start a group in your city.
  tips: unclear — hello@pauseai.uk
  geography: United Kingdom, six chapters.
  scale: "Very small: a UK Director (Joseph Miller) and Deputy Director (Matilda da Rui), hiring more, plus volunteers."
  spending: Not disclosed; donations at pauseai.uk/donate.
  caution: A distinct UK operation with its own staff, site, jobs and donation route — not simply a page of PauseAI Global. Chapter activity is uneven; the newer chapters are very new.
