strings:
  name: British Medical Association (BMA)
  the_ask: AI in the NHS must support and not supplant doctors, with clear principles for safe clinical use and protection of NHS patient data.
  what_they_do: Publishes BMA Principles for Artificial Intelligence and its Application in Healthcare; responds to NHS plans (it has publicly opposed AI being used to supplant doctors in the NHS plan) and has warned about risks to NHS data from AI deals; represents doctors in negotiation and in the press.
  newcomer_action: If you are a BMA member, read the AI principles document and raise AI in your local negotiating committee or through a motion to the Annual Representative Meeting.
  tips: no
  geography: United Kingdom.
  scale: Large — the UK doctors' trade union and professional association.
  spending: Membership funded.
  caution: "UNVERIFIED: the principles PDF URL is on the BMA's own domain but was located via search rather than fetched, and the 2026 positions cited (NHS plan, NHS data warnings) come from third-party reporting. Confirm on bma.org.uk before relying on it. Route in is membership."
