strings:
  name: Leverhulme Centre for the Future of Intelligence (LCFI), University of Cambridge
  remit: Highly interdisciplinary centre — philosophy, computer science, law, politics, history, design — examining how AI reshapes human futures. Projects span AI ethics and narratives, kinds of intelligence, AI and gender/race, the political economy of AI, and AI in the arts. Now part of the Institute for Technology and Humanity.
  threat_model: "Conceptual and structural rather than technical: what AI does to human agency, epistemics, culture and power. Humanities-led. Not an alignment centre, and not a near-term-audit centre either — it sits deliberately outside both."
  reality_check: Real inbox, academic pace. Most useful if your concern is conceptual or about AI's cultural and epistemic effects rather than a specific technical or corporate issue.
  gov_channel: Moderate — LCFI researchers contribute to UK policy consultations and international ethics processes.
