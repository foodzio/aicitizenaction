strings:
  name: ControlAI
  the_ask: Governments should pass binding law prohibiting the development of superintelligent AI, and coordinate internationally to enforce that prohibition.
  what_they_do: Lawmaker briefings and a model bill; a mass newsletter (claims 148,000+ subscribers); media work; a constituent-to-legislator contact tool; organised a letter from 70+ cross-party UK MPs and Peers to the Prime Minister asking the government to evaluate its bill.
  newcomer_action: Use the contact tool at act.controlai.org to email or write to your lawmakers asking them to back a ban on superintelligence development; subscribe to the weekly newsletter; ask to join a local action group.
  tips: No public tip line; offers briefings to lawmakers and journalists via hello@controlai.com
  geography: UK, US, Canada, Germany. UK not-for-profit company limited by guarantee; US 501(c)(4).
  scale: Roughly 20+ staff and advisors listed on its About page. Well-resourced relative to most groups here.
  spending: Not disclosed. Homepage states it is 'only accepting substantial donations, except in special cases' — i.e. it is not running a small-donor programme.
  caution: Its own action page says '205+ lawmakers support our campaign'; its homepage breaks that down as 160+ UK and 35+ Canadian lawmakers, plus 400+ lawmakers briefed across four countries. 'Support' means signing a campaign statement, not voting for a bill — no such bill has passed. The ask is a prohibition, not regulation; joining means endorsing a ban. Small donors are effectively not wanted.
  routes:
    action:
      label: Action page
    take-action-contact-your:
      label: Take action — contact your representative
      scope: Anyone, especially UK, US, Canada and Germany
      note: The most operationally effective grassroots tool in this space — it has demonstrably produced lawmaker endorsements.
    general-enquiries:
      label: General enquiries, briefing requests and funding enquiries
      scope: Anyone; note the email domain is controlai.com while the website is controlai.org
      note: Verified on controlai.org. They explicitly invite briefing requests — a legislator's office or an individual can ask for one.
    newsletter:
      label: Newsletter
      scope: Anyone
    homepage:
      label: Homepage
  remit: "Campaigning organisation working for a prohibition on the development of superintelligent AI. Three functions: public education (newsletter with 148,000+ readers), grassroots advocacy (tooling that helps tens of thousands contact their elected representatives), and direct policymaker briefing — claims 400+ lawmakers briefed since November 2024, with 160+ cross-party UK MPs and Peers and 35+ Canadian lawmakers having endorsed its statement."
  threat_model: Extinction risk from superintelligence, narrowly. Its stated position is that superintelligence could arrive before 2030 with no known containment method. No engagement with near-term harms.
  reality_check: Small, fast-moving, and it answers its email. Best-in-class if your goal is to get a loss-of-control concern in front of a legislator. It will not engage with bias, privacy or labour concerns.
  gov_channel: Direct and unusually effective for its size — its core product is legislator briefings, and it has secured named cross-party endorsements in three parliaments.
