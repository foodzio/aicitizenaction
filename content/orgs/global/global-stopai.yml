strings:
  name: StopAI
  the_ask: A permanent, enforceable global ban on all further development of frontier AI, plus citizen oversight bodies empowered to regulate or dismantle dangerous technologies.
  what_they_do: "Three fronts: public awareness, legislative influence, and non-violent direct action. Its own history page documents sit-ins inside OpenAI offices, a road blockade in front of OpenAI, banner drops and repeated protests at OpenAI and Microsoft since 2024."
  newcomer_action: Attend an event from its Luma calendar, or attend the court proceedings of member Wynd Kaufmyn in San Francisco (it asks local supporters to show up in red shirts); donate.
  tips: unclear — contactstopai@gmail.com
  geography: Primarily San Francisco Bay Area; one protest documented in Kinshasa, DRC.
  scale: Very small — a core of activists, not a staffed organisation. No published budget or headcount.
  spending: Not disclosed; donations via Donorbox.
  caution: "This is a civil-disobedience group and you should join only knowing that. Members have blockaded OpenAI's doors and been prosecuted: member Wynd Kaufmyn faced four misdemeanour charges (case CRI-25404422, San Francisco Superior Court), was denied the necessity defence, and the site states she was due to surrender to serve a sentence on 14 Aug 2026. It also subpoenaed Sam Altman (quashed). Its platform is broader than AI risk — it includes rejecting transhumanism and AI personhood, calls for a smaller economy, and bans on AI weapons. Not all actions are legal; attending a protest can carry arrest risk."
  routes:
