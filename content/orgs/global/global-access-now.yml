strings:
  name: Access Now
  remit: Digital rights organisation defending users at risk. On AI, advocates binding, enforceable human-rights-based governance and works against rights-violating automated decision systems. Operates a 24/7 Digital Security Helpline for civil society, and convenes RightsCon, the largest global digital-rights summit.
  threat_model: Human rights harms — surveillance, discrimination in ADM, censorship, and threats to activists, journalists and human rights defenders. Near-term and acute, with a strong Global Majority focus.
  reality_check: Among the most genuinely responsive organisations here, because it runs an actual operational helpline with staff obliged to answer. Scope is human rights and at-risk users; a frontier-alignment concern is out of scope.
  gov_channel: Strong — formal engagement at the UN Human Rights Council, EU institutions, and national regulators; a recognised civil-society interlocutor in multiple multilateral processes.
  routes:
    digital-security-helpline-24:
      label: Digital Security Helpline — 24/7, free, for civil society at risk
      scope: Activists, journalists, human rights defenders and civil society organisations facing a digital threat
      note: A real staffed emergency line, not a general inbox. https://www.accessnow.org/help/
    general-enquiries:
      label: General enquiries
      scope: Anyone
    legal:
      label: Legal
      scope: Legal matters
    press:
      label: Press
      scope: Media
    rightscon:
      label: RightsCon
      scope: Summit participation; RightsCon runs an open session-proposal call each cycle
      note: The open call for RightsCon sessions is a genuine route to put a topic in front of the global digital-rights community.
    contact-page:
      label: "Contact page (phone: +1 888 414 0100)"
      scope: General
    homepage:
      label: Homepage
    action:
      label: Action page
  the_ask: AI must be governed by binding, enforceable rules rooted in international human rights law — transparent, accountable and in the public interest — with particular scrutiny of biometric surveillance and AI in warfare.
  what_they_do: "Global digital rights advocacy, research (including 'Bodily harms: how AI and biometrics curtail human rights'), UN and EU policy work, opposition to autonomous weapons, and the RightsCon conference. Runs a 24/7 Digital Security Helpline."
  newcomer_action: If you are an activist, journalist or human rights defender facing a digital threat, open a case with the Digital Security Helpline; otherwise read and share its AI issue page.
  tips: yes — the Digital Security Helpline takes cases 24/7 from at-risk users worldwide
  geography: Global, with regional teams.
  scale: Large international NGO.
  spending: Grant and donation funded.
  caution: Its position is rights-based governance, not bans on AI development. The helpline is for people at risk, not a general complaints line — do not clog it with policy questions.
