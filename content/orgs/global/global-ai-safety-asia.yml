strings:
  name: AI Safety Asia (AISA)
  remit: Non-profit working to harmonise international governance of safe and secure AI 'the Asia way'. Delivers AI governance training to government officials and civil society — including director-level officials in Indonesia and parliamentarians in Malaysia — conducts policy research (including with Brookings on Southeast Asian AI safety governance), and runs courses such as a 10-week cooperative AI course with the Cooperative AI Foundation. Listed in UNESCO's Global AI Ethics Observatory CSO directory and the WEF AI Global Alliance.
  threat_model: Governance capacity and regional representation — the concern that AI safety norms are set in the West and imposed on Asia without local capability to evaluate them. Covers safety and security broadly rather than a specific technical threat.
  reality_check: "Small and growing; the kind of organisation that reads its own email. Strongest value if your concern needs a hearing in an Asian jurisdiction where Western AI safety organisations have no standing. UNVERIFIED: an independent aisafety.asia homepage was not confirmed — the UNESCO profile is the verified reference."
  gov_channel: Real and direct in-region — trains sitting officials and parliamentarians in several Asian states, which is unusually concrete access.
  routes:
    general-enquiries:
      label: General enquiries
      scope: Anyone
      note: Verified via the UNESCO Observatory CSO profile.
    linkedin:
      label: LinkedIn
      scope: Anyone
    unesco-observatory-profile:
      label: UNESCO Observatory profile
      scope: Reference
    homepage:
      label: Homepage
    action:
      label: Action page
  the_ask: Asian institutions — especially Southeast Asian and middle-power states — should have real leverage over how frontier AI is built and governed, before the terms are locked in by a handful of dominant actors.
  what_they_do: "Three programmes: Curate (helps governments map AI dependencies and connect to frontier-risk scientists), Inform (translates technical foresight into safeguards for negotiations), Catalyse (maintains channels between senior officials across bridge states). Listed by UNESCO as a civil society organisation and by the World Economic Forum."
  newcomer_action: Subscribe to the AI governance briefing newsletter; if you are a policymaker, researcher or organisation working on AI governance in Asia, email contact@aisafety.asia.
  tips: no
  geography: Asia, with emphasis on Southeast Asia and middle powers.
  scale: Small; headcount not disclosed. Non-profit.
  spending: Not disclosed; no donation page found.
  caution: Aimed at officials and researchers, not the general public — the get-involved page explicitly invites policymakers, researchers and organisations. If you are none of those, the newsletter is realistically your only route. No verified donation route.
