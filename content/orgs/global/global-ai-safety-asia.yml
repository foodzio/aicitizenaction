strings:
  name: AI Safety Asia (AISA)
  remit: Non-profit working to harmonise international governance of safe and secure AI 'the Asia way'. Delivers AI governance training to government officials and civil society — including director-level officials in Indonesia and parliamentarians in Malaysia — conducts policy research (including with Brookings on Southeast Asian AI safety governance), and runs courses such as a 10-week cooperative AI course with the Cooperative AI Foundation. Listed in UNESCO's Global AI Ethics Observatory CSO directory and the WEF AI Global Alliance.
  threat_model: Governance capacity and regional representation — the concern that AI safety norms are set in the West and imposed on Asia without local capability to evaluate them. Covers safety and security broadly rather than a specific technical threat.
  reality_check: "Small and growing; the kind of organisation that reads its own email. Strongest value if your concern needs a hearing in an Asian jurisdiction where Western AI safety organisations have no standing. UNVERIFIED: an independent aisafety.asia homepage was not confirmed — the UNESCO profile is the verified reference."
  gov_channel: Real and direct in-region — trains sitting officials and parliamentarians in several Asian states, which is unusually concrete access.
