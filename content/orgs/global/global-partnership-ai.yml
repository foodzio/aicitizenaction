strings:
  name: Partnership on AI (PAI)
  remit: "Multistakeholder convener with 100+ partner organisations spanning Amazon, Google, Meta, Microsoft, OpenAI, Apple alongside ACLU, ARTICLE 19, Future of Privacy Forum, UNICEF, UNDP and universities. Produces guidance documents and frameworks — notably on safe foundation model deployment, synthetic media, and AI and labour — across four programme areas: AI and Human Connection; AI, Labor and the Economy; Safety-Critical AI; and Public Policy."
  threat_model: Deliberately plural. Its Safety-Critical AI programme touches frontier deployment risk; its labour and human-connection work is squarely near-term/structural. Its distinctive contribution is process norms rather than a risk thesis.
  reality_check: Consensus-bound. With the largest labs as partners, PAI's outputs are negotiated to the level everyone can accept, which limits how sharp a concern it will carry. Organisational partnership is possible; individual input is not really a thing. Middling responsiveness.
  gov_channel: Moderate — PAI guidance is cited in policy processes and it participates in multistakeholder forums, but it is a norm-setter, not an advocate.
