strings:
  name: PauseAI
  remit: Volunteer grassroots movement calling for a halt to development of the most powerful general AI systems until safety is assured, and for 'a prohibition on the development of superintelligence, not lifted before there is broad scientific consensus'. Organises protests, lobbying days, letter-writing and local meetups; maintains extensive public explainer material.
  threat_model: Existential risk from uncontrolled AI as the headline, but notably broader in its public messaging than MIRI or ControlAI — it also cites job displacement, democratic erosion and economic instability as reasons to pause.
  reality_check: "Maximally open — a volunteer can join the Discord today and be organising within a week. That openness is also its limit: it has little institutional access, and its confrontational framing means mainstream policy bodies keep it at arm's length. Good for mobilisation, poor for a targeted escalation."
  gov_channel: Weak-to-moderate — organises lobbying days and has met individual legislators, but has no formal channel and is treated as an outside-game actor.
  routes:
    discord-organisational-hub-anyone:
      label: Discord — the organisational hub; anyone can join and start contributing immediately
      scope: Anyone, worldwide
      note: This is where the actual organising happens.
    local-communities-directory-find:
      label: Local communities directory — find or start a chapter
      scope: Anyone
    join-page:
      label: Join page
      scope: Anyone
    contact-form:
      label: Contact form
      scope: General
      note: No public email address is listed.
    homepage:
      label: Homepage
    action:
      label: Action page
  the_ask: Stop the development of the most powerful general AI systems, internationally, until we know how to make them safe.
  what_they_do: Federation of local chapters coordinated by a global entity; petitions, protests, an email-your-representative builder, lobbying guides, 'microcommits' (weekly bite-sized actions), microgrants and volunteer stipends.
  newcomer_action: Sign the PauseAI statement and the 'Say No To Superintelligent AI' petition (5 minutes), join the Discord, then use the email builder to write to your representative.
  tips: No formal tip line; contact form and Discord
  geography: International. Legally Stichting PauseAI (KvK 92951031), Netherlands. Local communities in many countries.
  scale: Small paid core (CEO, Organizing Director, Communications Director; chapter directors paid by PauseAI Global) plus a large volunteer base. Budget not published.
  spending: Not disclosed. Accepts donations at pauseai.info/donate.
  caution: The ask is a halt to frontier development, not tighter rules. Protest-based but explicitly lawful — distinct from StopAI. Chapters vary a lot in activity; check your local one is alive before committing.
