strings:
  name: PauseAI
  remit: Volunteer grassroots movement calling for a halt to development of the most powerful general AI systems until safety is assured, and for 'a prohibition on the development of superintelligence, not lifted before there is broad scientific consensus'. Organises protests, lobbying days, letter-writing and local meetups; maintains extensive public explainer material.
  threat_model: Existential risk from uncontrolled AI as the headline, but notably broader in its public messaging than MIRI or ControlAI — it also cites job displacement, democratic erosion and economic instability as reasons to pause.
  reality_check: "Maximally open — a volunteer can join the Discord today and be organising within a week. That openness is also its limit: it has little institutional access, and its confrontational framing means mainstream policy bodies keep it at arm's length. Good for mobilisation, poor for a targeted escalation."
  gov_channel: Weak-to-moderate — organises lobbying days and has met individual legislators, but has no formal channel and is treated as an outside-game actor.
  routes:
    discord-organisational-hub-anyone:
      label: Discord — the organisational hub; anyone can join and start contributing immediately
      scope: Anyone, worldwide
      note: This is where the actual organising happens.
