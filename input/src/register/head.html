<title>AI Safety Concern Register</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDEEEA; --surface:#FBFBF9; --surface-2:#F4F5F1;
  --ink:#1A1C1A; --ink-2:#5A605B; --ink-3:#818780;
  --rule:#D5D7D1; --rule-2:#C2C5BE;
  --accent:#6E2639; --accent-2:#8F3A50; --accent-wash:#F3E7EA; --on-accent:#FBFBF9;
  --open:#1F6249; --limited:#7D5F10; --closed:#6B6F6B;
  --open-bg:#E2EFE8; --limited-bg:#F4EEDC; --closed-bg:#E8E9E6;
  --shadow:0 1px 2px rgba(26,28,26,.06), 0 4px 14px rgba(26,28,26,.05);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141613; --surface:#1C1F1C; --surface-2:#232722;
    --ink:#E8EAE4; --ink-2:#A0A89F; --ink-3:#7C847B;
    --rule:#2E332E; --rule-2:#3C423B;
    --accent:#DB93A5; --accent-2:#E8AEBD; --accent-wash:#2E1F24; --on-accent:#141613;
    --open:#74C89A; --limited:#D8B863; --closed:#939A92;
    --open-bg:#1A2C23; --limited-bg:#2C2718; --closed-bg:#242722;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#141613; --surface:#1C1F1C; --surface-2:#232722;
  --ink:#E8EAE4; --ink-2:#A0A89F; --ink-3:#7C847B;
  --rule:#2E332E; --rule-2:#3C423B;
  --accent:#DB93A5; --accent-2:#E8AEBD; --accent-wash:#2E1F24; --on-accent:#141613;
  --open:#74C89A; --limited:#D8B863; --closed:#939A92;
  --open-bg:#1A2C23; --limited-bg:#2C2718; --closed-bg:#242722;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:0}
a{color:var(--accent);text-underline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}

/* header */
header.masthead{border-bottom:1px solid var(--rule-2);background:var(--surface)}
.masthead .wrap{padding-block:34px 26px}
h1{font-family:var(--serif);font-size:clamp(34px,7vw,54px);font-weight:500;line-height:1.02;letter-spacing:-.015em;margin-block:10px 14px}
.standfirst{font-family:var(--serif);font-size:clamp(17px,2.4vw,20px);line-height:1.45;color:var(--ink-2);max-width:60ch}
.tallies{display:flex;flex-wrap:wrap;gap:0;margin-top:22px;border-top:1px solid var(--rule)}
.tally{padding:12px 22px 12px 0;margin-right:22px;border-right:1px solid var(--rule)}
.tally:last-child{border-right:0}
@media(max-width:620px){
  .tallies{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .tally{border-right:0;border-bottom:1px solid var(--rule);margin-right:0;padding-right:12px}
  .tally:nth-child(odd){border-right:1px solid var(--rule)}
  .tally:nth-last-child(-n+2){border-bottom:0}
}
.tally b{display:block;font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tally span{font-size:12px;color:var(--ink-3);letter-spacing:.02em}

section{padding-block:46px}
section + section{border-top:1px solid var(--rule)}
h2{font-family:var(--serif);font-size:clamp(25px,4vw,34px);font-weight:500;letter-spacing:-.012em;margin-block:8px 12px}
h3{font-family:var(--sans);font-size:16px;font-weight:700;letter-spacing:-.005em}
.lede{max-width:66ch;color:var(--ink-2);font-size:16px}
p{margin-block:0 14px}
.prose{max-width:68ch}
.prose p{margin-bottom:15px}

/* triage */
.triage{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:24px}
.tri{text-align:left;background:var(--surface);border:1px solid var(--rule-2);border-radius:3px;padding:15px 16px 16px;cursor:pointer;font:inherit;color:inherit;transition:border-color .12s,background .12s}
.tri:hover{border-color:var(--accent);background:var(--surface-2)}
.tri[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash);box-shadow:inset 3px 0 0 var(--accent)}
.tri .q{font-weight:600;font-size:14.5px;display:block;margin-bottom:5px;line-height:1.35}
.tri .a{font-size:12.5px;color:var(--ink-2);line-height:1.45;display:block}
.tri .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:8px;display:block;font-variant-numeric:tabular-nums}
.triage-out{margin-top:20px;border-left:2px solid var(--accent);padding:14px 0 4px 18px;background:transparent}
.triage-out h3{margin-bottom:8px}
.triage-out p{font-size:14.5px;color:var(--ink-2);max-width:68ch}
.triage-out .goto{font-size:13.5px;font-weight:600}

/* filing format */
.steps{counter-reset:s;margin-top:26px;display:grid;gap:0}
.step{display:grid;grid-template-columns:44px 1fr;gap:16px;padding-block:18px;border-top:1px solid var(--rule)}
.step:last-child{border-bottom:1px solid var(--rule)}
.step::before{counter-increment:s;content:counter(s,decimal-leading-zero);font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600;padding-top:3px}
.step h3{margin-bottom:5px}
.step p{font-size:14.5px;color:var(--ink-2);margin-bottom:8px;max-width:62ch}
.step .why{font-size:13px;color:var(--ink-3);font-style:italic;max-width:62ch;margin:0}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
@media(max-width:760px){.compare{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--rule-2);border-radius:3px;padding:18px 19px}
.card.bad{border-left:3px solid var(--closed)}
.card.good{border-left:3px solid var(--open)}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono);font-weight:600;margin-bottom:11px}
.card.bad h3{color:var(--closed)} .card.good h3{color:var(--open)}
.quote{font-family:var(--serif);font-size:15px;line-height:1.5;color:var(--ink);background:var(--surface-2);padding:13px 15px;border-radius:2px;margin-bottom:12px}
.field{margin-bottom:11px}
.field dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px;font-weight:600}
.field dd{margin:0;font-size:14px;line-height:1.5;color:var(--ink)}
.verdict{font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:11px;margin-top:2px}
.binned{margin-top:26px;background:var(--surface);border:1px solid var(--rule-2);border-radius:3px;padding:18px 20px}
.binned ul{margin:10px 0 0;padding-left:0;list-style:none;display:grid;gap:9px}
.binned li{font-size:14px;color:var(--ink-2);padding-left:20px;position:relative;line-height:1.5}
.binned li::before{content:"×";position:absolute;left:2px;top:-1px;color:var(--closed);font-weight:700;font-size:15px}
.binned li b{color:var(--ink);font-weight:600}
.powertable{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}
.powertable th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:0 14px 8px 0;border-bottom:1px solid var(--rule-2)}
.powertable td{padding:11px 14px 11px 0;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
.powertable td:first-child{color:var(--ink);font-weight:600;white-space:nowrap}
.tablescroll{overflow-x:auto}

/* register */
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);border-bottom:1px solid var(--rule-2);padding-block:11px;margin-bottom:0}
.searchrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#q{flex:1 1 230px;min-width:0;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--rule-2);border-radius:3px;background:var(--surface);color:var(--ink)}
#q:focus,select:focus,.chip:focus-visible,.tri:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select{font:inherit;font-size:13.5px;padding:9px 10px;border:1px solid var(--rule-2);border-radius:3px;background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--rule-2);border-radius:20px;background:var(--surface);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.countline{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:9px;font-variant-numeric:tabular-nums;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.clearbtn{font:inherit;font-family:var(--mono);font-size:11.5px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}

.records{margin-top:14px}
details.rec{border-bottom:1px solid var(--rule);background:transparent}
details.rec summary{list-style:none;cursor:pointer;padding:14px 0;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
details.rec summary::-webkit-details-marker{display:none}
.rec-main{min-width:0}
.rec-name{font-weight:600;font-size:15.5px;line-height:1.3;letter-spacing:-.005em}
.rec-meta{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rec-meta .sep{color:var(--rule-2)}
.rec-side{display:flex;gap:7px;align-items:center;flex-shrink:0}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:2px;font-weight:600;white-space:nowrap}
.pill.open{background:var(--open-bg);color:var(--open)}
.pill.limited{background:var(--limited-bg);color:var(--limited)}
.pill.none{background:var(--closed-bg);color:var(--closed)}
.rcount{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rec-body{padding:2px 0 22px;display:grid;gap:16px}
.blk h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 6px}
.blk p{font-size:14px;line-height:1.55;color:var(--ink-2);margin:0;max-width:78ch}
.blk.reality p{color:var(--ink);background:var(--surface);border-left:2px solid var(--accent);padding:11px 14px;border-radius:0 2px 2px 0;max-width:78ch}
.routes{display:grid;gap:8px}
.route{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:11px 13px}
.route-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.route-label{font-weight:600;font-size:13.5px}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:var(--surface-2);color:var(--ink-3);border:1px solid var(--rule);font-weight:600}
.tag.ok{color:var(--open);border-color:var(--open);background:var(--open-bg)}
.tag.unv{color:var(--limited);border-color:var(--limited);background:var(--limited-bg)}
.route-val{font-family:var(--mono);font-size:12.5px;word-break:break-word;margin:3px 0 5px}
.route-val a{text-decoration:underline}
.route-scope{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.route-note{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:4px;font-style:italic}
.home{font-family:var(--mono);font-size:12px}
.empty{padding:40px 0;color:var(--ink-3);font-size:15px;text-align:center}
.more{display:block;width:100%;margin-top:20px;padding:12px;font:inherit;font-size:14px;font-weight:600;background:var(--surface);border:1px solid var(--rule-2);border-radius:3px;color:var(--accent);cursor:pointer}
footer{border-top:1px solid var(--rule-2);background:var(--surface);margin-top:0}
footer .wrap{padding-block:34px 44px}
footer p{font-size:13.5px;color:var(--ink-2);max-width:72ch}
footer h3{margin-bottom:8px}
.srcs{font-size:13px;color:var(--ink-3);margin-top:14px}
.srcs a{margin-right:14px;display:inline-block}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
